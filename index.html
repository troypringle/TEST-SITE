<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Swipe Machine</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f4f4;
}
.wrap{
  max-width:1200px;
  margin:30px auto;
  display:grid;
  grid-template-columns:350px 1fr 1fr;
  gap:20px;
}
.card{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
h2{margin-top:0}
input,textarea,select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  font-size:15px;
}
textarea{min-height:100px}
button{
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
.green{background:#2e7d32;color:white}
.blue{background:#1976d2;color:white}
#bodyEditor{
  border:1px solid #ccc;
  min-height:200px;
  padding:10px;
}
.preview{
  border:1px solid #ccc;
  min-height:250px;
  padding:10px;
  background:white;
}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h2>Setup</h2>

<label>Groq API Key</label>
<input id="apiKey" type="password">

<label>Offer Name</label>
<input id="offerName" type="text">

<label>Benefits (1 per line)</label>
<textarea id="benefits"></textarea>

<button class="green" id="saveKey">Save Key</button>
</div>


<div class="card">
<h2>Editor</h2>

<label>Subject</label>
<input id="subject" type="text">

<button class="green" id="genSubject">Generate Subject</button>

<hr>

<label>Email Body</label>
<div id="bodyEditor" contenteditable="true"></div>

<br>
<button class="green" id="genBody">Generate Body</button>
<button class="blue" id="clearBody">Clear</button>
</div>


<div class="card">
<h2>Preview</h2>

<strong>Subject:</strong>
<div id="prevSubject"></div>

<br>
<strong>Body:</strong>
<div class="preview" id="prevBody"></div>

<br>
<button class="green" id="copyFull">Copy Full Email</button>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const apiKeyInput = document.getElementById("apiKey");
const offerName = document.getElementById("offerName");
const benefits = document.getElementById("benefits");
const subject = document.getElementById("subject");
const bodyEditor = document.getElementById("bodyEditor");

const prevSubject = document.getElementById("prevSubject");
const prevBody = document.getElementById("prevBody");

if(localStorage.getItem("groq_key")){
  apiKeyInput.value = localStorage.getItem("groq_key");
}

document.getElementById("saveKey").onclick = function(){
  localStorage.setItem("groq_key", apiKeyInput.value.trim());
  alert("Key saved");
};

function updatePreview(){
  prevSubject.textContent = subject.value;
  prevBody.innerHTML = bodyEditor.innerHTML;
}

subject.addEventListener("input", updatePreview);
bodyEditor.addEventListener("input", updatePreview);

async function callGroq(prompt){

  const key = apiKeyInput.value.trim();
  if(!key){
    alert("Enter API key");
    return null;
  }

  try{
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + key
      },
      body:JSON.stringify({
        model:"llama-3.1-8b-instant",
        messages:[{role:"user",content:prompt}],
        temperature:0.7
      })
    });

    const data = await response.json();

    if(!data.choices){
      alert("API Error");
      console.log(data);
      return null;
    }

    return data.choices[0].message.content.trim();

  }catch(e){
    alert("Network error");
    console.log(e);
    return null;
  }
}

document.getElementById("genSubject").onclick = async function(){
  const prompt = "Write one curiosity-driven email subject line for: "
    + offerName.value +
    ". Benefits: " + benefits.value +
    ". Return only the subject line.";

  const result = await callGroq(prompt);
  if(result){
    subject.value = result;
    updatePreview();
  }
};

document.getElementById("genBody").onclick = async function(){
  const prompt = "Write a short marketing email (2 short paragraphs max). Offer: "
    + offerName.value +
    ". Benefits: " + benefits.value;

  const result = await callGroq(prompt);
  if(result){
    bodyEditor.innerHTML = result.replace(/\n/g,"<br>");
    updatePreview();
  }
};

document.getElementById("clearBody").onclick = function(){
  bodyEditor.innerHTML = "";
  updatePreview();
};

document.getElementById("copyFull").onclick = function(){
  const full =
    "Subject: " + subject.value + "\n\n" +
    bodyEditor.innerText;

  navigator.clipboard.writeText(full);
  alert("Copied");
};

updatePreview();

});
</script>

</body>
</html>
