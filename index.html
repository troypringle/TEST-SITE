<!DOCTYPE html>
<html lang="en">
<head>
    <title>Official PRELAUNCH By Joel Therien My Sponsors Downline</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    
    <style>
        /* ==================================================== */
        /* 1. MAIN PAGE STYLES (PRELAUNCH PAGE)                */
        /* ==================================================== */
        * { box-sizing: border-box; }
        body {
            background: #000;
            color: white;
            margin: 0; padding: 10px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column; 
            align-items: center;
            overflow-x: hidden; /* Safety net for offscreen movement */
        }

        .page-border {
            width: 100%;
            max-width: 820px;
            border: 2px solid #1a1a1a; 
            border-radius: 13px;
            padding: 12px;
            background: #020202; 
            text-align: center;
            z-index: 5; /* Content layer */
        }

        .streak-container {
            display: inline-block;
            width: 100%;
            max-width: 900px; 
            height: 99px;      
            background: url('https://linkpod.s3.us-east-1.amazonaws.com/uploads/block_images/f3511efd5936e0986b6fb7034cecc2c7.png') center / 100% 100% no-repeat;
            position: relative;
            margin-bottom: 11px;
            border-radius: 4px;
        }
        .streak-text {
            font-size: 29px; 
            color: #ff0000;
            font-weight: 900;
            text-transform: uppercase;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 93%;
            margin: 0;
        }

        .banner-img-container {
            display: block;
            margin: 0 auto;
            max-width: 778px;
            border: 1px solid rgba(144, 238, 144, 0.2); 
            box-shadow: 0 0 15px rgba(144, 238, 144, 0.45); 
            border-radius: 6px;
            overflow: hidden; 
        }
        .banner-img { width: 100%; height: auto; display: block; }
        .spacer-between { height: 25px; }

        .headline {
            font-size: 29px; 
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 21px;
            display: block;
        }
        .red-arrow { color: #ff0000; margin-right: 6px; }

        .video-container-box {
            position: relative;
            width: 98%;
            max-width: 780px;
            margin: 0 auto 10px auto;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border: 1.5px solid #004d26; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5); 
            background: #000;
            overflow: hidden;
            border-radius: 4px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .touch-shield {
            position: absolute;
            top: 0; left: 0; right: 0; 
            height: 38%; 
            z-index: 10;
        }

        .video-cta-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 53px;
            background: rgba(0, 30, 15, 0.3);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            border-top: 1px solid rgba(0, 77, 38, 0.4);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1), inset 0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        .video-cta-overlay a {
            color: #ffffff;
            font-size: 19px;
            font-weight: 900;
            text-decoration: none;
            width: 99%;
            text-shadow: 2px 2px 4px #000000;
        }

        .yoda-quote {
            font-size: 16px; 
            color: #888;    
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 600px) {
            .streak-text { font-size: 22px; } 
            .headline { font-size: 22px; }   
            .streak-container { height: 75px; }
            .spacer-between { height: 15px; }
            .video-cta-overlay a { font-size: 16px; }
        }

        /* ==================================================== */
        /* 2. ALTERNATING FLOATIE START (PLACEHOLDERS)         */
        /* ==================================================== */
        
        /* THE COMPLEX MOVEMENT KEYFRAMES */
        @keyframes extremeDrift {
            0% { transform: translate(5vw, 5vh) rotate(0deg); }
            10% { transform: translate(90vw, 15vh) rotate(15deg); } /* Fast Dash Right */
            12% { transform: translate(92vw, 17vh) rotate(15deg); } /* Hesitate Right */
            25% { transform: translate(50vw, 90vh) rotate(-10deg); } /* Dive Deep Bottom */
            40% { transform: translate(-10vw, 50vh) rotate(-30deg); } /* Dash Left Offscreen */
            55% { transform: translate(105vw, 105vh) rotate(45deg); } /* Dash Bottom Right Corner */
            70% { transform: translate(20vw, 30vh) rotate(5deg); } /* Swoop Back Top Left */
            85% { transform: translate(80vw, 5vh) rotate(0deg); } /* Top Right */
            100% { transform: translate(5vw, 5vh) rotate(0deg); } /* Back Home */
        }

        /* THE CONTAINER (Position & Drift) */
        .float-container {
            position: fixed;
            top: 0; left: 0;
            z-index: 10000; /* Stays above everything */
            pointer-events: none; /* CLICK-THROUGH ACTIVE */
            
            /* Initial transparency for smooth fade-in via JS */
            opacity: 0; 
            
            /* THE MOVEMENT ANIMATION (Linear for constant complex speed) */
            animation: extremeDrift 18s linear infinite; 
        }

        /* THE CONTENT (Shape, Glow, and Placeholders) */
        .float-content {
            /* SIZE: Slightly smaller for elegant drift */
            width: 100px;
            height: 100px;
            
            /* GHOST PRINCIPLES */
            mix-blend-mode: color-dodge; /* Vaporwave accent */
            transition: opacity 0.3s, background 0.3s; /* Smooth alternating swap */

            /* THE odd, irregular, ghost-like shape placeholder */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            
            /* MINT GREEN GLOW (Matches Video Border) */
            filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.9)) 
                    drop-shadow(0 0 25px rgba(0, 255, 136, 0.5));
            
            /* Initial Background state (Will be overwritten by JS) */
            background: transparent;
        }

        /* ALTERNATING FLOATIE END                              */
        /* ==================================================== */
    </style>
</head>
<body>

<div class="float-container" id="floatMaster">
    <div class="float-content" id="floatContent"></div>
</div>
<div class="page-border">
    <div class="streak-container">
        <p class="streak-text">Time Sensitive New Updates</p>
    </div>

    <a href="https://troypringle2.aimatrixspillover.com/" class="banner-img-container">
        <img src="https://linkpod.s3.us-east-1.amazonaws.com/uploads/block_images/2635024737b92bb05b71e8c4a98a9751.png"
             class="banner-img" alt="Secure Your Spot">
    </a>

    <div class="spacer-between"></div>

    <span class="headline">
        <span class="red-arrow">➤</span> Watch How Eric Builds a Massive Downline
    </span>

    <div class="video-container-box">
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/S-T07JIxQEk?rel=0&modestbranding=1&controls=1&showinfo=0&iv_load_policy=3&playsinline=1"
                    frameborder="0" allowfullscreen></iframe>
        </div>
        
        <div class="touch-shield"></div>

        <div class="video-cta-overlay">
            <a href="https://troypringle2.aimatrixspillover.com/" target="_blank"> CLICK TO SECURE YOUR SPOT ✔️</a>
        </div>
    </div>

    <div class="yoda-quote">"do or do not there is no try" - yoda</div> 
</div>

<script>
    /* ==================================================== */
    /* FLOATIE LOGIC START                                  */
    /* ==================================================== */
    (function() {
        var master = document.getElementById('floatMaster');
        var content = document.getElementById('floatContent');
        
        /* These are CSS placeholders representing the "eye-popping" 
           concepts we discussed. They combine 'Candy' colors 
           (Pink/Orange) with futuristic Blue/Green accents.
        */
        var styles = [
            // Concept 1: "Vaporwave Vortex" (Pink core, Green accent)
            "radial-gradient(circle at center, #ff0055 0%, #ffcc00 60%, transparent 100%)",
            
            // Concept 2: "Quantum Choice" (Blue/Purple choice theme)
            "linear-gradient(135deg, #6c5ce7 0%, #0984e3 100%)",
            
            // Concept 3: "Neon Matrix" (Jagged Green Code vibe)
            "repeating-linear-gradient(45deg, transparent, transparent 10px, #00ff88 10px, #00ff88 11px), linear-gradient(180deg, #000, #111)",
            
            // Concept 4: "Urgency Orange" (Direct lead gen push)
            "linear-gradient(135deg, #d63031 0%, #e17055 100%)"
        ];
        
        // Initial state: Show first style and fade in the container
        content.style.background = styles[0];
        master.style.transition = 'opacity 1s';
        master.style.opacity = '1';
        
        // Tiny logic to swap randomly every 6 seconds
        function randomStyleSwap() {
            var randomIndex = Math.floor(Math.random() * styles.length);
            
            /* Smooth transition swap:
               1. CSS handles fade background change via transition: background 0.3s
            */
            content.style.background = styles[randomIndex];
            
            /* Wait a tiny moment to prevent the blend mode from flashing.
               Set opacity directly here.
            */
            content.style.opacity = '1';
        }
        
        // Start the random alternating every 6 seconds
        setInterval(randomStyleSwap, 6000);
    })();
    /* FLOATIE LOGIC END                                    */
    /* ==================================================== */

    /* ORIGINAL JAVASCRIPT FOR URL PARAMS (Kept)             */
    (function() {
        var params = window.location.search;
        if (params) {
            var links = document.getElementsByTagName('a');
            for (var i = 0; i < links.length; i++) {
                if(links[i].href.indexOf('aimatrixspillover') !== -1) {
                    var sep = links[i].href.indexOf('?') !== -1 ? '&' : '?';
                    links[i].href += sep + params.substring(1);
                }
            }
        }
    })();
</script>

</body>
</html>
