<!DOCTYPE html>
<html lang="en">
<head>
    <!-- [Previous head content remains exactly the same] -->
</head>
<body>

    <!-- [Previous body content remains exactly the same until the JavaScript section] -->

    <script>
        // ===== STATE =====
        let state = {
            apiKey: localStorage.getItem('mlgs_api_key') || '',
            apiProvider: localStorage.getItem('mlgs_api_provider') || 'openrouter',
            model: localStorage.getItem('mlgs_model') || 'meta-llama/llama-3.1-8b-instruct:free',
            signature: localStorage.getItem('mlgs_signature') || '',
            templates: JSON.parse(localStorage.getItem('mlgs_templates') || '[]'),
            currentType: 'curiosity',
            usage: {
                session: 0,
                daily: parseInt(localStorage.getItem('mlgs_daily_tokens') || '0'),
                lastDate: localStorage.getItem('mlgs_last_date') || new Date().toDateString(),
                last: 0
            }
        };

        // Reset daily counter if new day
        if (state.usage.lastDate !== new Date().toDateString()) {
            state.usage.daily = 0;
            localStorage.setItem('mlgs_daily_tokens', '0');
            localStorage.setItem('mlgs_last_date', new Date().toDateString());
        }

        // ===== UPDATED MODEL LIST =====
        const models = {
            openrouter: {
                'meta-llama/llama-3.1-8b-instruct:free': 'Meta: Llama 3.1 8B (Free)',
                'meta-llama/llama-3.1-70b-instruct:free': 'Meta: Llama 3.1 70B (Free)',
                'google/gemini-flash-1.5': 'Google: Gemini Flash 1.5 (Free)',
                'mistralai/mistral-7b-instruct:free': 'Mistral: 7B Instruct (Free)',
                'microsoft/wizardlm-2-8x22b': 'Microsoft: WizardLM 2 (Free)'
            },
            groq: {
                'llama-3.1-70b-versatile': 'Llama 3.1 70B (Groq)'
            }
        };

        // ===== PROMPTS =====
        const prompts = {
            curiosity: {
                subject: `Generate 10 curiosity-driven subject lines for MLGS (My Lead Gen Secret). Focus on "weird trick", discovery, numbers. Under 60 chars. No spam words like "free". Output ONLY numbered list 1-10, nothing else.`,
                body: `Write a promotional email for My Lead Gen Secret (MLGS).

Key benefits:
- 100 fresh leads daily (automatic)
- $5 commission per referral
- $60 one-time payment
Link: https://troypringle.github.io/MLGS-Page/

FORMAT EXACTLY:
<p><span style="font-size:16px"><span style="color:#000000">⭐{!name_fix}</span></span></p>

<p><span style="font-size:16px"><span style="color:#000000">Your compelling hook here.</span></span></p>

<p><span style="font-size:16px"><a href="https://troypringle.github.io/MLGS-Page/" target="_blank"><span style="color:#0000cc">Click here now</span></a></span></p>

Use curiosity angle. 10-14 lines. Excited tone. NO signature.`
            },
            // [Rest of prompts remain the same]
        };

        // ===== TOAST =====
        function toast(msg, isError = false) {
            const el = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = msg;
            el.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ===== API CALL - UPDATED =====
        async function callAI(prompt) {
            if (!state.apiKey) {
                toast('❌ Set API key first', true);
                document.getElementById('apiCard').scrollIntoView({behavior: 'smooth'});
                return null;
            }

            const apiUrls = {
                openrouter: 'https://openrouter.ai/api/v1/chat/completions',
                groq: 'https://api.groq.com/openai/v1/chat/completions'
            };

            try {
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${state.apiKey}`
                };

                if (state.apiProvider === 'openrouter') {
                    headers['HTTP-Referer'] = window.location.href;
                    headers['X-Title'] = 'MLGS Swipe Machine';
                }

                const res = await fetch(apiUrls[state.apiProvider], {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        model: state.model,
                        messages: [{role: 'user', content: prompt}],
                        temperature: 0.9,
                        max_tokens: 2000
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error?.message || 'API error');
                }

                const data = await res.json();

                // Track token usage (OpenRouter returns usage data)
                if (data.usage) {
                    const tokensUsed = data.usage.total_tokens || 0;
                    trackTokens(tokensUsed);
                }

                return data.choices[0].message.content;
            } catch (err) {
                toast('❌ ' + err.message, true);
                return null;
            }
        }

        // ===== INIT - UPDATED =====
        function init() {
            // Update model selector
            const modelSelect = document.getElementById('modelSelect');
            modelSelect.innerHTML = '';

            const currentModels = models[state.apiProvider];
            for (const [value, label] of Object.entries(currentModels)) {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = label;
                if (value === state.model) option.selected = true;
                modelSelect.appendChild(option);
            }

            document.getElementById('apiProvider').value = state.apiProvider;
            document.getElementById('apiKeyInput').value = state.apiKey;

            if (state.apiProvider === 'groq') {
                modelSelect.disabled = true;
            } else {
                modelSelect.disabled = false;
            }

            renderTemplates();
            updateUsageDisplay();
            updatePreview();

            const draftBody = localStorage.getItem('mlgs_draft_body');
            const draftSubject = localStorage.getItem('mlgs_draft_subject');
            if (draftBody) document.getElementById('bodyEditor').value = draftBody;
            if (draftSubject) document.getElementById('subjectInput').value = draftSubject;
            updatePreview();
        }

        // ===== API PROVIDER CHANGE - UPDATED =====
        document.getElementById('apiProvider').addEventListener('change', (e) => {
            const provider = e.target.value;
            const modelSelect = document.getElementById('modelSelect');

            modelSelect.innerHTML = '';
            const currentModels = models[provider];

            for (const [value, label] of Object.entries(currentModels)) {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = label;
                modelSelect.appendChild(option);
            }

            if (provider === 'groq') {
                modelSelect.disabled = true;
                state.model = 'llama-3.1-70b-versatile';
            } else {
                modelSelect.disabled = false;
                state.model = 'meta-llama/llama-3.1-8b-instruct:free';
            }

            state.apiProvider = provider;
            localStorage.setItem('mlgs_api_provider', provider);
            localStorage.setItem('mlgs_model', state.model);
        });

        // [Rest of the JavaScript remains exactly the same]

        init();
    </script>

</body>
</html>
