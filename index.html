<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Email Swipe Machine</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root {
      --bg: #d4c4a8; --panel: #f5f0e6; --panel2: #efe6d8; --border: #c9b896;
      --muted: #5c4d3a; --gold: #b8860b; --green: #2e7d32; --blue: #1976d2; --red: #d32f2f;
      --shadow: 0 4px 0px rgba(0,0,0,0.2);
      --btn-h: 40px;
    }
    body.theme-slate {
      --bg: #111827; --panel: #1f2937; --panel2: #243244; --border: #374151;
      --muted: #cbd5e1; --gold: #fbbf24; --green: #22c55e; --red: #ef4444;
    }
    * { box-sizing: border-box; font-size: 16px; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: #111; line-height: 1.6; }

    .topbar { background: var(--panel); border-bottom: 3px solid var(--gold); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    .grid { display: grid; grid-template-columns: 240px 1fr 1fr; gap: 16px; padding: 16px; transition: all 0.3s ease; }
    .grid.sidebar-closed { grid-template-columns: 60px 1fr 1fr; }

    .card { background: var(--panel); border: 2px solid var(--border); border-radius: 10px; padding: 16px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

    .sidebar-content { transition: opacity 0.2s; }
    .sidebar-closed .sidebar-content { opacity: 0; visibility: hidden; height: 0; overflow: hidden; }

    .btn {
      border: 2px solid rgba(0,0,0,0.1); background: var(--panel2); color: #111;
      height: var(--btn-h); padding: 0 15px; border-radius: 8px; cursor: pointer;
      font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
      white-space: nowrap; transition: all 0.1s ease;
      box-shadow: var(--shadow);
      position: relative;
      top: 0;
    }
    .btn:hover { filter: brightness(1.05); top: -2px; box-shadow: 0 6px 0px rgba(0,0,0,0.15); }
    .btn:active { top: 3px; box-shadow: 0 1px 0px rgba(0,0,0,0.1); transform: scale(0.98); }

    .btnGreen { background: var(--green); color: #fff; }
    .btnBlue { background: var(--blue); color: #fff; }
    .btnRed { background: var(--red); color: #fff; }
    .btnIcon { padding: 0 10px; font-size: 18px; }
    .btnSmall { height: 32px; font-size: 13px; }
    input, select, textarea { width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 12px; background: #fff; }
    
    /* Toolbar Styling */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--panel2); padding: 8px; border: 2px solid var(--border); border-bottom: 0; border-radius: 8px 8px 0 0; }
    .toolbar select { width: auto; min-width: 140px; margin: 0; height: 32px; font-weight: bold; }

    #bodyEditor, #sourceEditor { width: 100%; min-height: 450px; background: #fff; border: 2px solid var(--border); padding: 15px; outline: none; margin: 0 auto; overflow-y: auto; }
    #sourceEditor { display: none; font-family: monospace; }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
    .modal.show { display: flex; }
    .modalInner { background: var(--panel); border: 4px solid var(--gold); border-radius: 12px; padding: 25px; width: 100%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

    .tag-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .preview-body-frame { background: #fff; border: 2px solid var(--border); padding: 25px; min-height: 450px; }
    .preview-subject-box { background: #fff; border: 2px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 20px; min-height: 50px; font-weight: bold; }
  </style>
</head>
<body>

<div id="toast" style="position:fixed; bottom:20px; right:20px; background:#333; color:#fff; padding:12px 24px; display:none; border-radius:8px; z-index:99999;"></div>

<!-- API Keys Modal -->
<div class="modal" id="apiModal"><div class="modalInner">
  <h2 style="color:var(--gold); margin-top:0;">API Keys</h2>
  <label style="font-size:11px; font-weight:800;">GROQ KEY (Llama)</label>
  <input id="apiKey" type="password" placeholder="gsk_...">
  <p style="font-size:12px;">Puter Gemini is used by default (No key required).</p>
  <button class="btn btnGreen" style="width:100%" onclick="saveKeys()">Save Keys</button>
  <button class="btn" style="width:100%; margin-top:10px;" onclick="$('apiModal').classList.remove('show')">Cancel</button>
</div></div>

<!-- Prompt Editor Modal -->
<div class="modal" id="promptModal"><div class="modalInner">
  <h2 id="promptTitle" style="color:var(--gold); margin-top:0;">Edit Prompt</h2>
  <textarea id="promptArea" style="min-height:200px;"></textarea>
  <p style="font-size:11px; color:var(--muted)">Use [OFFER], [BENEFITS], and [CTA] as placeholders.</p>
  <div style="display:flex; gap:10px; margin-top:10px;">
    <button class="btn btnGreen" style="flex:1" onclick="savePrompt()">Save Changes</button>
    <button class="btn btnRed" style="flex:1" onclick="$('promptModal').classList.remove('show')">Cancel</button>
  </div>
</div></div>

<div class="topbar">
  <div style="font-weight:900; color:var(--gold); font-size:24px;">Email Swipe Machine</div>
  <div style="display:flex; gap:12px;">
    <button class="btn btnSmall" onclick="$('apiModal').classList.add('show')">🔑 API Keys</button>
    <button class="btn btnBlue btnSmall" onclick="toggleSource()" id="srcBtn">HTML Source</button>
  </div>
</div>

<div class="grid" id="mainGrid">
  <!-- LEFT: Sidebar -->
  <div class="card">
    <button class="btn btnSmall btnBlue" style="width:100%; margin-bottom:15px;" onclick="document.getElementById('mainGrid').classList.toggle('sidebar-closed')">TOGGLE SIDEBAR</button>
    <div class="sidebar-content">
      <label style="font-weight:800; font-size:12px;">OFFER NAME</label>
      <input id="offerName" type="text" oninput="autoSave()">

      <label style="font-weight:800; font-size:12px;">BENEFITS</label>
      <textarea id="benefits" style="min-height:100px;" oninput="autoSave()"></textarea>

      <label style="font-weight:800; font-size:12px;">CTA TEXT</label>
      <input id="ctaText" value="Click here to see it" oninput="autoSave()">

      <div style="background:var(--panel2); padding:10px; border-radius:8px; border:1px solid var(--border);">
        <label style="font-weight:800; font-size:10px; display:block; margin-bottom:5px;">QUICK COPY INFO</label>
        <div style="display:flex; flex-direction:column; gap:5px;">
            <button class="btn btnSmall" onclick="copySnippet('offerName')">Copy Offer</button>
            <button class="btn btnSmall" onclick="copySnippet('benefits')">Copy Benefits</button>
            <button class="btn btnSmall" onclick="copySnippet('ctaText')">Copy CTA</button>
        </div>
      </div>
      
      <div style="margin-top:15px; display:flex; flex-direction:column; gap:8px;">
        <button class="btn btnSmall btnBlue" onclick="openPrompt('title')">Edit Title Prompt</button>
        <button class="btn btnSmall btnBlue" onclick="openPrompt('body')">Edit Body Prompt</button>
      </div>
    </div>
  </div>

  <!-- CENTER: Editor -->
  <div class="card">
    <div class="tag-row">
      <button class="btn btnSmall" onclick="insertAtCaret('{!firstname_fix}')">{!firstname_fix}</button>
      <button class="btn btnSmall" onclick="insertAtCaret('⭐')">⭐</button>
      <div style="flex:1"></div>
      <select id="modelSelect" style="width:180px; margin:0;" onchange="autoSave()">
        <option value="puter-gemini">Gemini (Puter - Free)</option>
        <option value="llama-3.3-70b-versatile">Llama 3.3 (Groq)</option>
      </select>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:12px;">
      <input id="subject" type="text" placeholder="Subject Line..." style="margin:0; flex:1; font-weight:bold;" oninput="update(); autoSave();">
      <button class="btn btnGreen" onclick="generateSwipe()">Generate AI</button>
    </div>

    <div class="toolbar">
      <button class="btn btnIcon btnSmall" onclick="exec('bold')"><b>B</b></button>
      <button class="btn btnIcon btnSmall" onclick="exec('italic')"><i>I</i></button>
      <button class="btn btnIcon btnSmall" onclick="exec('foreColor','#d32f2f')" style="color:#d32f2f">A</button>
      <button class="btn btnIcon btnSmall" onclick="exec('foreColor','#111111')">A</button>
      <button class="btn btnSmall" onclick="exec('createLink', prompt('Link:'))">Link</button>
      
      <span style="border-left:2px solid var(--border); margin:0 4px; height:20px;"></span>
      
      <select id="imgSelect"><option value="">Insert Image...</option></select>
      <select id="sigSelect"><option value="">Add Signature...</option></select>
      
      <div style="flex:1"></div>
      <button class="btn btnSmall" onclick="exec('undo')">Undo</button>
    </div>

    <div id="bodyEditor" contenteditable="true" oninput="update(); autoSave();"></div>
    <textarea id="sourceEditor" oninput="updateFromSource()"></textarea>
  </div>

  <!-- RIGHT: Preview -->
  <div class="card">
    <div id="prevSub" class="preview-subject-box">Subject Preview...</div>
    <div id="prevBody" class="preview-body-frame"></div>
    <div style="margin-top:15px;">
        <button class="btn btnGreen" style="width:100%" onclick="copyFullSwipe()">Copy FULL Swipe (Sub + Body)</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentPromptType = 'body';

// These keys match your original logic to ensure data remains
const DEFAULTS = {
    title: "Write a high-CTR email subject line for [OFFER]. Benefits: [BENEFITS].",
    body: "Write a short email for [OFFER]. Benefits: [BENEFITS]. CTA: [CTA]. Use HTML <p> tags for spacing."
};

window.onload = () => {
    loadData();
    renderDropdowns();
    update();
};

function autoSave() {
    localStorage.setItem('offerName', $('offerName').value);
    localStorage.setItem('benefits', $('benefits').value);
    localStorage.setItem('ctaText', $('ctaText').value);
    localStorage.setItem('subject', $('subject').value);
    localStorage.setItem('bodyContent', $('bodyEditor').innerHTML);
    localStorage.setItem('selectedModel', $('modelSelect').value);
}

function loadData() {
    $('offerName').value = localStorage.getItem('offerName') || '';
    $('benefits').value = localStorage.getItem('benefits') || '';
    $('ctaText').value = localStorage.getItem('ctaText') || '';
    $('subject').value = localStorage.getItem('subject') || '';
    $('bodyEditor').innerHTML = localStorage.getItem('bodyContent') || '';
    $('modelSelect').value = localStorage.getItem('selectedModel') || 'puter-gemini';
    $('apiKey').value = localStorage.getItem('groqKey') || '';
}

function saveKeys() {
    localStorage.setItem('groqKey', $('apiKey').value);
    $('apiModal').classList.remove('show');
}

// Logic for manual copy buttons
function copySnippet(id) {
    const val = $(id).value;
    navigator.clipboard.writeText(val);
    showToast("Copied to clipboard!");
}

function showToast(m) {
    const t = $('toast'); t.innerText = m; t.style.display = 'block';
    setTimeout(() => t.style.display='none', 2000);
}

function exec(cmd, val) {
    document.execCommand(cmd, false, val);
    update();
    autoSave();
}

function update() {
    $('prevSub').innerText = "Subject: " + $('subject').value;
    $('prevBody').innerHTML = $('bodyEditor').innerHTML;
}

function toggleSource() {
    if ($('sourceEditor').style.display === 'none') {
        $('sourceEditor').value = $('bodyEditor').innerHTML;
        $('bodyEditor').style.display = 'none';
        $('sourceEditor').style.display = 'block';
        $('srcBtn').innerText = "Show Editor";
    } else {
        $('bodyEditor').innerHTML = $('sourceEditor').value;
        $('sourceEditor').style.display = 'none';
        $('bodyEditor').style.display = 'block';
        $('srcBtn').innerText = "HTML Source";
    }
}

function updateFromSource() {
    $('bodyEditor').innerHTML = $('sourceEditor').value;
    update();
}

function insertAtCaret(text) {
    const sel = window.getSelection();
    if (sel.rangeCount) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(document.createTextNode(text));
    }
    update();
}

// AI Generation Logic
async function generateSwipe() {
    const model = $('modelSelect').value;
    const offer = $('offerName').value;
    const benefits = $('benefits').value;
    const cta = $('ctaText').value;

    const tPrompt = (localStorage.getItem('p_title') || DEFAULTS.title)
        .replace('[OFFER]', offer).replace('[BENEFITS]', benefits).replace('[CTA]', cta);
    const bPrompt = (localStorage.getItem('p_body') || DEFAULTS.body)
        .replace('[OFFER]', offer).replace('[BENEFITS]', benefits).replace('[CTA]', cta);

    showToast("Generating...");

    try {
        let sub, body;
        if (model === 'puter-gemini') {
            sub = await puter.ai.chat(tPrompt);
            body = await puter.ai.chat(bPrompt);
        } else {
            // Groq Logic
            const key = localStorage.getItem('groqKey');
            if(!key) return alert("Please add Groq Key in API settings");
            sub = await callGroq(tPrompt, key);
            body = await callGroq(bPrompt, key);
        }
        
        $('subject').value = sub.toString().replace(/"/g, '');
        $('bodyEditor').innerHTML = body.toString();
        update();
        autoSave();
    } catch (e) {
        alert("AI Error: " + e.message);
    }
}

async function callGroq(p, key) {
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json'},
        body: JSON.stringify({model: "llama-3.3-70b-versatile", messages: [{role: "user", content: p}]})
    });
    const j = await r.json();
    return j.choices[0].message.content;
}

// Copy Full Swipe (Subject + Body)
function copyFullSwipe() {
    const sub = $('subject').value;
    const body = $('bodyEditor').innerHTML;
    const fullHTML = `<strong>Subject: ${sub}</strong><br><br><div class="email-body">${body}</div>`;
    
    const type = "text/html";
    const blob = new Blob([fullHTML], { type });
    const data = [new ClipboardItem({ [type]: blob })];
    navigator.clipboard.write(data);
    showToast("Full HTML Swipe Copied!");
}

// Prompt Management
function openPrompt(type) {
    currentPromptType = type;
    $('promptTitle').innerText = "Edit " + (type === 'title' ? "Subject" : "Body") + " Prompt";
    $('promptArea').value = localStorage.getItem('p_' + type) || DEFAULTS[type];
    $('promptModal').classList.add('show');
}

function savePrompt() {
    localStorage.setItem('p_' + currentPromptType, $('promptArea').value);
    $('promptModal').classList.remove('show');
}

// Signatures and Images (Restoring your original list-rendering)
function renderDropdowns() {
    const sigs = JSON.parse(localStorage.getItem('signatures') || '[]');
    const imgs = JSON.parse(localStorage.getItem('images') || '[]');
    
    $('sigSelect').innerHTML = '<option value="">Add Signature...</option>';
    sigs.forEach((s, i) => {
        let opt = document.createElement('option');
        opt.value = s.html; opt.text = s.name;
        $('sigSelect').add(opt);
    });
    $('sigSelect').onchange = (e) => { if(e.target.value) { exec('insertHTML', '<br>' + e.target.value); e.target.value = ""; }};

    $('imgSelect').innerHTML = '<option value="">Insert Image...</option>';
    imgs.forEach((img, i) => {
        let opt = document.createElement('option');
        opt.value = img.url; opt.text = img.name;
        $('imgSelect').add(opt);
    });
    $('imgSelect').onchange = (e) => { if(e.target.value) { exec('insertHTML', `<img src="${e.target.value}" style="max-width:100%">`); e.target.value = ""; }};
}
</script>
</body>
</html>
