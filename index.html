<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Command Center</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; margin: 0; padding: 10px; }
        .container { max-width: 1200px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .section-header { 
            text-align: center; 
            color: white; 
            padding: 8px; 
            border-radius: 6px; 
            margin: 25px 0 15px 0; 
            font-size: 1.1em; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .bg-daily { background: #007bff; }
        .bg-paid { background: #28a745; }
        .bg-classified { background: #fd7e14; }
        .bg-secondary { background: #6f42c1; }
        .bg-social { background: #e83e8c; }
        .bg-research { background: #17a2b8; }
        .bg-calendar { background: #343a40; }

        #progress-container { background:#e9ecef; border-radius:10px; margin-bottom:30px; overflow:hidden; border: 1px solid #ccc; }
        #progress-bar { background:#007bff; width:0%; height:45px; text-align:center; color:white; font-weight:bold; line-height:45px; transition:width 0.5s; font-size: 18px; }

        .task-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .task-item { display: flex; align-items: center; background: #fff; padding: 18px; border-radius: 8px; border: 1px solid #eee; transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .task-item:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .task-item input[type="checkbox"] { width: 26px; height: 26px; margin-right: 18px; cursor: pointer; }
        
        .link-btn { display: inline-block; padding: 10px 15px; background: #007bff; color: white; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: bold; margin-top: 8px; text-align: center; width: 80%; }
        .link-btn:hover { background: #0056b3; opacity: 0.9; }
        
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 3px 7px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; position: absolute; top: 5px; right: 5px; }

        .add-zone { background:#f9f9f9; padding:15px; border-radius:10px; border:1px dashed #ccc; margin: 10px 0 25px 0; display: flex; gap: 5px; }
        .add-zone input { padding: 8px; flex: 1; border: 1px solid #ddd; border-radius: 4px; }
        .add-zone button { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .weekday-label { text-align: center; font-weight: bold; padding: 10px 0; background: #007bff; color: white; border-radius: 4px; font-size: 14px; }
        .cal-box { border: 1px solid #ddd; background: #b1d8b7; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-height: 130px; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; padding: 6px 10px; background: rgba(0,0,0,0.08); }
        .cal-check { width: 18px; height: 18px; accent-color: blue; }
        
        .cal-note-container { flex-grow: 1; display: flex; flex-direction: column; padding: 5px; }
        .cal-progress-display { color: #d00000; font-weight: bold; font-size: 12px; margin-bottom: 2px; display: block; }
        .cal-note { width: 100%; border: none; outline: none; resize: none; padding: 0px; background: transparent; color: #1b4332; font-size: 11px; flex-grow: 1; }

        .editable-text:hover { background: #fffde7; cursor: text; outline: 1px dashed #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; color: #2c3e50; margin-bottom: 20px;">Traffic Command Center</h2>
    
    <div id="progress-container">
        <div id="progress-bar">0%</div>
    </div>

    <div class="section-header bg-daily">Daily Traffic Routine</div>
    <div id="daily-grid" class="task-grid"></div>
    <div class="add-zone">
        <input type="text" id="add-daily-name" placeholder="Site Name">
        <input type="text" id="add-daily-url" placeholder="URL">
        <button onclick="addNewSource('daily')">ADD</button>
    </div>

    <div class="section-header bg-paid">Paid & Hands-Off</div>
    <div id="paid-grid" class="task-grid"></div>
    <div class="add-zone">
        <input type="text" id="add-paid-name" placeholder="Site Name">
        <input type="text" id="add-paid-url" placeholder="URL">
        <button onclick="addNewSource('paid')">ADD</button>
    </div>

    <div class="section-header bg-classified">Classified Ads</div>
    <div id="classified-grid" class="task-grid"></div>
    <div class="add-zone">
        <input type="text" id="add-classified-name" placeholder="Site Name">
        <input type="text" id="add-classified-url" placeholder="URL">
        <button onclick="addNewSource('classified')">ADD</button>
    </div>

    <button onclick="resetDailyTasks()" style="width:50%; display: block; margin: 30px auto; padding:10px; background:#dc3545; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size: 14px;">Reset All Daily Checkmarks</button>

    <div class="section-header bg-calendar">Marketing Calendar</div>
    <div class="calendar-section">
        <div id="cal-title" class="cal-month-title" style="text-align: center; font-size: 1.5em; margin-bottom: 15px;"></div>
        <div id="calendar-grid" class="calendar-grid"></div>
    </div>
</div>

<script>
    // Initial data setup if storage is empty
    const defaultData = {
        daily: [
            { id: "d1", name: "MLGS — Lead mailer", url: "https://troypringle.github.io/MLGS-Page/" },
            { id: "d2", name: "Herculist — Credit zone", url: "http://www.herculist.com/cgi-bin/thezoneadsdisplay.cgi?325hv9d2u65hc2z3w7jo5j" }
        ],
        paid: [
            { id: "p1", name: "Traffic Zest", url: "https://trafficzest.com/login" },
            { id: "p2", name: "Udimi", url: "https://udimi.com/login" }
        ],
        classified: [
            { id: "c1", name: "Craigslist", url: "https://accounts.craigslist.org/login" }
        ]
    };

    let trafficData = JSON.parse(localStorage.getItem('trafficMasterData')) || defaultData;
    let checkmarks = JSON.parse(localStorage.getItem('trafficCheckmarks')) || {};

    function renderGrids() {
        renderSection('daily', 'daily-grid');
        renderSection('paid', 'paid-grid');
        renderSection('classified', 'classified-grid');
        updateProgress();
    }

    function renderSection(category, gridId) {
        const grid = document.getElementById(gridId);
        grid.innerHTML = '';
        trafficData[category].forEach((item, index) => {
            const isChecked = checkmarks[item.id] ? 'checked' : '';
            grid.innerHTML += `
                <div class="task-item">
                    <button class="delete-btn" onclick="deleteSource('${category}', ${index})">DEL</button>
                    <input type="checkbox" id="${item.id}" class="traffic-check" ${isChecked} onchange="toggleCheck('${item.id}')">
                    <div style="width:100%;">
                        <strong class="editable-text" contenteditable="true" onblur="updateText('${category}', ${index}, 'name', this.innerText)">${item.name}</strong><br>
                        <a href="${item.url}" target="_blank" class="link-btn">OPEN SITE</a>
                        <div style="font-size:9px; color:blue; cursor:pointer; margin-top:4px;" onclick="updateUrl('${category}', ${index})">Edit Link</div>
                    </div>
                </div>`;
        });
    }

    function toggleCheck(id) {
        const checkbox = document.getElementById(id);
        checkmarks[id] = checkbox.checked;
        localStorage.setItem('trafficCheckmarks', JSON.stringify(checkmarks));
        updateProgress();
    }

    function updateText(cat, index, field, val) {
        trafficData[cat][index][field] = val;
        saveData();
    }

    function updateUrl(cat, index) {
        const newUrl = prompt("Enter new URL:", trafficData[cat][index].url);
        if(newUrl) {
            trafficData[cat][index].url = newUrl;
            saveData();
            renderGrids();
        }
    }

    function addNewSource(cat) {
        const name = document.getElementById(`add-${cat}-name`).value;
        const url = document.getElementById(`add-${cat}-url`).value;
        if(!name) return;
        const newId = 'id' + Date.now();
        trafficData[cat].push({ id: newId, name, url });
        saveData();
        renderGrids();
        document.getElementById(`add-${cat}-name`).value = '';
        document.getElementById(`add-${cat}-url`).value = '';
    }

    function deleteSource(cat, index) {
        if(confirm("Delete this source?")) {
            trafficData[cat].splice(index, 1);
            saveData();
            renderGrids();
        }
    }

    function saveData() {
        localStorage.setItem('trafficMasterData', JSON.stringify(trafficData));
    }

    function updateProgress() {
        const total = document.querySelectorAll('.traffic-check').length;
        const checked = Array.from(document.querySelectorAll('.traffic-check')).filter(c => c.checked).length;
        const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
        const bar = document.getElementById('progress-bar');
        bar.style.width = percent + '%';
        bar.innerText = `Daily Goal: ${percent}% (${checked}/${total})`;

        const now = new Date();
        const dateId = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
        const calProgDisplay = document.getElementById(`cal-prog-${dateId}`);
        if (calProgDisplay) {
            calProgDisplay.innerText = `Progress: ${percent}%`;
            saveCalendarData(dateId);
        }
    }

    function resetDailyTasks() {
        if(confirm("Reset all checkmarks?")) {
            checkmarks = {};
            localStorage.removeItem('trafficCheckmarks');
            renderGrids();
        }
    }

    // CALENDAR FUNCTIONS (Kept from your original)
    function saveCalendarData(id) {
        const savedData = JSON.parse(localStorage.getItem('marketingCalendar') || '{}');
        const noteElem = document.getElementById(`cal-note-${id}`);
        const checkElem = document.getElementById(`cal-check-${id}`);
        const progElem = document.getElementById(`cal-prog-${id}`);
        if(!noteElem) return;
        savedData[id] = { note: noteElem.value, checked: checkElem.checked, progress: progElem.innerText };
        localStorage.setItem('marketingCalendar', JSON.stringify(savedData));
    }

    function generateCalendar() {
        const grid = document.getElementById('calendar-grid');
        const title = document.getElementById('cal-title');
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        title.innerText = `${monthNames[month]} ${year}`;
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const savedData = JSON.parse(localStorage.getItem('marketingCalendar') || '{}');
        grid.innerHTML = '';
        dayNames.forEach(day => grid.innerHTML += `<div class="weekday-label">${day}</div>`);
        for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="cal-box empty"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
            const dateId = `${year}-${month + 1}-${d}`;
            const dayData = savedData[dateId] || { note: '', checked: false, progress: '' };
            grid.innerHTML += `
                <div class="cal-box">
                    <div class="cal-header"><span>${d}</span><input type="checkbox" class="cal-check" id="cal-check-${dateId}" ${dayData.checked ? 'checked' : ''} onchange="saveCalendarData('${dateId}')"></div>
                    <div class="cal-note-container">
                        <span id="cal-prog-${dateId}" class="cal-progress-display">${dayData.progress}</span>
                        <textarea class="cal-note" id="cal-note-${dateId}" placeholder="Notes..." oninput="saveCalendarData('${dateId}')">${dayData.note}</textarea>
                    </div>
                </div>`;
        }
    }

    window.onload = function() {
        generateCalendar();
        renderGrids();
    };
</script>
</body>
</html>
