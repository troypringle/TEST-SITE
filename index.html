<script>
    /* ==================================================== */
    /* THE SILENT SIPHON: CAPTURE ONCE, SEND TWICE + TRACK  */

    async function handleLeadCapture(event) {
        event.preventDefault(); 

        const form = event.target;
        const formData = new FormData(form);
        const name = formData.get('FirstName');
        const email = formData.get('Email');

        // 1. TRACK THE CONVERSION IN BEMOB
        new Image().src = "https://o2s4n.bemobtrk.com/pxls";

        // 2. SILENTLY SEND TO GVO
        fetch('https://gogvo.com/subscribe.php', {
            method: 'POST',
            mode: 'no-cors', 
            body: formData 
        });

        // 3. FORWARD TO ECF (Using the correct /start mailbox)
        const shadowForm = document.createElement('form');
        shadowForm.method = 'POST';
        shadowForm.action = 'https://easycommissionfunnel.com/start'; 

        const data = {
            'id': 'troy20',
            'email': email,
            'first_name': name
        };

        for (const key in data) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = data[key];
            shadowForm.appendChild(input);
        }

        document.body.appendChild(shadowForm);
        
        // This registers them and automatically redirects to the next page.
        shadowForm.submit(); 
    }

    // 1. URL PARAMETER LOGIC
    (function() {
        var params = window.location.search;
        if (params) {
            var links = document.getElementsByTagName('a');
            for (var i = 0; i < links.length; i++) {
                if(links[i].href.indexOf('aimatrixspillover') !== -1) {
                    var sep = links[i].href.indexOf('?') !== -1 ? '&' : '?';
                    links[i].href += sep + params.substring(1);
                }
            }
        }
    })();

    // 2. IMAGE ROTATION + TRANSITION BOOST
    (function() {
        const profBox = document.getElementById('profBox');
        let count = 1;
        
        setInterval(() => {
            count = (count % 7) + 1;
            profBox.style.transform += " scale(1.15)";
            
            setTimeout(() => {
                profBox.style.backgroundImage = `var(--prof-${count})`;
                profBox.style.transform = profBox.style.transform.replace(" scale(1.15)", "");
            }, 150); 

        }, 10000); 
    })();

    // 3. POPUP LOGIC
    (function() {
        const popup = document.getElementById('ecf-popup-overlay');
        const closeBtn = document.getElementById('ecf-popup-close');
        const ctaButtons = document.querySelectorAll('a[href="https://o2s4n.bemobtrcks.com/click"]');
        let exitIntentTriggered = false;

        function showPopup() {
            if (!exitIntentTriggered) {
                popup.style.display = 'flex';
                exitIntentTriggered = true; 
            }
        }

        document.addEventListener('mouseleave', function(e) {
            if (e.clientY < 10) {
                showPopup();
            }
        });

        window.addEventListener('scroll', function() {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50) {
                showPopup();
            }
        });

        ctaButtons.forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault(); 
                popup.style.display = 'flex'; 
                exitIntentTriggered = true; 
            });
        });

        closeBtn.addEventListener('click', function() {
            popup.style.display = 'none';
        });

        window.addEventListener('click', function(e) {
            if (e.target === popup) {
                popup.style.display = 'none';
            }
        });
    })();
</script>
