<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Swipe Machine</title>
    <style>
        :root {
            --bg-dark: #2b2b2b;
            --bg-panel: #3d3d3d;
            --bg-editor: #ffffff;
            --text-editor: #000000;
            --accent: #ffd700;
            --btn-green: #2e7d32;
        }

        body { font-family: Arial, sans-serif; background: var(--bg-dark); color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: 320px 1fr 1fr; gap: 20px; }
        
        .card { background: var(--bg-panel); padding: 20px; border-radius: 8px; border: 1px solid #555; }
        .card-title { font-size: 18px; font-weight: bold; color: var(--accent); margin-bottom: 15px; }
        
        input, textarea, select { 
            width: 100%; padding: 12px; border-radius: 4px; border: 1px solid #666; 
            background: #fff; color: #000; font-family: Arial; font-size: 16px;
        }
        
        textarea { height: 400px; font-family: Arial; }
        
        .btn { padding: 12px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; margin-bottom: 5px; width: 100%; }
        .btn-green { background: var(--green); color: white; }
        
        /* Fixed visibility on buttons */
        button { background: #555; color: #fff; }
        button:hover { background: #777; }

        .subject-item { background: #fff; color: #000; padding: 10px; margin-bottom: 5px; cursor: pointer; border-radius: 4px; font-size: 15px; }
        .subject-item:hover { background: #eee; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #333; padding: 15px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="container">
    <div class="header" style="grid-column: 1/4; background: var(--bg-panel); padding: 20px; border-radius: 8px;">
        <h1>🔥 Email Swipe Machine</h1>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="card">
            <h3 class="card-title">⚙️ API Settings</h3>
            <input type="password" id="apiKey" placeholder="Groq API Key" onchange="saveApi()">
            <p style="font-size:12px; margin-top:5px;">Get key: <a href="https://console.groq.com" target="_blank" style="color:var(--accent)">console.groq.com</a></p>
        </div>
        <div class="card" style="margin-top:10px;">
            <h3 class="card-title">⚡ Prompts</h3>
            <div id="promptList"></div>
        </div>
    </div>

    <!-- Editor -->
    <div class="editor-col">
        <div class="card">
            <h3 class="card-title">Subject Line</h3>
            <input type="text" id="subjectInput" oninput="updatePreview()">
            <div id="subjectCount" style="font-size: 12px; margin-top:5px;">0 chars</div>
            <button class="btn" style="background:var(--accent); color:#000;" onclick="generateSubjects()">⚡ Generate Subjects</button>
            <div id="subjectList" style="margin-top:10px;"></div>
        </div>
        <div class="card">
            <h3 class="card-title">Email Body</h3>
            <textarea id="bodyEditor" oninput="updatePreview()"></textarea>
            <div style="display:flex; gap:5px;">
                <button class="btn" onclick="undo()">⟲ Undo</button>
                <button class="btn" style="background:var(--accent); color:#000;" onclick="generateBody()">⚡ Generate Body</button>
            </div>
        </div>
    </div>

    <!-- Preview -->
    <div class="preview-col">
        <div class="card">
            <h3 class="card-title">Live Preview</h3>
            <div id="previewFrame" style="background:white; color:black; padding:20px; min-height:500px; border-radius:4px;"></div>
            <button class="btn" style="background:var(--green); color:white; margin-top:10px;" onclick="copyFull()">📋 Copy Full Email</button>
        </div>
    </div>
</div>

<script>
    let historyStack = [];
    
    function saveState() {
        const val = document.getElementById('bodyEditor').value;
        if (historyStack[historyStack.length - 1] !== val) {
            historyStack.push(val);
            if (historyStack.length > 10) historyStack.shift();
        }
    }

    function undo() {
        if (historyStack.length > 1) {
            historyStack.pop(); // remove current
            document.getElementById('bodyEditor').value = historyStack[historyStack.length - 1];
            updatePreview();
        }
    }

    function saveApi() {
        localStorage.setItem('mlgs_api_key', document.getElementById('apiKey').value);
    }

    async function callAI(prompt) {
        const key = localStorage.getItem('mlgs_api_key');
        if (!key) return alert('Set API Key');
        
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [{role: 'user', content: prompt}],
                temperature: 0.7
            })
        });
        const data = await res.json();
        return data.choices[0].message.content;
    }

    async function generateSubjects() {
        const p = `Generate exactly 3 email subject lines.
        CRITICAL RULES:
        1. Length: MUST be 36 to 80 characters.
        2. Words: MUST have 7+ words.
        3. No emojis except one star (⭐).
        4. Focus on: Money, Results, or curiosity.
        5. Output: Numbered list 1-3.`;
        
        const res = await callAI(p);
        const subjects = res.split('\n').filter(l => l.length >= 36);
        const list = document.getElementById('subjectList');
        list.innerHTML = subjects.map(s => `<div class="subject-item" onclick="setSubject('${s.replace(/'/g, "\\'")}')">${s}</div>`).join('');
    }

    function setSubject(s) {
        document.getElementById('subjectInput').value = s.replace(/^\d+[\.\)]\s*/, '');
        updatePreview();
    }

    async function generateBody() {
        const p = `Write a promotional email.
        CRITICAL FORMATTING RULES:
        1. Use plain text.
        2. Break text into paragraphs of exactly 2-3 sentences.
        3. Separate paragraphs with a blank line.
        4. Start first line with: ⭐{!name_fix}
        5. Conversational tone, not salesy.
        6. NO signature, NO HTML.`;
        
        const res = await callAI(p);
        document.getElementById('bodyEditor').value = res;
        saveState();
        updatePreview();
    }

    function updatePreview() {
        const s = document.getElementById('subjectInput').value;
        const b = document.getElementById('bodyEditor').value;
        document.getElementById('subjectCount').textContent = `${s.length} chars, ${s.split(' ').length} words`;
        document.getElementById('previewFrame').innerHTML = b.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
    }

    function copyFull() {
        const s = document.getElementById('subjectInput').value;
        const b = document.getElementById('bodyEditor').value;
        navigator.clipboard.writeText(`SUBJECT: ${s}\n\n${b}`);
        alert('Copied to clipboard');
    }

    function clearBody() {
        document.getElementById('bodyEditor').value = '';
        saveState();
        updatePreview();
    }

    document.getElementById('apiKey').value = localStorage.getItem('mlgs_api_key') || '';
</script>
</body>
</html>
