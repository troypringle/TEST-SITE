<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLGS Swipe Machine - AI Email Generator</title>
    
    <!-- Toast UI Editor CSS -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0d1117;
            --bg-panel: #161b22;
            --bg-input: #1c2128;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #00ff88;
            --accent-hover: #00cc6a;
            --gold: #ffd700;
            --danger: #ff4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
            gap: 0;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            background: var(--bg-panel);
            padding: 20px 30px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 80px);
        }

        .sidebar-section {
            margin-bottom: 30px;
        }

        .sidebar-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        /* Main Content */
        .main-content {
            padding: 30px;
            overflow-y: auto;
            max-height: calc(100vh - 80px);
        }

        /* Buttons */
        .btn {
            background: var(--bg-input);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .btn:hover {
            border-color: var(--accent);
            background: var(--bg-panel);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #00cc6a);
            border: none;
            color: #000;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #00cc6a, var(--accent));
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #ffed4e);
            border: none;
            color: #000;
            font-weight: 600;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #ffed4e, var(--gold));
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger {
            background: var(--danger);
            border: none;
        }

        .btn-danger:hover {
            background: #cc0000;
        }

        /* Input Fields */
        input[type="text"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        /* Cards */
        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Subject Line Generator */
        .subject-results {
            margin-top: 15px;
        }

        .subject-option {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subject-option:hover {
            border-color: var(--accent);
            background: var(--bg-panel);
        }

        .subject-option.selected {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.1);
        }

        .subject-option input[type="radio"] {
            width: auto;
        }

        /* Toast Editor Overrides */
        .toastui-editor-defaultUI {
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .toastui-editor-toolbar {
            background: var(--bg-input) !important;
            border-bottom: 1px solid var(--border) !important;
        }

        .toastui-editor-main {
            background: var(--bg-panel) !important;
        }

        .toastui-editor-contents {
            color: var(--text) !important;
        }

        /* Signature Section */
        .signature-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .lock-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background: var(--bg-input);
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.3s;
            border: 1px solid var(--border);
        }

        .toggle-switch.active {
            background: var(--accent);
        }

        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(24px);
        }

        /* Copy Actions */
        .copy-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .copy-actions .btn-primary {
            grid-column: 1 / -1;
        }

        /* Template List */
        .template-item {
            background: var(--bg-input);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .template-item:hover {
            background: var(--bg-panel);
            border-color: var(--accent);
        }

        .template-name {
            font-size: 14px;
            flex: 1;
        }

        .template-actions {
            display: flex;
            gap: 5px;
        }

        /* Prompt Library */
        .prompt-btn {
            margin-bottom: 8px;
            justify-content: flex-start;
            text-align: left;
        }

        /* API Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            cursor: pointer;
            font-size: 24px;
            color: var(--text-muted);
        }

        .close-modal:hover {
            color: var(--text);
        }

        /* Status Messages */
        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .status-message.success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .status-message.error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .status-message.active {
            display: block;
        }

        /* Loading Spinner */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid var(--bg-input);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>🔥 MLGS SWIPE MACHINE</h1>
        <div class="header-actions">
            <button class="btn btn-small" id="helpBtn">❓ Help</button>
            <button class="btn btn-small" id="apiSettingsBtn">⚙️ API Settings</button>
        </div>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Prompt Library -->
            <div class="sidebar-section">
                <h3>📋 Prompt Library</h3>
                <button class="btn prompt-btn" data-type="subject-curiosity">🧠 Curiosity Hook</button>
                <button class="btn prompt-btn" data-type="subject-money">💰 Money Angle</button>
                <button class="btn prompt-btn" data-type="subject-urgency">⏰ Urgency/Scarcity</button>
                <button class="btn prompt-btn" data-type="subject-lazy">😴 Lazy Method</button>
                <button class="btn prompt-btn" data-type="subject-proof">📊 Proof/Results</button>
                <hr style="border-color: var(--border); margin: 15px 0;">
                <button class="btn prompt-btn" data-type="body-full">🔥 Full Email</button>
                <button class="btn prompt-btn" data-type="body-story">📖 Story Angle</button>
                <button class="btn prompt-btn" data-type="body-cta">🎯 Direct CTA</button>
                <button class="btn prompt-btn" data-type="body-question">❓ Question Hook</button>
            </div>

            <!-- Templates -->
            <div class="sidebar-section">
                <h3>💾 Saved Templates</h3>
                <div id="templateList"></div>
                <button class="btn btn-primary" id="saveTemplateBtn">💾 Save Current</button>
            </div>

            <!-- Signature -->
            <div class="sidebar-section">
                <h3>✍️ Signature</h3>
                <button class="btn" id="editSignatureBtn">Edit Signature</button>
                <button class="btn" id="insertSignatureBtn">Insert to Editor</button>
            </div>

            <!-- Backup -->
            <div class="sidebar-section">
                <h3>💼 Backup</h3>
                <button class="btn" id="backupBtn">📥 Backup All</button>
                <button class="btn" id="restoreBtn">📤 Restore</button>
                <input type="file" id="restoreFileInput" accept=".json" style="display: none;">
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="statusMessage" class="status-message"></div>

            <!-- Subject Line Generator -->
            <div class="card">
                <div class="card-title">📧 Subject Line Generator</div>
                <button class="btn btn-gold" id="generateSubjectsBtn">⚡ Generate 10 Subject Lines</button>
                <div class="loading" id="subjectLoading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px;">Generating subjects...</p>
                </div>
                <div id="subjectResults" class="subject-results"></div>
            </div>

            <!-- Subject Field -->
            <div class="card">
                <div class="card-title">📝 Email Subject</div>
                <input type="text" id="subjectInput" placeholder="Your subject line here...">
            </div>

            <!-- Email Body Editor -->
            <div class="card">
                <div class="card-title">✉️ Email Body</div>
                <div id="editor"></div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn btn-gold" id="generateBodyBtn">⚡ Generate Body</button>
                    <button class="btn" id="regenerateBodyBtn">🔄 Regenerate</button>
                    <button class="btn btn-danger" id="clearEditorBtn">🗑️ Clear</button>
                </div>
                <div class="loading" id="bodyLoading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px;">Generating email body...</p>
                </div>
            </div>

            <!-- Signature Section -->
            <div class="card">
                <div class="signature-header">
                    <div class="card-title">✍️ Signature</div>
                    <div class="lock-toggle">
                        <span id="lockStatus">🔒 Locked</span>
                        <div class="toggle-switch active" id="signatureLockToggle">
                            <div class="toggle-slider"></div>
                        </div>
                    </div>
                </div>
                <div id="signatureEditor"></div>
                <button class="btn btn-primary" id="saveSignatureBtn" style="margin-top: 15px;">💾 Save Signature</button>
            </div>

            <!-- Copy Actions -->
            <div class="card">
                <div class="card-title">📤 Copy & Export</div>
                <div class="copy-actions">
                    <button class="btn btn-primary" id="copyFullEmailBtn">📋 Copy Full Email (Subject + Body)</button>
                    <button class="btn" id="copySubjectBtn">Copy Subject Only</button>
                    <button class="btn" id="copyBodyBtn">Copy Body Only</button>
                    <button class="btn" id="viewHtmlBtn">👁️ View HTML Source</button>
                </div>
            </div>
        </main>
    </div>

    <!-- API Settings Modal -->
    <div class="modal" id="apiModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ API Settings</h2>
                <span class="close-modal" id="closeApiModal">×</span>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-size: 14px;">API Provider</label>
                <select id="apiProvider">
                    <option value="groq">Groq (Recommended)</option>
                    <option value="openrouter">OpenRouter</option>
                </select>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-size: 14px;">API Key</label>
                <input type="password" id="apiKeyInput" placeholder="Paste your API key here...">
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">
                    Get free API key: 
                    <a href="https://console.groq.com" target="_blank" style="color: var(--accent);">console.groq.com</a>
                </p>
            </div>
            <button class="btn btn-primary" id="saveApiKeyBtn">💾 Save API Key</button>
        </div>
    </div>

    <!-- Toast UI Editor -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

    <script>
        // ============================================
        // MLGS SWIPE MACHINE - Main Application
        // ============================================

        // Initialize Toast UI Editors
        const bodyEditor = new toastui.Editor({
            el: document.querySelector('#editor'),
            height: '400px',
            initialEditType: 'wysiwyg',
            previewStyle: 'vertical',
            toolbarItems: [
                ['heading', 'bold', 'italic'],
                ['ul', 'ol'],
                ['link', 'image'],
                ['code'],
                ['scrollSync']
            ],
            theme: 'dark'
        });

        const signatureEditor = new toastui.Editor({
            el: document.querySelector('#signatureEditor'),
            height: '200px',
            initialEditType: 'wysiwyg',
            previewStyle: 'vertical',
            toolbarItems: [
                ['bold', 'italic'],
                ['link'],
            ],
            theme: 'dark'
        });

        // ============================================
        // Local Storage Management
        // ============================================

        const Storage = {
            get(key, defaultValue = null) {
                const item = localStorage.getItem(`mlgs_${key}`);
                return item ? JSON.parse(item) : defaultValue;
            },
            set(key, value) {
                localStorage.setItem(`mlgs_${key}`, JSON.stringify(value));
            },
            remove(key) {
                localStorage.removeItem(`mlgs_${key}`);
            }
        };

        // ============================================
        // State Management
        // ============================================

        let state = {
            apiKey: Storage.get('api_key', ''),
            apiProvider: Storage.get('api_provider', 'groq'),
            signature: Storage.get('signature', ''),
            signatureLocked: Storage.get('signature_locked', true),
            templates: Storage.get('templates', []),
            currentSubjects: [],
            prompts: Storage.get('prompts', getDefaultPrompts())
        };

        function getDefaultPrompts() {
            return {
                'subject-curiosity': `Generate 10 highly curiosity-driven subject lines for My Lead Gen Secret (MLGS). Focus on:
- "Weird trick" angles
- "What nobody tells you" hooks
- Discovery/reveal language
- Numbers and specifics
- Keep under 60 characters
- High open rate triggers

Context: MLGS gives users 100 fresh leads daily + $5 commissions per referral for a $60 one-time payment.`,

                'subject-money': `Generate 10 money-focused subject lines for MLGS. Include:
- Dollar amounts ($5, $60, daily income)
- "Getting paid while..." angles
- Passive income hooks
- Proof-based language
- Keep under 60 characters

Context: MLGS pays $5 per referral + provides 100 leads daily for $60 one-time.`,

                'subject-urgency': `Generate 10 urgency/scarcity subject lines for MLGS:
- Time-sensitive language
- "Before it's gone" angles
- Limited availability hints
- FOMO triggers
- Keep under 60 characters

Context: MLGS is $60 one-time (could change to monthly), gives 100 leads daily + $5/referral.`,

                'subject-lazy': `Generate 10 "lazy method" subject lines for MLGS:
- "No work required" angles
- Automation language
- "While you sleep" hooks
- Effort-free positioning
- Keep under 60 characters

Context: MLGS automatically delivers 100 leads daily, pays $5 per referral, $60 one-time.`,

                'subject-proof': `Generate 10 proof/results-based subject lines for MLGS:
- Testimonial language
- Specific results
- "This morning I..." angles
- Real numbers
- Keep under 60 characters

Context: MLGS members get 100 leads daily + earn $5 per referral for $60 one-time.`,

                'body-full': `Write a complete high-converting promotional email for My Lead Gen Secret (MLGS).

Structure:
- Attention-grabbing opening (personal story or bold claim)
- Main benefit: 100 fresh leads delivered daily automatically
- Secondary benefit: Earn $5 every time someone joins under you
- Price point: $60 one-time payment (mention could become monthly)
- Social proof or urgency element
- Strong call-to-action with link: https://troypringle.github.io/MLGS-Page/
- Keep it 12-18 lines max
- Tone: Excited friend who just made money
- Use "I" and "you" language
- NO signature (will be added separately)

Make it feel authentic, not salesy.`,

                'body-story': `Write a story-based email for MLGS that follows this structure:
- Start with a relatable problem (needing leads, spending on ads, time-consuming prospecting)
- Transition: "Then I found..."
- Discovery: MLGS gives 100 leads daily + $5 commissions
- Proof: Personal result or testimonial
- Urgency: $60 one-time (not monthly yet)
- CTA: https://troypringle.github.io/MLGS-Page/
- Keep conversational, 14-20 lines
- NO signature`,

                'body-cta': `Write a direct, CTA-focused email for MLGS:
- Open with benefit-driven question
- List 3-4 bullet points of core benefits:
  * 100 leads daily (automatic)
  * $5 per referral
  * $60 one-time payment
  * No recruiting required
- Address common objection
- Strong urgency close
- Link: https://troypringle.github.io/MLGS-Page/
- Keep punchy, 10-14 lines
- NO signature`,

                'body-question': `Write a question-hook email for MLGS:
- Open with provocative question
- Answer with MLGS benefit
- Explain how it works (briefly)
- Mention 100 leads + $5 commissions
- Price: $60 one-time
- Question-based CTA
- Link: https://troypringle.github.io/MLGS-Page/
- Keep engaging, 12-16 lines
- NO signature`
            };
        }

        // ============================================
        // UI Functions
        // ============================================

        function showStatus(message, type = 'success') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type} active`;
            setTimeout(() => {
                statusEl.classList.remove('active');
            }, 3000);
        }

        function showLoading(elementId, show = true) {
            const el = document.getElementById(elementId);
            if (show) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }
        }

        // ============================================
        // API Integration
        // ============================================

        async function callAI(prompt, systemPrompt = '') {
            if (!state.apiKey) {
                showStatus('Please set your API key in settings first', 'error');
                throw new Error('No API key');
            }

            const apiUrls = {
                groq: 'https://api.groq.com/openai/v1/chat/completions',
                openrouter: 'https://openrouter.ai/api/v1/chat/completions'
            };

            const models = {
                groq: 'llama-3.1-70b-versatile',
                openrouter: 'meta-llama/llama-3.1-70b-instruct:free'
            };

            try {
                const response = await fetch(apiUrls[state.apiProvider], {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.apiKey}`
                    },
                    body: JSON.stringify({
                        model: models[state.apiProvider],
                        messages: [
                            ...(systemPrompt ? [{role: 'system', content: systemPrompt}] : []),
                            {role: 'user', content: prompt}
                        ],
                        temperature: 0.9,
                        max_tokens: 1000
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                showStatus(`AI Error: ${error.message}`, 'error');
                throw error;
            }
        }

        // ============================================
        // Subject Generation
        // ============================================

        document.getElementById('generateSubjectsBtn').addEventListener('click', async () => {
            showLoading('subjectLoading', true);
            
            try {
                const prompt = state.prompts['subject-curiosity']; // Default prompt
                const result = await callAI(prompt, 'You are an expert email marketer specializing in high-converting subject lines for make-money-online offers. Output ONLY the subject lines, numbered 1-10, nothing else.');
                
                // Parse subjects
                const subjects = result.split('\n')
                    .filter(line => line.trim())
                    .map(line => line.replace(/^\d+[\.\)]\s*/, '').trim())
                    .filter(line => line.length > 0)
                    .slice(0, 10);

                state.currentSubjects = subjects;
                renderSubjects(subjects);
                showStatus('Generated 10 fresh subject lines!');
            } catch (error) {
                console.error(error);
            } finally {
                showLoading('subjectLoading', false);
            }
        });

        function renderSubjects(subjects) {
            const container = document.getElementById('subjectResults');
            container.innerHTML = subjects.map((subject, index) => `
                <div class="subject-option" data-index="${index}">
                    <input type="radio" name="subject" id="subject${index}" value="${index}">
                    <label for="subject${index}" style="flex: 1; cursor: pointer;">${subject}</label>
                </div>
            `).join('');

            // Add click handlers
            container.querySelectorAll('.subject-option').forEach(option => {
                option.addEventListener('click', (e) => {
                    const index = parseInt(option.dataset.index);
                    document.getElementById(`subject${index}`).checked = true;
                    document.getElementById('subjectInput').value = subjects[index];
                    
                    // Visual feedback
                    container.querySelectorAll('.subject-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    
                    showStatus('Subject line selected!');
                });
            });
        }

        // ============================================
        // Body Generation
        // ============================================

        document.getElementById('generateBodyBtn').addEventListener('click', async () => {
            showLoading('bodyLoading', true);
            
            try {
                const prompt = state.prompts['body-full'];
                const result = await callAI(prompt, 'You are an expert email copywriter for affiliate marketing. Write compelling, authentic promotional emails that convert.');
                
                bodyEditor.setHTML(formatEmailHTML(result));
                
                if (state.signatureLocked) {
                    appendSignature();
                }
                
                showStatus('Email body generated!');
            } catch (error) {
                console.error(error);
            } finally {
                showLoading('bodyLoading', false);
            }
        });

        document.getElementById('regenerateBodyBtn').addEventListener('click', () => {
            document.getElementById('generateBodyBtn').click();
        });

        // ============================================
        // Signature Management
        // ============================================

        document.getElementById('signatureLockToggle').addEventListener('click', () => {
            state.signatureLocked = !state.signatureLocked;
            Storage.set('signature_locked', state.signatureLocked);
            updateLockUI();
            showStatus(state.signatureLocked ? 'Signature locked (auto-appends)' : 'Signature unlocked');
        });

        function updateLockUI() {
            const toggle = document.getElementById('signatureLockToggle');
            const status = document.getElementById('lockStatus');
            
            if (state.signatureLocked) {
                toggle.classList.add('active');
                status.textContent = '🔒 Locked';
            } else {
                toggle.classList.remove('active');
                status.textContent = '🔓 Unlocked';
            }
        }

        document.getElementById('saveSignatureBtn').addEventListener('click', () => {
            state.signature = signatureEditor.getHTML();
            Storage.set('signature', state.signature);
            showStatus('Signature saved!');
        });

        document.getElementById('insertSignatureBtn').addEventListener('click', () => {
            appendSignature();
            showStatus('Signature inserted!');
        });

        function appendSignature() {
            if (state.signature) {
                const currentContent = bodyEditor.getHTML();
                bodyEditor.setHTML(currentContent + '<br><br>' + state.signature);
            }
        }

        document.getElementById('editSignatureBtn').addEventListener('click', () => {
            signatureEditor.setHTML(state.signature);
        });

        // ============================================
        // Copy Functions
        // ============================================

        document.getElementById('copySubjectBtn').addEventListener('click', () => {
            const subject = document.getElementById('subjectInput').value;
            copyToClipboard(subject);
            showStatus('Subject copied!');
        });

        document.getElementById('copyBodyBtn').addEventListener('click', () => {
            const html = cleanEmailHTML(bodyEditor.getHTML());
            copyToClipboard(html);
            showStatus('Body HTML copied!');
        });

        document.getElementById('copyFullEmailBtn').addEventListener('click', () => {
            const subject = document.getElementById('subjectInput').value;
            const body = cleanEmailHTML(bodyEditor.getHTML());
            const fullEmail = `SUBJECT: ${subject}\n\n---\n\n${body}`;
            copyToClipboard(fullEmail);
            showStatus('Full email copied! (Subject + Body)');
        });

        document.getElementById('viewHtmlBtn').addEventListener('click', () => {
            const html = cleanEmailHTML(bodyEditor.getHTML());
            const win = window.open('', 'HTML Source', 'width=800,height=600');
            win.document.write(`<pre style="background:#1e1e1e;color:#d4d4d4;padding:20px;font-family:monospace;white-space:pre-wrap;">${escapeHtml(html)}</pre>`);
        });

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // HTML Formatting
        // ============================================

        function formatEmailHTML(text) {
            // Convert plain text to basic HTML paragraphs
            return text.split('\n\n').map(para => {
                if (para.trim()) {
                    return `<p><span style="font-size:16px">${para.trim()}</span></p>`;
                }
                return '';
            }).join('\n');
        }

        function cleanEmailHTML(html) {
            // Remove Toast UI wrapper classes and keep only inline styles
            // This matches MLGS format
            let clean = html;
            
            // Remove unnecessary attributes but keep inline styles
            clean = clean.replace(/class="[^"]*"/g, '');
            clean = clean.replace(/data-[^=]*="[^"]*"/g, '');
            clean = clean.replace(/contenteditable="[^"]*"/g, '');
            
            return clean;
        }

        // ============================================
        // Template Management
        // ============================================

        document.getElementById('saveTemplateBtn').addEventListener('click', () => {
            const name = prompt('Template name:');
            if (!name) return;

            const template = {
                id: Date.now(),
                name: name,
                subject: document.getElementById('subjectInput').value,
                body: bodyEditor.getHTML(),
                created: new Date().toISOString()
            };

            state.templates.push(template);
            Storage.set('templates', state.templates);
            renderTemplates();
            showStatus('Template saved!');
        });

        function renderTemplates() {
            const container = document.getElementById('templateList');
            if (state.templates.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 12px;">No saved templates</p>';
                return;
            }

            container.innerHTML = state.templates.map(t => `
                <div class="template-item" data-id="${t.id}">
                    <span class="template-name">${t.name}</span>
                    <div class="template-actions">
                        <button class="btn btn-small load-template">Load</button>
                        <button class="btn btn-small btn-danger delete-template">×</button>
                    </div>
                </div>
            `).join('');

            // Add event listeners
            container.querySelectorAll('.load-template').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.closest('.template-item').dataset.id);
                    loadTemplate(id);
                });
            });

            container.querySelectorAll('.delete-template').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.closest('.template-item').dataset.id);
                    deleteTemplate(id);
                });
            });
        }

        function loadTemplate(id) {
            const template = state.templates.find(t => t.id === id);
            if (template) {
                document.getElementById('subjectInput').value = template.subject;
                bodyEditor.setHTML(template.body);
                showStatus(`Loaded: ${template.name}`);
            }
        }

        function deleteTemplate(id) {
            if (!confirm('Delete this template?')) return;
            state.templates = state.templates.filter(t => t.id !== id);
            Storage.set('templates', state.templates);
            renderTemplates();
            showStatus('Template deleted');
        }

        // ============================================
        // Backup & Restore
        // ============================================

        document.getElementById('backupBtn').addEventListener('click', () => {
            const backup = {
                version: '1.0',
                date: new Date().toISOString(),
                signature: state.signature,
                signatureLocked: state.signatureLocked,
                templates: state.templates,
                prompts: state.prompts
            };

            const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mlgs-backup-${Date.now()}.json`;
            a.click();
            showStatus('Backup downloaded!');
        });

        document.getElementById('restoreBtn').addEventListener('click', () => {
            document.getElementById('restoreFileInput').click();
        });

        document.getElementById('restoreFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const backup = JSON.parse(event.target.result);
                    
                    state.signature = backup.signature || '';
                    state.signatureLocked = backup.signatureLocked !== undefined ? backup.signatureLocked : true;
                    state.templates = backup.templates || [];
                    state.prompts = backup.prompts || getDefaultPrompts();

                    Storage.set('signature', state.signature);
                    Storage.set('signature_locked', state.signatureLocked);
                    Storage.set('templates', state.templates);
                    Storage.set('prompts', state.prompts);

                    signatureEditor.setHTML(state.signature);
                    updateLockUI();
                    renderTemplates();

                    showStatus('Backup restored successfully!');
                } catch (error) {
                    showStatus('Invalid backup file', 'error');
                }
            };
            reader.readAsText(file);
        });

        // ============================================
        // API Settings Modal
        // ============================================

        document.getElementById('apiSettingsBtn').addEventListener('click', () => {
            document.getElementById('apiModal').classList.add('active');
            document.getElementById('apiProvider').value = state.apiProvider;
            document.getElementById('apiKeyInput').value = state.apiKey;
        });

        document.getElementById('closeApiModal').addEventListener('click', () => {
            document.getElementById('apiModal').classList.remove('active');
        });

        document.getElementById('saveApiKeyBtn').addEventListener('click', () => {
            state.apiKey = document.getElementById('apiKeyInput').value;
            state.apiProvider = document.getElementById('apiProvider').value;
            
            Storage.set('api_key', state.apiKey);
            Storage.set('api_provider', state.apiProvider);
            
            document.getElementById('apiModal').classList.remove('active');
            showStatus('API settings saved!');
        });

        // ============================================
        // Prompt Library
        // ============================================

        document.querySelectorAll('.prompt-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.type;
                const prompt = state.prompts[type];
                copyToClipboard(prompt);
                showStatus(`Copied ${btn.textContent.trim()} prompt!`);
            });
        });

        // ============================================
        // Clear Editor
        // ============================================

        document.getElementById('clearEditorBtn').addEventListener('click', () => {
            if (confirm('Clear the editor?')) {
                bodyEditor.setHTML('');
                showStatus('Editor cleared');
            }
        });

        // ============================================
        // Help Button
        // ============================================

        document.getElementById('helpBtn').addEventListener('click', () => {
            alert(`🔥 MLGS SWIPE MACHINE - Quick Guide

1. Set API Key (Settings button)
   - Get free key: console.groq.com
   
2. Generate Subjects
   - Click "Generate 10 Subject Lines"
   - Click any subject to use it
   
3. Generate Body
   - Click "Generate Body"
   - Edit in visual editor
   - Images, links, formatting all work
   
4. Signature
   - Edit your signature once
   - Lock it to auto-append
   - Or unlock for custom emails
   
5. Copy & Paste
   - "Copy Full Email" = Subject + Body together
   - Paste into MLGS, grab subject from top
   - Or copy Subject/Body separately
   
6. Save Templates
   - Save winning emails
   - Load anytime
   
7. Backup
   - Download all your data
   - Restore anytime

Never lose your work. Never wait for MLGS timer.`);
        });

        // ============================================
        // Initialize App
        // ============================================

        function init() {
            // Load signature
            if (state.signature) {
                signatureEditor.setHTML(state.signature);
            }
            
            // Update UI
            updateLockUI();
            renderTemplates();
            
            console.log('🔥 MLGS Swipe Machine Ready');
        }

        init();
    </script>

</body>
</html>
