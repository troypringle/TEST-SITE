<script>
const $ = (id) => document.getElementById(id);

function showToast(msg, err=false){
  const t = $("toast");
  if (!t) { console.error("Toast element missing"); return; }
  t.textContent = msg;
  t.style.border = err ? "2px solid var(--red)" : "2px solid var(--green)";
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2800);
}

async function callGroq(prompt){
  const key = $("apiKey").value.trim() || localStorage.getItem("esm_apiKey") || "";
  if(!key){ showToast("Groq API Key required", true); return null; }

  try{
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${key}`
      },
      body:JSON.stringify({
        model: $("model").value,
        messages:[{role:"user",content:prompt}],
        temperature:0.7,
        max_tokens:1200
      })
    });

    if(!res.ok){
      const errText = await res.text();
      throw new Error(`HTTP ${res.status}: ${errText}`);
    }

    const data = await res.json();
    const out = data?.choices?.[0]?.message?.content;
    if(!out) throw new Error("No output returned from API.");
    return out.trim();

  }catch(e){
    const raw = $("rawText");
    if (raw) raw.value = e.message;
    showToast("API error – check Raw Output", true);
    return null;
  }
}

// Generate Title (1 only)
async function generateSubjectsHard(){
  const results = $("subjectResults");
  if (!results) return;
  results.innerHTML = "";

  const prompt =
    ( $("customTitlePrompt")?.value || "" ) +
    `\nOffer: ${$("offerName")?.value || "this offer"}` +
    `\nBenefits:\n${$("benefits")?.value || ""}`;

  const text = await callGroq(prompt);
  if(!text) return;

  if ($("rawText")) $("rawText").value = text;

  const div = document.createElement("div");
  div.className = "subjectItem";
  div.innerHTML = `<div style="font-weight:900">${text}</div>`;
  div.onclick = () => {
    if ($("subject")) $("subject").value = text;
    updatePreview();
    showToast("Title selected");
  };
  results.appendChild(div);
}

// Generate Body (1 only)
async function generateBodyHard(){
  const prompt =
    ( $("customBodyPrompt")?.value || "" ) +
    `\nOffer: ${$("offerName")?.value || "this offer"}` +
    `\nBenefits:\n${$("benefits")?.value || ""}`;

  const text = await callGroq(prompt);
  if(!text) return;

  if ($("rawText")) $("rawText").value = text;
  const editor = $("bodyEditor");
  if (editor) editor.innerHTML = text.replace(/\n/g, "<br>");
  updatePreview();
  showToast("Body generated");
}

function updatePreview(){
  const prevSub = $("prevSub");
  const subject = $("subject");
  if (prevSub && subject) prevSub.textContent = subject.value.trim() || "...";

  const editor = $("bodyEditor");
  const prevBody = $("prevBody");
  if (editor && prevBody) prevBody.innerHTML = editor.innerHTML || "Preview appears here...";
}

// --- wire up buttons (all guarded) ---
const genSubjectsBtn = $("genSubjects");
if (genSubjectsBtn) genSubjectsBtn.onclick = generateSubjectsHard;

const genBodyBtn = $("genBody");
if (genBodyBtn) genBodyBtn.onclick = generateBodyHard;

const copyFullBtn = $("copyFull");
if (copyFullBtn) copyFullBtn.onclick = () => {
  const subject = $("subject")?.value.trim() || "";
  const body = $("bodyEditor")?.innerHTML || "";
  const full = subject + "\n\n" + body;
  navigator.clipboard.writeText(full).then(() => showToast("Full email copied (HTML)"));
};

const saveKeyBtn = $("saveKey");
if (saveKeyBtn) saveKeyBtn.onclick = () => {
  const key = $("apiKey")?.value.trim() || "";
  localStorage.setItem("esm_apiKey", key);
  showToast("Key saved");
};

const toggleThemeBtn = $("toggleTheme");
if (toggleThemeBtn) toggleThemeBtn.onclick = () => document.body.classList.toggle("theme-slate");

const openRawBtn = $("openRaw");
if (openRawBtn) openRawBtn.onclick = () => {
  const rawModal = $("rawModal");
  if (rawModal) rawModal.classList.add("show");
  else showToast("Raw modal missing", true);
};

const closeRawBtn = $("closeRaw");
if (closeRawBtn) closeRawBtn.onclick = () => {
  const rawModal = $("rawModal");
  if (rawModal) rawModal.classList.remove("show");
};

const subjectInput = $("subject");
if (subjectInput) subjectInput.oninput = updatePreview;

const editor = $("bodyEditor");
if (editor) editor.oninput = updatePreview;

// Image modal (optional) — add HTML if you want it; for now just guard
const openImageBtn = $("openImageModal");
if (openImageBtn) openImageBtn.onclick = () => {
  const m = $("imageModal");
  if(!m) return showToast("Image modal not built yet (no #imageModal).", true);
  m.classList.add("show");
};

// Signatures (optional) — guard so page still works if not implemented
const manageSigsBtn = $("manageSigs");
if (manageSigsBtn) manageSigsBtn.onclick = () => {
  const m = $("sigModal");
  if(!m) return showToast("Signature modal not built yet (no #sigModal).", true);
  m.classList.add("show");
};

const closeSigBtn = $("closeSig");
if (closeSigBtn) closeSigBtn.onclick = () => {
  const m = $("sigModal");
  if(m) m.classList.remove("show");
};

const insertSigBtn = $("insertSig");
if (insertSigBtn) insertSigBtn.onclick = () => {
  showToast("Signature insertion not implemented yet.", true);
};

// Optional: restore saved key
const apiKeyInput = $("apiKey");
if (apiKeyInput && localStorage.getItem("esm_apiKey")) {
  apiKeyInput.value = localStorage.getItem("esm_apiKey");
}

// Initialize preview
updatePreview();
</script>
