<script>
const $ = (id) => document.getElementById(id);

function showToast(msg, err=false){
  const t = $("toast");
  t.textContent = msg;
  t.style.border = err ? "2px solid var(--red)" : "2px solid var(--green)";
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2800);
}

async function callGroq(prompt){
  const key = $("apiKey").value.trim() || localStorage.getItem("esm_apiKey") || "";
  if(!key){ showToast("Groq API Key required", true); return null; }

  try{
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${key}`
      },
      body:JSON.stringify({
        model: $("model").value,
        messages:[{role:"user",content:prompt}],
        temperature:0.7,
        max_tokens:1200
      })
    });

    if(!res.ok){
      const errText = await res.text();
      throw new Error(`HTTP ${res.status}: ${errText}`);
    }

    const data = await res.json();
    const out = data?.choices?.[0]?.message?.content;
    if(!out) throw new Error("No output returned from API.");
    return out.trim();

  }catch(e){
    $("rawText").value = e.message;
    showToast("API error – check Raw Output", true);
    return null;
  }
}

// Generate Title (1 only)
async function generateSubjectsHard(){
  $("subjectResults").innerHTML = "";
  const prompt =
    $("customTitlePrompt").value +
    `\nOffer: ${$("offerName").value || "this offer"}` +
    `\nBenefits:\n${$("benefits").value || ""}`;

  const text = await callGroq(prompt);
  if(!text) return;

  $("rawText").value = text;

  const div = document.createElement("div");
  div.className = "subjectItem";
  div.innerHTML = `<div style="font-weight:900">${text}</div>`;
  div.onclick = () => { $("subject").value = text; updatePreview(); showToast("Title selected"); };
  $("subjectResults").appendChild(div);
}

// Generate Body (1 only)
async function generateBodyHard(){
  const prompt =
    $("customBodyPrompt").value +
    `\nOffer: ${$("offerName").value || "this offer"}` +
    `\nBenefits:\n${$("benefits").value || ""}`;

  const text = await callGroq(prompt);
  if(!text) return;

  $("rawText").value = text;
  $("bodyEditor").innerHTML = text.replace(/\n/g, "<br>");
  updatePreview();
  showToast("Body generated");
}

function updatePreview(){
  $("prevSub").textContent = $("subject").value.trim() || "...";
  const html = $("bodyEditor").innerHTML;
  $("prevBody").innerHTML = html || "Preview appears here...";
}

// --- event wiring (NO #) ---
$("genSubjects").onclick = generateSubjectsHard;
$("genBody").onclick = generateBodyHard;

$("copyFull").onclick = () => {
  const full = $("subject").value.trim() + "\n\n" + $("bodyEditor").innerHTML;
  navigator.clipboard.writeText(full).then(() => showToast("Full email copied (HTML)"));
};

$("saveKey").onclick = () => {
  localStorage.setItem("esm_apiKey", $("apiKey").value.trim());
  showToast("Key saved");
};

$("toggleTheme").onclick = () => document.body.classList.toggle("theme-slate");
$("openRaw").onclick = () => $("rawModal").classList.add("show");
$("closeRaw").onclick = () => $("rawModal").classList.remove("show");

$("subject").oninput = updatePreview;
$("bodyEditor").oninput = updatePreview;

// IMPORTANT: you don't have imageModal HTML, so guard these:
$("openImageModal").onclick = () => {
  const m = $("imageModal");
  if(!m) return showToast("Image modal HTML is missing (no #imageModal).", true);
  m.classList.add("show");
};

// If you later add <button id="closeImageModal">, this will work:
const closeBtn = $("closeImageModal");
if(closeBtn){
  closeBtn.onclick = () => $("imageModal").classList.remove("show");
}

updatePreview();
</script>
