<!DOCTYPE html>
<html lang="en">
<head>
    <title>Official PRELAUNCH By Joel Therien My Sponsors Downline</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
        /* ==================================================== */
        /* 1. MAIN PAGE STYLES (PRELAUNCH PAGE)                */
        /* ==================================================== */
        /* ... all original page styles from previous combined version ... */

        /* ... original media queries ... */

        /* ==================================================== */
        /* 2. ALTERNATING PROFESSOR FLOATIE START (UPDATED)   */
        /* ==================================================== */
        
        /* KEYFRAMES: Refined Movement (Constrained Vertically) & Intermittent Transparency Pulse */
        @keyframes professorRefinedBehavior {
            /* PATH CONSTRAINT: Spent ~75% of duration in top 50% of viewport */
            0%   { transform: translate(5vw, 10vh)  rotate(0deg); opacity: 0.8; }
            5%   { transform: translate(15vw, 15vh) rotate(5deg); opacity: 0.8; }
            10%  { transform: translate(90vw, 10vh) rotate(15deg); opacity: 0.8; } /* Fast Dash Right */
            12%  { transform: translate(92vw, 12vh) rotate(15deg); opacity: 0.8; } /* Hesitate Right */
            25%  { transform: translate(50vw, 40vh) rotate(-10deg); opacity: 0.8; } /* Shallow Dive Bottom */
            
            /* INTERMITTENT TRANSPARENCY PULSE 1 (Pass-through effect) */
            30%  { transform: translate(20vw, 20vh) rotate(-15deg); opacity: 0.4; filter: drop-shadow(0 0 10px rgba(0, 255, 136, 1.0)) blur(2px); } 
            
            40%  { transform: translate(-10vw, 50vh) rotate(-30deg); opacity: 0.8; filter: none; } /* Dash Left Offscreen */
            55%  { transform: translate(105vw, 60vh) rotate(45deg); opacity: 0.8; } /* Dash Bottom Right Corner */
            70%  { transform: translate(20vw, 30vh) rotate(5deg); opacity: 0.8; } /* Swoop Back Top Left */
            
            /* INTERMITTENT TRANSPARENCY PULSE 2 */
            75%  { transform: translate(80vw, 20vh) rotate(-15deg); opacity: 0.4; filter: drop-shadow(0 0 10px rgba(0, 255, 136, 1.0)) blur(2px); }
            
            85%  { transform: translate(80vw, 10vh) rotate(0deg); opacity: 0.8; filter: none; } /* Top Right */
            100% { transform: translate(5vw, 10vh)  rotate(0deg); opacity: 0.8; } /* Back Home */
        }

        /* THE CONTAINER (Position & Refined Behavior) */
        .float-container {
            position: fixed;
            top: 0; left: 0;
            z-index: 10000; /* Stays above everything */
            pointer-events: none; /* CLICK-THROUGH ACTIVE */
            opacity: 0.8; /* Slight overall ghostliness */
            
            /* THE MOVEMENT & BEHAVIOR (Slowed Down, Linear Speed) */
            /* 18s total loop slowed to 30s. Intermittent transparent pulses active. */
            animation: professorRefinedBehavior 30s linear infinite; 
        }

        /* THE CONTENT (Detailed Shape, Glow, and Placeholders) */
        .float-content {
            /* SIZE: Keeping it slightly smaller for better mobile presence */
            width: 120px;
            height: 120px;
            
            /* GHOST PRINCIPLES */
            mix-blend-mode: screen; /* Helps the glow "pop" against dark backgrounds */
            transition: opacity 0.3s, background 0.3s; /* Smooth alternating swap */

            /* THE odd, irregular, character-driven shape placeholder */
            /* This odd shape frames the detailed professor figure */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            
            /* MINT GREEN GLOW (Matches Video Border) */
            /* filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.9)) 
                    drop-shadow(0 0 25px rgba(0, 255, 136, 0.5)); */
            
            /* Initial Background state (Will be overwritten by JS) */
            background: transparent;
        }

        /* ALTERNATING PROFESSOR FLOATIE END                  */
        /* ==================================================== */
    </style>
</head>
<body>

<div class="float-container" id="floatMaster">
    <div class="float-content" id="floatContent"></div>
</div>
<script>
    /* ==================================================== */
    /* PROFESSOR ALTERNATING LOGIC START (UPDATED)         */
    /* ==================================================== */
    (function() {
        var master = document.getElementById('floatMaster');
        var content = document.getElementById('floatContent');
        
        /* These are CSS placeholders representing the "Eye-Popping, 
           Thematic Professor" concepts we discussed. They combine
           detailed professor figures with 'Candy' high-contrast 
           colors (Pink/Orange) and futuristic Blue/Green accents.
        */
        var styles = [
            // Concept 1: "Vaporwave Vortex Professor" (Pink core, Green accent)
            // A detailed portrait with pink core light and green accent light.
            "radial-gradient(circle at center, #ff0055 0%, #ffcc00 60%, transparent 100%)",
            
            // Concept 2: "Quantum Choice Doctor" (Blue/Purple choice theme)
            // Two hands holding Vaporwave Blue and Purple data.
            "linear-gradient(135deg, #6c5ce7 0%, #0984e3 100%)",
            
            // Concept 3: "Rejection Skull" (Direct Matrix Text Reference)
            // Jagged text within an irregular skull shape.
            "repeating-linear-gradient(45deg, transparent, transparent 10px, #00ff88 10px, #00ff88 11px), linear-gradient(180deg, #000, #111)",
            
            // Concept 4: "Urgency Orange Professor" (Matrix Text Block)
            // The professor with an assertive gesture and Urgent Orange warning colors.
            "linear-gradient(135deg, #d63031 0%, #e17055 100%)"
        ];
        
        // Initial state: Show first style
        content.style.background = styles[0];
        
        // Tiny logic to swap randomly, with subtle background transition
        function randomStyleSwap() {
            var randomIndex = Math.floor(Math.random() * styles.length);
            
            /* Smooth transition swap:
               1. CSS handles fade background change via transition: background 0.3s
            */
            content.style.background = styles[randomIndex];
            
            /* The opacity keyframes handle the intermittent transparency pulses
               interdependently, so the JS logic for swapping only affects background.
            */
        }
        
        // Start the random alternating every 8 seconds (slightly slower swap to match movement)
        setInterval(randomStyleSwap, 8000);
    })();
    /* PROFESSOR ALTERNATING LOGIC END                     */
    /* ==================================================== */

    /* ... original JAVASCRIPT FOR URL PARAMS (Kept) ... */
</script>

</body>
</html>
