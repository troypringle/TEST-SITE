<!DOCTYPE html>
<html lang="en">
<head>
    <title>Official PRELAUNCH - Matrix Edition</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <style>
        /* FORCE JET BLACK BACKGROUND */
        html, body {
            background-color: #000000 !important;
            margin: 0;
            padding: 10px;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page-border {
            width: 100%;
            max-width: 820px;
            border: 2px solid #1a1a1a; 
            border-radius: 13px;
            padding: 15px;
            background: #020202; 
            text-align: center;
            position: relative;
            z-index: 5;
        }

        /* ==================================================== */
        /* THE FLOATING CHARACTER                              */
        /* ==================================================== */
        @keyframes professorFloat {
            0%   { transform: translate(10vw, 5vh) rotate(0deg); opacity: 0.8; }
            25%  { transform: translate(75vw, 12vh) rotate(10deg); opacity: 0.9; }
            /* Intermittent Transparency Pulse */
            50%  { transform: translate(45vw, 30vh) rotate(-5deg); opacity: 0.2; } 
            75%  { transform: translate(-5vw, 15vh) rotate(-15deg); opacity: 0.8; }
            100% { transform: translate(10vw, 5vh) rotate(0deg); opacity: 0.8; }
        }

        .float-container {
            position: fixed;
            top: 0; left: 0;
            z-index: 9999;
            pointer-events: none; /* Click right through him */
            animation: professorFloat 28s ease-in-out infinite;
        }

        .professor-img {
            width: 150px; 
            height: auto;
            /* MINT GREEN GLOW */
            filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.9)) 
                    drop-shadow(0 0 20px rgba(0, 255, 136, 0.4));
        }

        /* ==================================================== */
        /* UI ELEMENTS                                         */
        /* ==================================================== */
        .streak-container {
            width: 100%;
            max-width: 900px; 
            height: 90px;      
            background: url('https://linkpod.s3.us-east-1.amazonaws.com/uploads/block_images/f3511efd5936e0986b6fb7034cecc2c7.png') center / cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .streak-text {
            font-size: 28px; 
            color: #ff0000;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border: 2px solid #004d26; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); 
            border-radius: 8px;
            margin: 20px 0;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .cta-btn {
            display: block;
            background: rgba(0, 30, 15, 0.8);
            border: 1px solid #00ff88;
            color: #fff;
            padding: 15px;
            text-decoration: none;
            font-weight: 900;
            font-size: 20px;
            border-radius: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="float-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/af/Question_mark.svg" class="professor-img" id="floatingChar">
</div>

<div class="page-border">
    <div class="streak-container">
        <p class="streak-text">Time Sensitive New Updates</p>
    </div>

    <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/S-T07JIxQEk?rel=0&modestbranding=1" frameborder="0" allowfullscreen></iframe>
    </div>

    <a href="https://troypringle2.aimatrixspillover.com/" class="cta-btn">CLICK TO SECURE YOUR SPOT ✔️</a>
</div>

<script>
    // To use your own images tomorrow:
    // 1. Upload your scientist images to the same folder as this HTML file.
    // 2. Update the names in the list below (e.g., 'scientist1.png').
    const char = document.getElementById('floatingChar');
    const images = [
        "https://upload.wikimedia.org/wikipedia/commons/a/af/Question_mark.svg", 
        "https://upload.wikimedia.org/wikipedia/commons/0/02/SVG_logo.svg"
    ];
    let i = 0;
    setInterval(() => {
        i = (i + 1) % images.length;
        char.src = images[i];
    }, 12000); 
</script>

</body>
</html>
