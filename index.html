<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Command Center - MERGED ELITE</title>
    <style>
        :root { --cols: 4; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 98%; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Layout Controls */
        .top-nav { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; padding: 15px 25px; border-radius: 12px; margin-bottom: 25px; color: white; }
        .slider-box { display: flex; align-items: center; gap: 15px; }
        
        #progress-container { background:#e9ecef; border-radius:10px; margin-bottom:25px; overflow:hidden; border: 1px solid #ccc; height: 35px; }
        #progress-bar { background: linear-gradient(90deg, #28a745, #218838); width:0%; height:100%; text-align:center; color:white; font-weight:bold; line-height:35px; transition:width 0.4s; }

        /* Section Styling */
        .section-wrapper { margin-bottom: 30px; border-radius: 12px; border: 1px solid #ddd; background: #fff; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .section-header { 
            display: flex; justify-content: space-between; align-items: center;
            color: white; padding: 12px 20px; cursor: move; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
        }
        .header-tools { display: flex; align-items: center; gap: 12px; }
        .color-circle { width: 22px; height: 22px; border: 2px solid white; border-radius: 50%; cursor: pointer; padding: 0; }

        /* Responsive Grid */
        .task-grid { 
            display: grid; 
            grid-template-columns: repeat(var(--cols), 1fr); 
            gap: 20px; padding: 20px; min-height: 100px;
            background: #fcfcfc;
        }

        /* Task Cards */
        .task-card { 
            background: #fff; padding: 15px; border-radius: 10px; border: 2px solid #eee; 
            display: flex; flex-direction: column; gap: 12px; position: relative;
            transition: all 0.2s ease;
        }
        .task-card:hover { border-color: #007bff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        
        .card-top { display: flex; align-items: flex-start; gap: 12px; }
        .chk-box { width: 24px; height: 24px; cursor: pointer; flex-shrink: 0; }
        .task-title { font-weight: bold; font-size: 14px; flex-grow: 1; border: none; background: transparent; outline: none; }

        .btn-action { 
            display: block; padding: 12px; color: white; text-decoration: none; 
            border-radius: 6px; font-size: 13px; font-weight: bold; text-align: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15); transition: 0.1s;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: none; }

        .note-area { 
            font-size: 12px; color: #444; background: #fffde7; padding: 10px; 
            border-radius: 6px; border: 1px solid #ffe57f; min-height: 50px; outline: none;
            font-style: italic;
        }

        /* Utility */
        .move-link { font-size: 10px; width: 100%; padding: 5px; border-radius: 4px; border: 1px solid #ddd; }
        .del-x { position: absolute; top: 5px; right: 5px; background: none; border: none; color: #ddd; cursor: pointer; font-size: 16px; }
        .del-x:hover { color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <h2 style="margin:0;">Traffic Command Center</h2>
        <div class="slider-box">
            <span>Columns:</span>
            <input type="range" min="2" max="6" value="4" id="wSlider" oninput="changeCols(this.value)">
            <span id="wLabel">4</span>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="exportData()" style="padding:6px 12px; cursor:pointer; font-weight:bold;">Backup</button>
            <button onclick="document.getElementById('fileIn').click()" style="padding:6px 12px; cursor:pointer; font-weight:bold;">Restore</button>
            <input type="file" id="fileIn" style="display:none;" onchange="importData(event)">
        </div>
    </div>
    
    <div id="progress-container"><div id="progress-bar">Goal: 0%</div></div>
    
    <div id="sections-container"></div>

    <div style="text-align: center; margin-top: 40px;">
        <button onclick="newCategory()" style="background:#007bff; color:white; border:none; padding:15px 40px; border-radius:10px; cursor:pointer; font-weight:bold; font-size:16px; box-shadow: 0 4px 10px rgba(0,123,255,0.3);">+ ADD NEW CATEGORY</button>
    </div>
</div>

<script>
    // --- DATA RECOVERY & MERGE ENGINE ---
    function mergeData() {
        let finalTasks = JSON.parse(localStorage.getItem('tasks_v4')) || [];
        let finalCats = JSON.parse(localStorage.getItem('cats_v4')) || [];

        // 1. Recover old Categories if none exist
        if (finalCats.length === 0) {
            let oldCats = JSON.parse(localStorage.getItem('categories')) || [
                { id: 'c1', name: 'Daily Traffic Routine', color: '#007bff' },
                { id: 'c2', name: 'Research Hub', color: '#17a2b8' },
                { id: 'c3', name: 'Social Media', color: '#e83e8c' }
            ];
            finalCats = oldCats;
        }

        // 2. Merge old Tasks (mainTasks key)
        let legacyTasks = JSON.parse(localStorage.getItem('mainTasks')) || [];
        legacyTasks.forEach(lt => {
            if (!finalTasks.find(t => t.name === lt.name)) {
                finalTasks.push({
                    id: lt.id || 't' + Math.random(),
                    catId: lt.category || 'c1',
                    name: lt.name,
                    url: lt.url || '#',
                    btnText: lt.btnText || 'OPEN LINK',
                    checked: lt.checked || false,
                    note: lt.note || ''
                });
            }
        });

        // 3. Merge very old Research Links
        let researchLinks = JSON.parse(localStorage.getItem('researchLinks')) || [];
        researchLinks.forEach(rl => {
            if (!finalTasks.find(t => t.name === rl.name)) {
                finalTasks.push({
                    id: 'r' + Math.random(),
                    catId: 'c2',
                    name: rl.name,
                    url: rl.url || '#',
                    btnText: 'VIEW RESEARCH',
                    checked: false,
                    note: rl.note || ''
                });
            }
        });

        localStorage.setItem('tasks_v4', JSON.stringify(finalTasks));
        localStorage.setItem('cats_v4', JSON.stringify(finalCats));
        return { tasks: finalTasks, categories: finalCats };
    }

    // --- APP CORE ---
    let { tasks, categories } = mergeData();

    function save() {
        localStorage.setItem('tasks_v4', JSON.stringify(tasks));
        localStorage.setItem('cats_v4', JSON.stringify(categories));
        updateProgress();
    }

    function changeCols(v) {
        document.documentElement.style.setProperty('--cols', v);
        document.getElementById('wLabel').innerText = v;
        localStorage.setItem('pref_cols', v);
    }

    function render() {
        const container = document.getElementById('sections-container');
        container.innerHTML = '';

        categories.forEach(cat => {
            const catTasks = tasks.filter(t => t.catId === (cat.id || cat.category));
            const html = `
                <div class="section-wrapper" ondragover="event.preventDefault()" ondrop="handleDrop(event, '${cat.id}')">
                    <div class="section-header" style="background: ${cat.color}">
                        <span contenteditable="true" onblur="editCatName('${cat.id}', this.innerText)">${cat.name}</span>
                        <div class="header-tools">
                            <input type="color" class="color-circle" value="${cat.color}" onchange="editCatColor('${cat.id}', this.value)">
                            <button onclick="newTask('${cat.id}')" style="background:white; border:none; padding:3px 10px; border-radius:4px; font-size:11px; cursor:pointer;">+ Task</button>
                            <button onclick="delCat('${cat.id}')" style="background:none; border:none; color:white; cursor:pointer;">🗑️</button>
                        </div>
                    </div>
                    <div class="task-grid">
                        ${catTasks.map(t => renderTask(t)).join('')}
                    </div>
                </div>`;
            container.innerHTML += html;
        });
        updateProgress();
        updateTimer();
    }

    function renderTask(t) {
        const moveOptions = categories.map(c => `<option value="${c.id}" ${t.catId === c.id ? 'selected' : ''}>Move to: ${c.name}</option>`).join('');
        
        return `
            <div class="task-card" id="${t.id}" draggable="true" ondragstart="event.dataTransfer.setData('text', '${t.id}')">
                <button class="del-x" onclick="delTask('${t.id}')">×</button>
                <div class="card-top">
                    <input type="checkbox" class="chk-box" ${t.checked ? 'checked' : ''} onchange="toggleCheck('${t.id}')">
                    <div class="task-title" contenteditable="true" onblur="editTask('${t.id}', 'name', this.innerText)">${t.name}</div>
                </div>
                
                <a href="${t.url}" target="_blank" class="btn-action" 
                   style="background: ${t.id === 't1' ? '#007bff' : '#28a745'}" 
                   onclick="clickMLGS('${t.id}')">${t.btnText || 'OPEN LINK'}</a>
                
                ${t.id === 't1' ? '<div id="mlgs-status" style="font-size:11px; text-align:center; font-weight:bold; color:#d00000;"></div>' : ''}

                <div class="note-area" contenteditable="true" onblur="editTask('${t.id}', 'note', this.innerText)">${t.note || 'Notes...'}</div>

                <select class="move-link" onchange="moveTask('${t.id}', this.value)">
                    <option disabled selected>Teleport to Category...</option>
                    ${moveOptions}
                </select>
            </div>`;
    }

    // Logic Functions
    function toggleCheck(id) {
        const t = tasks.find(x => x.id == id);
        t.checked = !t.checked;
        save();
    }

    function editTask(id, key, val) {
        const t = tasks.find(x => x.id == id);
        if(t) { t[key] = val; save(); }
    }

    function moveTask(id, newCat) {
        const t = tasks.find(x => x.id == id);
        t.catId = newCat;
        save(); render();
    }

    function newTask(catId) {
        const name = prompt("Task Name:");
        if(!name) return;
        tasks.push({ id: 't'+Date.now(), catId, name, url: '#', btnText: 'OPEN LINK', checked: false, note: '' });
        save(); render();
    }

    function newCategory() {
        const name = prompt("Category Name:");
        if(!name) return;
        categories.push({ id: 'c'+Date.now(), name, color: '#444444' });
        save(); render();
    }

    function delTask(id) { if(confirm("Delete Task?")) { tasks = tasks.filter(x => x.id != id); save(); render(); } }
    function delCat(id) { if(confirm("Delete Section?")) { categories = categories.filter(x => x.id != id); save(); render(); } }
    function editCatColor(id, color) { const c = categories.find(x => x.id == id); c.color = color; save(); render(); }
    function editCatName(id, name) { const c = categories.find(x => x.id == id); c.name = name; save(); }

    function handleDrop(e, catId) {
        const id = e.dataTransfer.getData('text');
        const t = tasks.find(x => x.id == id);
        if(t) { t.catId = catId; save(); render(); }
    }

    function updateProgress() {
        const total = tasks.length;
        const done = tasks.filter(t => t.checked).length;
        const pct = total ? Math.round((done/total)*100) : 0;
        const bar = document.getElementById('progress-bar');
        if(bar) { bar.style.width = pct+'%'; bar.innerText = `Goal: ${pct}% (${done}/${total})`; }
    }

    function clickMLGS(id) {
        if(id === 't1') {
            localStorage.setItem('mlgs_time', new Date().getTime() + (23 * 60 * 60 * 1000));
            updateTimer();
        }
    }

    function updateTimer() {
        const el = document.getElementById('mlgs-status');
        if(!el) return;
        const next = localStorage.getItem('mlgs_time');
        const diff = next - new Date().getTime();
        if(diff > 0) {
            const d = new Date(parseInt(next));
            el.innerText = `NEXT MAIL: ${d.getHours()%12||12}:${d.getMinutes().toString().padStart(2,'0')} ${d.getHours()>=12?'PM':'AM'}`;
        } else { el.innerText = "READY!"; }
    }

    function exportData() {
        const blob = new Blob([JSON.stringify({tasks, categories})], {type: "application/json"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "Traffic_Command_Final.json"; a.click();
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const d = JSON.parse(ev.target.result);
            tasks = d.tasks; categories = d.categories;
            save(); render();
        };
        reader.readAsText(e.target.files[0]);
    }

    window.onload = () => {
        const savedCols = localStorage.getItem('pref_cols') || 4;
        document.getElementById('wSlider').value = savedCols;
        changeCols(savedCols);
        render();
        setInterval(updateTimer, 60000);
    };
</script>
</body>
</html>
