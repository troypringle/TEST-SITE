<script>
    // 1. URL PARAMETER LOGIC (Existing)
    (function() {
        var params = window.location.search;
        if (params) {
            var links = document.getElementsByTagName('a');
            for (var i = 0; i < links.length; i++) {
                if(links[i].href.indexOf('aimatrixspillover') !== -1) {
                    var sep = links[i].href.indexOf('?') !== -1 ? '&' : '?';
                    links[i].href += sep + params.substring(1);
                }
            }
        }
    })();

    // 2. IMAGE ROTATION + TRANSITION BOOST (Existing)
    (function() {
        const profBox = document.getElementById('profBox');
        let count = 1;
        
        setInterval(() => {
            count = (count % 7) + 1;
            
            // Apply a quick scale effect to "boost" the transition
            profBox.style.transform += " scale(1.15)";
            
            setTimeout(() => {
                profBox.style.backgroundImage = `var(--prof-${count})`;
                // Reset scale after the image swaps
                profBox.style.transform = profBox.style.transform.replace(" scale(1.15)", "");
            }, 150); 

        }, 10000); 
    })();

    // 3. POPUP LOGIC (New Addition)
    (function() {
        const popup = document.getElementById('ecf-popup-overlay');
        const closeBtn = document.getElementById('ecf-popup-close');
        const ctaButtons = document.querySelectorAll('a[href="https://o2s4n.bemobtrcks.com/click"]');
        let exitIntentTriggered = false;

        // Function to show the popup
        function showPopup() {
            if (!exitIntentTriggered) {
                popup.style.display = 'flex';
                exitIntentTriggered = true; // Ensures it only auto-pops once
            }
        }

        // TRIGGER 1: Mouse leaves the top of the browser window (Exit Intent)
        document.addEventListener('mouseleave', function(e) {
            if (e.clientY < 10) {
                showPopup();
            }
        });

        // TRIGGER 2: User scrolls near the bottom of the page
        window.addEventListener('scroll', function() {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50) {
                showPopup();
            }
        });

        // TRIGGER 3: User clicks ANY of your BeMob buttons on the page
        ctaButtons.forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault(); // Stops them from leaving the page instantly
                popup.style.display = 'flex'; // Force popup open
                exitIntentTriggered = true; 
            });
        });

        // CLOSE: User clicks the 'X'
        closeBtn.addEventListener('click', function() {
            popup.style.display = 'none';
        });

        // CLOSE: User clicks the dark background outside the form
        window.addEventListener('click', function(e) {
            if (e.target === popup) {
                popup.style.display = 'none';
            }
        });
    })();
</script>
