<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Email Swipe Machine</title>
    <style>
        :root {
            --bg: #d4c4a8; --panel: #f5f0e6; --panel2: #efe6d8; --border: #c9b896;
            --muted: #5c4d3a; --gold: #b8860b; --green: #2e7d32; --blue: #1976d2; --red: #d32f2f;
            --btn-h: 40px;
        }
        body.theme-slate {
            --bg: #111827; --panel: #1f2937; --panel2: #243244; --border: #374151;
            --muted: #cbd5e1; --gold: #fbbf24; --green: #22c55e; --red: #ef4444;
        }
        * { box-sizing: border-box; font-size: 16px; }
        body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: #111; line-height: 1.6; }
       
        /* Layout */
        .topbar { background: var(--panel); border-bottom: 2px solid var(--gold); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: 200px 1fr 1fr; gap: 16px; padding: 16px; transition: all 0.3s ease; }
        .grid.sidebar-closed { grid-template-columns: 60px 1fr 1fr; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; position: relative; }
       
        /* Sidebar Toggle */
        .sidebar-content { transition: opacity 0.2s; }
        .sidebar-closed .sidebar-content { opacity: 0; visibility: hidden; height: 0; overflow: hidden; }
        .toggle-btn { cursor: pointer; background: var(--gold); color: #fff; border: none; height: 28px; border-radius: 4px; width: 100%; margin-bottom: 15px; font-weight: 900; font-size: 11px; }
        /* Global Button Style */
        .btn {
            border: 1px solid var(--border); background: var(--panel2); color: #111;
            height: var(--btn-h); padding: 0 15px; border-radius: 8px; cursor: pointer;
            font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
            white-space: nowrap;
        }
        .btnGreen { background: var(--green); color: #fff; border: none; }
        .btnBlue { background: var(--blue); color: #fff; border: none; }
        .btnRed { background: var(--red); color: #fff; border: none; }
        .btnSmall { height: 32px; padding: 0 10px; font-size: 14px; }
        /* Inputs */
        input, select, textarea { width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 12px; background: #fff; }
        .toolbar { display: flex; gap: 4px; background: var(--panel2); padding: 8px; border: 2px solid var(--border); border-bottom: 0; border-radius: 8px 8px 0 0; }
        #bodyEditor { width: 100%; max-width: 600px; min-height: 450px; background: #fff; border: 2px solid var(--border); padding: 15px; outline: none; margin: 0 auto; overflow-y: auto; }
        #sourceEditor { display: none; width: 100%; max-width: 600px; min-height: 450px; margin: 0 auto; font-family: monospace; }
        /* Preview Area */
        .preview-subject-box { background: #fff; border: 2px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 20px; min-height: 50px; }
        .preview-body-frame { background: #fff; border: 2px solid var(--border); padding: 25px; min-height: 450px; max-width: 600px; margin: 0 auto; }
        /* Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal.show { display: flex; }
        .modalInner { background: var(--panel); border: 3px solid var(--border); border-radius: 12px; padding: 25px; width: 100%; max-width: 500px; }
    </style>
</head>
<body>
<div id="toast" style="position:fixed; bottom:20px; right:20px; background:#333; color:#fff; padding:12px 24px; display:none; border-radius:8px; z-index:99999;"></div>
<div class="modal" id="settingsModal">
    <div class="modalInner">
        <h2 style="color:var(--gold); margin-top:0;">Api Key Settings</h2>
        <input id="apiKey" type="password" placeholder="Enter Groq API Key...">
        <button class="btn btnGreen" style="width:100%" onclick="saveSettings()">Save & Close</button>
    </div>
</div>
<div class="modal" id="promptModal">
    <div class="modalInner">
        <h2 id="promptTitle" style="color:var(--gold); margin-top:0;">Prompt Settings</h2>
        <textarea id="promptArea" style="min-height:200px;"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btnGreen" style="flex:1" onclick="closePrompt(true)">Save Prompt</button>
            <button class="btn btnRed" style="flex:1" onclick="closePrompt(false)">Cancel</button>
        </div>
    </div>
</div>
<div class="topbar">
    <div style="font-weight:900; color:var(--gold); font-size:22px;">Email Swipe Machine</div>
    <div style="display:flex; gap:10px;">
        <button class="btn btnSmall" onclick="$('settingsModal').classList.add('show')">⚙️ Api Key Settings</button>
        <button class="btn btnSmall" onclick="toggleSource()" id="srcBtn">HTML Source</button>
        <button class="btn btnSmall" onclick="document.body.classList.toggle('theme-slate')">Toggle Slate</button>
        <button class="btn btnSmall" onclick="saveAllContent()" style="background:#b8860b;color:#fff;">💾 Save All Content</button>
    </div>
</div>
<div class="grid" id="mainGrid">
    <div class="card" style="padding: 10px;">
        <button class="toggle-btn" onclick="toggleSidebar()" id="tglBtn">HIDE</button>
        <div class="sidebar-content">
            <label style="font-weight:800; font-size:11px; color:var(--muted)">OFFER NAME</label>
            <input id="offerName" type="text" oninput="autoSave()">
            <label style="font-weight:800; font-size:11px; color:var(--muted)">BENEFITS</label>
            <textarea id="benefits" style="min-height:100px;" oninput="autoSave()"></textarea>
            <label style="font-weight:800; font-size:11px; color:var(--muted)">CTA TEXT</label>
            <input id="ctaText" value="Click here to see it" oninput="autoSave()">
            <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
                <button class="btn btnBlue btnSmall" onclick="openPrompt('title')">Title 📝</button>
                <button class="btn btnBlue btnSmall" onclick="openPrompt('body')">Body 📝</button>
                <button class="btn btnBlue btnSmall" onclick="openPrompt('image')">Image 📝</button>
            </div>
        </div>
    </div>
    <div class="card">
        <div style="display:flex; gap:6px; margin-bottom:10px;">
            <button class="btn btnSmall" onclick="insertAtCaret('subject','{!firstname_fix}')">{!firstname_fix}</button>
            <button class="btn btnSmall" onclick="insertAtCaret('subject','{!lastname_fix}')">{!lastname_fix}</button>
            <button class="btn btnSmall" onclick="insertAtCaret('subject','⭐')">⭐</button>
        </div>
       
        <div style="display:flex; gap:8px; margin-bottom:10px;">
            <input id="subject" type="text" placeholder="Subject Line" style="margin:0; flex:1;" oninput="update(); autoSave();">
            <button class="btn btnGreen" onclick="generateTitle()">Generate Title</button>
        </div>
        <div class="toolbar">
            <button class="btn btnSmall" onclick="exec('bold')"><b>B</b></button>
            <button class="btn btnSmall" onclick="exec('italic')"><i>I</i></button>
            <button class="btn btnSmall" onclick="exec('foreColor','#d32f2f')" style="color:#d32f2f">A</button>
            <button class="btn btnSmall" onclick="exec('foreColor','#111111')">A</button>
            <button class="btn btnSmall" onclick="exec('createLink', prompt('Link URL:'))">Link</button>
            <button class="btn btnSmall" onclick="insertImg()">Image + Link</button>
            <div style="flex:1"></div>
            <button class="btn btnSmall" onclick="exec('undo')">Undo</button>
        </div>
        <div id="bodyEditor" contenteditable="true" oninput="update(); autoSave();"></div>
        <textarea id="sourceEditor"></textarea>
        <div style="margin-top:12px; display:flex; gap:8px;">
            <button class="btn btnGreen" onclick="generateBody()" style="flex:2">Generate Body</button>
            <button class="btn btnBlue" onclick="$('sigModal').classList.add('show')">Manage</button>
            <button class="btn btnGreen" onclick="insertSig()">Insert</button>
            <select id="sigSelect" style="width:140px; margin:0;"><option value="">Select Sig</option></select>
            <button class="btn btnRed" onclick="clearBody()">Clear</button>
        </div>
    </div>
    <div class="card">
        <div class="preview-subject-box">
            <label style="font-weight:800; font-size:10px; color:var(--muted); display:block;">SUBJECT PREVIEW</label>
            <span id="prevSub" style="font-weight:700;"></span>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:15px;">
            <button class="btn btnBlue" style="flex:1" onclick="copyText($('subject').value)">Copy Full Title</button>
            <button class="btn btnBlue" style="flex:1" onclick="copyText(getWrappedBody())">Copy Body HTML</button>
        </div>
        <div class="preview-body-frame" id="prevBody"></div>
        <div style="margin-top:15px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:700; font-size:13px;">
                    <input type="checkbox" id="useWrapper" checked style="width:auto; margin:0;" onchange="update()"> 600px Wrapper
                </label>
                <button class="btn btnSmall" onclick="sendTest()">Send Test Email</button>
            </div>
            <button class="btn btnGreen" onclick="copyAll()" style="width:100%; height:60px; font-size:20px;">COPY FULL SWIPE</button>
        </div>
    </div>
</div>
<script>
    const $ = id => document.getElementById(id);
    let activePrompt = "";
   
    // THE FIX: Load prompts from storage or use defaults
    let prompts = JSON.parse(localStorage.getItem("esm_prompts")) || {
        title: "Return ONLY one string. Curiosity tone. Use ⭐ if natural.",
        body: "Write 2 short paragraphs. Start with ⭐{!firstname_fix}. Punchy marketing style.",
        image: "Describe a high-converting image for this offer."
    };

    function showToast(m) { 
        const t=$("toast"); 
        t.textContent=m; 
        t.style.display="block"; 
        setTimeout(()=>t.style.display="none",2500); 
    }
   
    function toggleSidebar() {
        $("mainGrid").classList.toggle("sidebar-closed");
        $("tglBtn").textContent = $("mainGrid").classList.contains("sidebar-closed") ? "SHOW" : "HIDE";
    }
    function saveSettings() {
        localStorage.setItem("esm_key", $("apiKey").value);
        $("settingsModal").classList.remove("show");
        showToast("Api Key Saved");
    }
    function openPrompt(type) {
        activePrompt = type;
        $("promptTitle").textContent = `${type.toUpperCase()} Prompt Settings`;
        $("promptArea").value = prompts[type];
        $("promptModal").classList.add("show");
    }
    function closePrompt(save) {
        if(save) {
            prompts[activePrompt] = $("promptArea").value;
            localStorage.setItem("esm_prompts", JSON.stringify(prompts));   // FIXED - now saves
            showToast("Prompt Saved");
        }
        $("promptModal").classList.remove("show");
    }
    function insertAtCaret(id, text) {
        const el = $(id);
        if (id === 'subject') {
            const start = el.selectionStart;
            const end = el.selectionEnd;
            el.value = el.value.substring(0, start) + text + el.value.substring(end);
            el.focus();
            el.selectionStart = el.selectionEnd = start + text.length;
        } else {
            $("bodyEditor").focus();
            document.execCommand('insertText', false, text);
        }
        update();
    }
    function exec(c, v=null) { $("bodyEditor").focus(); document.execCommand(c, false, v); update(); }
   
    function insertImg() {
        const url = prompt("Image URL:");
        if(!url) return;
        const link = prompt("Destination Link (optional):");
        const html = link ? `<a href="${link}" target="_blank"><img src="${url}" style="max-width:100%; height:auto;"></a>` : `<img src="${url}" style="max-width:100%; height:auto;">`;
        exec('insertHTML', html);
    }
   
    function toggleSource() {
        const isSrc = $("sourceEditor").style.display === "block";
        if(isSrc) {
            $("bodyEditor").innerHTML = $("sourceEditor").value;
            $("sourceEditor").style.display = "none";
            $("bodyEditor").style.display = "block";
            $("srcBtn").textContent = "HTML Source";
        } else {
            $("sourceEditor").value = $("bodyEditor").innerHTML;
            $("bodyEditor").style.display = "none";
            $("sourceEditor").style.display = "block";
            $("srcBtn").textContent = "Visual Editor";
        }
    }
    async function callAI(p) {
        const key = localStorage.getItem("esm_key");
        if(!key) { showToast("Enter API Key in Settings"); return null; }
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method:"POST", headers:{"Authorization":`Bearer ${key}`,"Content-Type":"application/json"},
                body: JSON.stringify({model:"llama-3.1-8b-instant", messages:[{role:"user",content:p}]})
            });
            const d = await res.json();
            return d.choices[0].message.content.trim();
        } catch(e) { return null; }
    }
    async function generateTitle() {
        const p = prompts.title + `\nOffer: ${$("offerName").value}\nBenefits: ${$("benefits").value}`;
        const res = await callAI(p);
        if(res) { $("subject").value = res.replace(/"/g,''); update(); autoSave(); }
    }
    async function generateBody() {
        const p = prompts.body + `\nOffer: ${$("offerName").value}\nBenefits: ${$("benefits").value}\nCTA: ${$("ctaText").value}`;
        const res = await callAI(p);
        if(res) { exec('insertHTML', res.replace(/\n/g,"<br>")); autoSave(); }
    }
    function update() {
        $("prevSub").textContent = $("subject").value;
        $("prevBody").innerHTML = $("bodyEditor").innerHTML;
    }
    function getWrappedBody() {
        const content = $("bodyEditor").innerHTML;
        if(!$("useWrapper").checked) return content;
        return `<table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width:600px; margin:0 auto;"><tr><td style="font-family:Arial, sans-serif; font-size:16px; line-height:1.6; color:#111111;">${content}</td></tr></table>`;
    }
    function autoSave() {
        const data = { 
            sub: $("subject").value, 
            body: $("bodyEditor").innerHTML, 
            offer: $("offerName").value, 
            benefits: $("benefits").value, 
            cta: $("ctaText").value 
        };
        localStorage.setItem("esm_draft", JSON.stringify(data));
    }

    // NEW: Save All Content button
    function saveAllContent() {
        autoSave();
        showToast("All content saved");
    }

    function sendTest() {
        const sub = encodeURIComponent($("subject").value);
        const body = encodeURIComponent($("bodyEditor").innerText);
        window.location.href = `mailto:?subject=${sub}&body=${body}`;
    }
    function clearBody() { 
        if(confirm("Clear everything?")) { 
            $("bodyEditor").innerHTML = ""; 
            $("subject").value = ""; 
            update(); 
            autoSave(); 
        } 
    }
    function copyText(t) { navigator.clipboard.writeText(t); showToast("Copied!"); }
    function copyAll() { copyText(`${$("subject").value}\n\n${getWrappedBody()}`); }

    window.onload = () => {
        $("apiKey").value = localStorage.getItem("esm_key") || "";
        
        // Load draft
        const d = JSON.parse(localStorage.getItem("esm_draft"));
        if(d) {
            $("subject").value = d.sub || ""; 
            $("bodyEditor").innerHTML = d.body || "";
            $("offerName").value = d.offer || ""; 
            $("benefits").value = d.benefits || ""; 
            $("ctaText").value = d.cta || "";
            update();
        }

        // Load custom prompts (title, body, image)
        const savedPrompts = JSON.parse(localStorage.getItem("esm_prompts"));
        if(savedPrompts) prompts = savedPrompts;
    };
</script>
</body>
</html>
