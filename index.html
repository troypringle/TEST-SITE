<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Email Swipe Machine</title>
    <style>
        :root {
            --bg: #d4c4a8; --panel: #f5f0e6; --panel2: #efe6d8; --border: #c9b896;
            --muted: #5c4d3a; --gold: #b8860b; --green: #2e7d32; --blue: #1976d2; --red: #d32f2f;
        }
        body.theme-slate {
            --bg: #111827; --panel: #1f2937; --panel2: #243244; --border: #374151;
            --muted: #cbd5e1; --gold: #fbbf24; --green: #22c55e; --red: #ef4444;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: #111; font-size: 16px; line-height: 1.6; }
        .wrap { max-width: 1700px; margin: 0 auto; padding: 18px; }
        .topbar { background: var(--panel); border: 2px solid var(--gold); border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .title { font-weight: 800; font-size: 22px; color: var(--gold); }
        .btn { border: 1px solid var(--border); background: var(--panel2); color: #111; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .btn:hover { filter: brightness(0.95); }
        .btnGreen { background: var(--green); color: #fff; border: none; }
        .btnBlue { background: var(--blue); color: #fff; border: none; }
        .btnRed { background: var(--red); color: #fff; border: none; }
        .btnSmall { padding: 6px 10px; font-size: 13px; }
        .grid { margin-top: 16px; display: grid; grid-template-columns: 420px 1fr 420px; gap: 16px; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
        .card h2 { margin: 0 0 10px 0; color: var(--gold); font-size: 18px; }
        label { display: block; font-weight: 800; color: var(--muted); font-size: 12px; text-transform: uppercase; margin: 12px 0 4px; }
        input, textarea, select { width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 8px; background: #fff; font-size: 15px; }
        textarea { min-height: 100px; resize: vertical; }
        .pillRow { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
        .pill { border: 2px solid var(--border); background: var(--panel2); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 800; font-size: 13px; }
        .subjectItem { background: #fff; border: 2px solid #aaa; padding: 12px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
        .previewSubject { background: #fff; border: 2px solid var(--border); border-bottom: 0; padding: 12px; border-radius: 10px 10px 0 0; }
        .previewFrame { background: #fff; border: 2px solid var(--border); border-radius: 0 0 10px 10px; padding: 20px; min-height: 400px; }
        .toolbar { display: flex; gap: 5px; background: var(--panel2); padding: 8px; border: 2px solid var(--border); border-bottom: 0; border-radius: 8px 8px 0 0; }
        #bodyEditor { border: 2px solid var(--border); border-radius: 0 0 8px 8px; min-height: 250px; padding: 15px; background: #fff; outline: none; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; z-index: 10000; padding: 20px; }
        .modal.show { display: block; }
        .modalInner { max-width: 700px; margin: 40px auto; background: var(--panel); border: 2px solid var(--border); border-radius: 12px; padding: 20px; }
        .toast { position: fixed; right: 20px; bottom: 20px; background: #333; color: #fff; padding: 12px 20px; border-radius: 10px; display: none; z-index: 9999; }
        .divider { height: 1px; background: var(--border); margin: 15px 0; }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="modal" id="sigModal">
    <div class="modalInner">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px">
            <h2 style="margin:0;color:var(--gold)">Signatures</h2>
            <button class="btn btnRed btnSmall" onclick="$('sigModal').classList.remove('show')">Close</button>
        </div>
        <div id="sigList"></div>
        <div class="divider"></div>
        <input id="sigNewName" type="text" placeholder="Sig Name">
        <textarea id="sigNewContent" placeholder="Signature Content..."></textarea>
        <button class="btn btnGreen" id="addSig" style="margin-top:10px;width:100%">Add Signature</button>
    </div>
</div>

<div class="wrap">
    <div class="topbar">
        <div class="title">Email Swipe Machine</div>
        <div>
            <button class="btn btnSmall" id="toggleTheme">Toggle Slate</button>
            <button class="btn btnSmall" onclick="$('rawModal').classList.add('show')">Raw Data</button>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>1. Offer Config</h2>
            <label>Groq API Key</label>
            <input id="apiKey" type="password" placeholder="Paste key">
            <button class="btn btnGreen btnSmall" id="saveKey" style="margin-top:5px">Save Key</button>
            
            <div class="divider"></div>
            <label>Offer Name</label>
            <input id="offerName" type="text" placeholder="e.g. AI Lead Gen">
            <label>Benefits (1 per line)</label>
            <textarea id="benefits"></textarea>
            <label>CTA Text</label>
            <input id="ctaText" value="Click here to see it now">
            
            <div class="divider"></div>
            <label>Image Prompt (Custom)</label>
            <textarea id="imagePrompt" placeholder="Describe the image you want for this offer..."></textarea>
            <button class="btn btnBlue btnSmall" style="width:100%;margin-top:5px" onclick="alert('Prompt Saved to Data')">Save Image Prompt</button>
        </div>

        <div class="card">
            <h2>2. Email Composer</h2>
            <div class="pillRow">
                <div class="pill" onclick="insertTag('{!firstname_fix}⭐ ')">{!firstname_fix}⭐</div>
                <div class="pill" onclick="insertTag('{!lastname_fix}⭐ ')">{!lastname_fix}⭐</div>
                <div class="pill" onclick="insertTag('⭐ ')">⭐</div>
            </div>
            
            <label>Subject Line</label>
            <input id="subject" type="text">
            
            <label>Custom Title Prompt</label>
            <textarea id="customTitlePrompt" style="min-height:60px">Return ONLY one string. Must be 36-80 characters long. Natural curiosity tone.</textarea>
            <button class="btn btnGreen" id="genSubjects" style="margin:10px 0;width:100%">Generate Title</button>
            <div id="subjectResults"></div>

            <div class="divider"></div>
            
            <label>Body Editor (Formatting Toolbar)</label>
            <div class="toolbar">
                <button class="btn btnSmall" onclick="execCmd('bold')"><b>B</b></button>
                <button class="btn btnSmall" onclick="execCmd('italic')"><i>I</i></button>
                <button class="btn btnSmall" onclick="execLink()">Link</button>
                <button class="btn btnSmall" onclick="execImg()">Img</button>
            </div>
            <div id="bodyEditor" contenteditable="true"></div>
            
            <label>Custom Body Prompt</label>
            <textarea id="customBodyPrompt" style="min-height:60px">Write exactly one short email body. 2 paragraphs max. Start with ⭐{!name_fix}.</textarea>
            
            <div style="margin-top:10px; display:flex; gap:8px">
                <button class="btn btnGreen" id="genBody">Generate Body</button>
                <button class="btn btnBlue" id="undoBody">Undo</button>
                <button class="btn btnRed btnSmall" id="clearBody">Clear</button>
            </div>

            <div class="divider"></div>
            <div style="display:flex; gap:10px">
                <button class="btn btnBlue btnSmall" onclick="$('sigModal').classList.add('show')">Manage Signatures</button>
                <select id="sigSelect"><option value="">Select Sig</option></select>
                <button class="btn btnGreen btnSmall" id="insertSig">Insert</button>
            </div>
        </div>

        <div class="card">
            <h2>3. Preview & Copy</h2>
            <div class="previewSubject"><strong>Subject:</strong> <span id="prevSub">...</span></div>
            <div class="previewFrame" id="prevBody">Preview...</div>
            
            <button class="btn btnGreen" id="copyFull" style="width:100%; margin:15px 0">Copy Full HTML Email</button>
            <button class="btn btnBlue btnSmall" id="copySubject" style="width:100%; margin-bottom:5px">Copy Subject</button>
            <button class="btn btnBlue btnSmall" id="copyBodyHtml" style="width:100%">Copy Body HTML</button>
        </div>
    </div>
</div>

<div class="modal" id="rawModal">
    <div class="modalInner">
        <h2 style="color:var(--gold)">Raw AI Output</h2>
        <textarea id="rawText" style="min-height:350px"></textarea>
        <button class="btn btnRed" onclick="$('rawModal').classList.remove('show')">Close</button>
    </div>
</div>

<script>
    const $ = id => document.getElementById(id);
    let lastBody = "";

    function showToast(msg) {
        const t = $("toast"); t.textContent = msg; t.style.display = "block";
        setTimeout(() => t.style.display = "none", 2500);
    }

    // WYSIWYG Editor Commands
    function execCmd(cmd) { document.execCommand(cmd, false, null); updatePreview(); }
    function execLink() { const url = prompt("Enter URL:"); if(url) document.execCommand("createLink", false, url); updatePreview(); }
    function execImg() { const url = prompt("Enter Image URL:"); if(url) document.execCommand("insertImage", false, url); updatePreview(); }
    function insertTag(tag) { $("subject").value = tag + $("subject").value; updatePreview(); }

    async function callGroq(prompt) {
        const key = $("apiKey").value.trim() || localStorage.getItem("esm_apiKey");
        if(!key) return showToast("API Key Required");
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {"Content-Type":"application/json", "Authorization":`Bearer ${key}`},
                body: JSON.stringify({model:"llama-3.1-8b-instant", messages:[{role:"user",content:prompt}]})
            });
            const data = await res.json();
            return data.choices[0].message.content.trim();
        } catch(e) { return null; }
    }

    $("genSubjects").onclick = async () => {
        const p = $("customTitlePrompt").value + `\nOffer: ${$("offerName").value}\nBenefits: ${$("benefits").value}`;
        const res = await callGroq(p);
        if(res) {
            $("rawText").value = res;
            $("subjectResults").innerHTML = `<div class="subjectItem" onclick="$('subject').value='${res.replace(/'/g,"\\'")}';updatePreview();">${res}</div>`;
        }
    };

    $("genBody").onclick = async () => {
        lastBody = $("bodyEditor").innerHTML;
        const p = $("customBodyPrompt").value + `\nOffer: ${$("offerName").value}\nBenefits: ${$("benefits").value}\nCTA: ${$("ctaText").value}`;
        const res = await callGroq(p);
        if(res) {
            $("bodyEditor").innerHTML = res.replace(/\n/g, "<br>");
            updatePreview();
        }
    };

    function updatePreview() {
        $("prevSub").textContent = $("subject").value || "...";
        $("prevBody").innerHTML = $("bodyEditor").innerHTML || "Preview...";
    }

    // Signatures
    let sigs = JSON.parse(localStorage.getItem("esm_sigs") || "[]");
    function renderSigs() {
        $("sigList").innerHTML = sigs.map((s,i) => `<div style="display:flex;justify-content:space-between;background:#fff;padding:5px;margin-bottom:5px"><span>${s.name}</span> <button onclick="delSig(${i})">X</button></div>`).join('');
        $("sigSelect").innerHTML = '<option value="">Select Sig</option>' + sigs.map((s,i) => `<option value="${i}">${s.name}</option>`).join('');
    }
    $("addSig").onclick = () => {
        sigs.push({name:$("sigNewName").value, content:$("sigNewContent").value});
        localStorage.setItem("esm_sigs", JSON.stringify(sigs));
        renderSigs();
    };
    window.delSig = i => { sigs.splice(i,1); localStorage.setItem("esm_sigs", JSON.stringify(sigs)); renderSigs(); };
    $("insertSig").onclick = () => {
        const s = sigs[$("sigSelect").value];
        if(s) $("bodyEditor").innerHTML += `<br><br>${s.content.replace(/\n/g,"<br>")}`;
        updatePreview();
    };

    $("saveKey").onclick = () => { localStorage.setItem("esm_apiKey", $("apiKey").value); showToast("Key Saved"); };
    $("toggleTheme").onclick = () => document.body.classList.toggle("theme-slate");
    $("clearBody").onclick = () => { lastBody=$("bodyEditor").innerHTML; $("bodyEditor").innerHTML=""; updatePreview(); };
    $("undoBody").onclick = () => { if(lastBody) $("bodyEditor").innerHTML=lastBody; updatePreview(); };
    
    $("copyFull").onclick = () => {
        const full = `Subject: ${$("subject").value}\n\n${$("bodyEditor").innerHTML}`;
        navigator.clipboard.writeText(full); showToast("Full HTML Copied");
    };

    $("subject").oninput = updatePreview;
    $("bodyEditor").oninput = updatePreview;
    $("apiKey").value = localStorage.getItem("esm_apiKey") || "";
    renderSigs();
</script>
</body>
</html>
