
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Commission Funnel</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
      font-family: 'Arial', sans-serif; 
      background: linear-gradient(135deg, #1f0000, #000000); 
      color: #fff; 
      text-align: center; 
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 720px; margin: 80px auto; }
    h1 { 
      font-size: 3.4em; 
      color: #fff; 
      text-shadow: 0 0 20px #e74c3c; 
      margin-bottom: 15px;
      line-height: 1.1;
    }
    .subtitle { 
      font-size: 1.5em; 
      color: #ffdddd; 
      margin-bottom: 50px;
    }
    .btn {
      background: #e74c3c;
      color: white;
      padding: 20px 60px;
      font-size: 1.5em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(231,76,60,0.4);
      transition: all 0.3s;
    }
    .btn:hover { transform: scale(1.08); background: #c0392b; }

    /* Popup */
    .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; }
    .popup { 
      display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);
      background:#fff; color:#111; width:90%; max-width:460px; border-radius:12px; 
      box-shadow:0 0 50px rgba(231,76,60,0.9); z-index:1000; overflow:hidden;
    }
    .popup.show, .overlay.show { display:block; }
    .popup-header { background:#e74c3c; color:white; padding:25px; font-size:1.6em; }
    .popup-body { padding:35px 30px; }
    input[type="text"], input[type="email"] { 
      width:100%; padding:15px; margin:12px 0; border:2px solid #ccc; border-radius:6px; font-size:17px;
    }
    input[type="submit"] { 
      background:#e74c3c; color:white; padding:16px; font-size:1.4em; border:none; 
      border-radius:6px; cursor:pointer; width:100%; margin-top:20px; font-weight:bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Easy Commission Funnel</h1>
  <p class="subtitle">Get Paid To Build Your List & Create Passive Income</p>
  <button class="btn" onclick="showPopup()">GET INSTANT ACCESS NOW</button>
</div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
  <div class="popup-header">Claim Your Free Access Now</div>
  <div class="popup-body">
    <form id="leadForm" method="POST" action="https://gogvo.com/subscribe.php">
      <input type="hidden" name="AffiliateName" value="troypringle1NLS">
      <input type="hidden" name="CampaignCode" value="m4FqY1oJQZPO">
      <input type="hidden" name="FormId" value="25212813">
      <input type="hidden" name="PassFormData" value="1">
      <input type="hidden" name="TrackParam" value="new_form">

      <input type="text" name="FirstName" placeholder="First Name" required>
      <input type="email" name="Email" placeholder="Please enter your email" required>
      <input type="submit" value="SUBMIT & GET ACCESS">
    </form>
  </div>
</div>

<script>
// Popup Logic
let popupShown = false;

function showPopup() {
  if (popupShown) return;
  popupShown = true;
  document.getElementById('popup').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

function closePopup() {
  document.getElementById('popup').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// Trigger after 2 seconds
setTimeout(() => { if (!popupShown) showPopup(); }, 2000);

// Trigger when scrolling up near top
let lastScroll = 0;
window.addEventListener('scroll', () => {
  const current = window.scrollY;
  if (current < lastScroll && current < 180) {
    if (!popupShown) showPopup();
  }
  lastScroll = current;
});

// BeMob Postback
document.getElementById('leadForm').addEventListener('submit', function() {
  const email = this.querySelector('input[name="Email"]').value;
  if (email) {
    fetch(`https://o2s4n.bemobtrk.com/postback?cid=${encodeURIComponent(email)}&status=new`, { 
      mode: 'no-cors' 
    });
  }
});
</script>

</body>
</html>
