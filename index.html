<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Email Swipe Machine</title>
  <style>
    :root{
      --bg:#d4c4a8; --panel:#f5f0e6; --panel2:#efe6d8; --border:#c9b896;
      --muted:#5c4d3a; --gold:#b8860b; --green:#2e7d32; --blue:#1976d2; --red:#d32f2f;
    }
    body.theme-slate{
      --bg:#111827; --panel:#1f2937; --panel2:#243244; --border:#374151;
      --muted:#cbd5e1; --gold:#fbbf24; --green:#22c55e; --red:#ef4444;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Arial,system-ui,sans-serif; background:var(--bg); color:#111; font-size:16px;}
    .wrap{max-width:1700px;margin:0 auto;padding:18px;}
    .topbar{background:var(--panel); border:2px solid var(--gold); border-radius:10px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;}
    .title{font-weight:800; font-size:22px; color:var(--gold);}
    .btn{border:1px solid var(--border); background:var(--panel2); color:#111; padding:10px 12px; border-radius:8px; cursor:pointer; font-weight:700;}
    .btn:hover{filter:brightness(0.98)}
    .btnGreen{background:var(--green); color:#fff; border:none}
    .btnBlue{background:var(--blue); color:#fff; border:none}
    .btnRed{background:var(--red); color:#fff; border:none}
    .grid{margin-top:16px; display:grid; grid-template-columns:420px 1fr 1fr; gap:16px;}
    .card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px;}
    .card h2{margin:0 0 10px 0; color:var(--gold);}
    label{display:block; font-weight:800; color:var(--muted); font-size:13px; text-transform:uppercase; margin:12px 0 6px;}
    input,textarea{width:100%; padding:12px; border:2px solid var(--border); border-radius:8px; background:#fff;}
    textarea{min-height:160px; resize:vertical;}
    .bigBox{min-height:210px !important;}
    .pillRow{display:flex; gap:10px; flex-wrap:wrap; margin:8px 0;}
    .pill{border:2px solid var(--border); background:var(--panel2); padding:8px 12px; border-radius:999px; cursor:pointer; font-weight:800;}
    .subjectItem{background:#fff; border:2px solid #aaa; padding:12px; border-radius:10px; margin-bottom:10px; cursor:pointer;}
    .subjectItem.selected{border-color:var(--green);}
    .previewSubject{background:#fff; border:2px solid var(--border); border-bottom:0; padding:12px; border-radius:10px 10px 0 0;}
    .previewFrame{background:#fff; border:2px solid var(--border); border-radius:0 0 10px 10px; padding:14px; min-height:420px;}
    .toast{position:fixed; right:20px; bottom:20px; background:rgba(0,0,0,.9); color:#fff; padding:12px 16px; border-radius:10px; display:none; z-index:9999;}
    .toast.show{display:block}
    .divider{height:1px; background:var(--border); margin:14px 0}
    .modal{position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; z-index:10000; padding:20px; overflow:auto;}
    .modal.show{display:block}
    .modalInner{max-width:900px; margin:40px auto; background:var(--panel); border:2px solid var(--border); border-radius:12px; padding:20px;}
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <!-- Raw Modal -->
  <div class="modal" id="rawModal">
    <div class="modalInner">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0;color:var(--gold)">Raw AI Output</h2>
        <button class="btn btnRed" id="closeRaw">Close</button>
      </div>
      <textarea id="rawText" style="width:100%; min-height:380px; font-family:monospace;"></textarea>
      <button class="btn btnBlue" id="copyRaw" style="margin-top:8px">Copy Raw</button>
    </div>
  </div>

  <!-- Signature Modal -->
  <div class="modal" id="sigModal">
    <div class="modalInner">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0;color:var(--gold)">Signatures</h2>
        <button class="btn btnRed" id="closeSig">Close</button>
      </div>
      <div id="sigList"></div>
      <div class="divider"></div>
      <h2 style="margin:0 0 8px;color:var(--gold)">Add New Signature</h2>
      <input id="sigNewName" type="text" placeholder="Signature Name">
      <textarea id="sigNewContent" placeholder="Signature content..."></textarea>
      <button class="btn btnGreen" id="addSig" style="margin-top:10px">Add Signature</button>
    </div>
  </div>

  <div class="wrap">
    <div class="topbar">
      <div class="title">Email Swipe Machine</div>
      <div>
        <button class="btn btnSmall" id="toggleTheme">Toggle Slate</button>
        <button class="btn btnSmall" id="openRaw">Raw Output</button>
      </div>
    </div>

    <div class="grid">
      <!-- LEFT -->
      <div class="card">
        <h2>API + Offer Setup</h2>
        <label>Groq API Key</label>
        <input id="apiKey" type="password" placeholder="Paste Groq key">
        <button class="btn btnGreen" id="saveKey">Save Key</button>

        <div class="divider"></div>
        <label>Model</label>
        <select id="model">
          <option value="llama-3.1-70b-versatile">llama-3.1-70b-versatile (Best)</option>
          <option value="llama-3.1-8b-instant">llama-3.1-8b-instant (Fast)</option>
        </select>

        <div class="divider"></div>
        <label>Offer Name</label>
        <input id="offerName" type="text" placeholder="e.g. My Affiliate Offer">
        <label>Offer Link (optional)</label>
        <input id="offerLink" type="text">
        <label>Benefits (one per line)</label>
        <textarea id="benefits"></textarea>
        <label>CTA Text</label>
        <input id="ctaText" value="Click here to see it now">
      </div>

      <!-- MIDDLE -->
      <div class="card">
        <h2>Subject + Body</h2>
        
        <h2 style="font-size:15px;color:var(--gold);margin:10px 0 6px">Subject Prefix</h2>
        <div class="pillRow">
          <div class="pill" data-prefix="{!firstname_fix}⭐ ">{!firstname_fix}⭐</div>
          <div class="pill" data-prefix="{!lastname_fix}⭐ ">{!lastname_fix}⭐</div>
          <div class="pill" data-prefix="⭐ ">⭐</div>
        </div>

        <label>Subject Line</label>
        <input id="subject" type="text">
        <button class="btn btnGreen" id="genSubjects" style="margin:8px 0">Generate 3 Subjects</button>
        <div id="subjectResults"></div>

        <div class="divider"></div>
        <label>Email Body (1–2 short paragraphs)</label>
        <textarea id="body" class="bigBox"></textarea>

        <div class="pillRow">
          <div class="pill" data-bodytag="{!firstname_fix}⭐ ">{!firstname_fix}⭐</div>
          <div class="pill" data-bodytag="{!lastname_fix}⭐ ">{!lastname_fix}⭐</div>
        </div>

        <div style="margin-top:10px">
          <button class="btn btnGreen" id="genBody">Generate Body</button>
          <button class="btn btnBlue" id="undoBody">Undo</button>
          <button class="btn btnRed" id="clearBody">Clear</button>
        </div>

        <!-- Image Section -->
        <div class="divider"></div>
        <h2>Image Generator</h2>
        <button class="btn btnGreen" id="genImage" style="width:100%">Generate Matching Image Idea</button>
        <textarea id="imageResult" style="min-height:130px; margin-top:8px;" readonly placeholder="Generated image description will appear here..."></textarea>
        <button class="btn btnBlue" id="copyImageDesc" style="margin-top:6px">Copy Image Description</button>

        <div class="divider"></div>
        <h2>Signatures</h2>
        <button class="btn btnBlue" id="manageSigs">Manage Signatures</button>
        <button class="btn btnGreen" id="insertSig">Insert Selected</button>
        <p id="sigStatus" class="smallNote"></p>
      </div>

      <!-- RIGHT -->
      <div class="card">
        <h2>Preview + Copy</h2>
        <div class="previewSubject"><strong>Subject:</strong> <span id="prevSub">...</span></div>
        <div class="previewFrame" id="prevBody">Preview appears here...</div>
        <button class="btn btnGreen" id="copyFull" style="width:100%;margin:12px 0">Copy Full Email (Clean)</button>
        <button class="btn btnBlue" id="copySubject">Copy Subject</button>
        <button class="btn btnBlue" id="copyBodyHtml">Copy Body HTML</button>
      </div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
function showToast(msg, err=false){
  const t = $("toast");
  t.textContent = msg;
  t.style.border = err ? "2px solid var(--red)" : "2px solid var(--green)";
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2800);
}

let sigs = JSON.parse(localStorage.getItem("esm_sigs") || '[{"id":1,"name":"Default","content":"-- \nBest Regards\nYour Name"}]');
let currentSigId = Number(localStorage.getItem("esm_sigSel")) || 1;

function renderSigStatus(){
  const sig = sigs.find(s=>s.id===currentSigId);
  $("sigStatus").textContent = sig ? `Selected: ${sig.name}` : "No signature selected";
}

// Groq call
async function callGroq(prompt){
  const key = $("apiKey").value.trim() || localStorage.getItem("esm_apiKey") || "";
  if(!key) return showToast("Enter Groq API Key first", true);
  try{
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},
      body:JSON.stringify({model:$("model").value, messages:[{role:"user",content:prompt}], temperature:0.7, max_tokens:1000})
    });
    const data = await res.json();
    return data.choices[0].message.content.trim();
  }catch(e){
    $("rawText").value = e.message;
    showToast("API Error - check Raw Output", true);
    return null;
  }
}

// Generate 1 Prompt Idea at a time
$("genPromptIdea").onclick = async () => {
  const text = await callGroq("Generate ONE good, ready-to-use promotional email prompt idea for MLM or affiliate marketing. Make it specific and useful.");
  if(text){
    $("rawText").value = text;
    $("rawModal").classList.add("show");
    showToast("New prompt idea generated - check Raw Output");
  }
};

// Generate Image Description (matching the offer)
$("genImage").onclick = async () => {
  const offer = $("offerName").value.trim() || "MLM affiliate offer";
  const prompt = `Describe ONE highly detailed, professional marketing image that would look great in an email for this offer: ${offer}. 
Make it vivid so I can copy-paste directly into an image generator like Grok Imagine or Midjourney.`;
  const result = await callGroq(prompt);
  if(result){
    $("imageResult").value = result;
    showToast("Image description generated");
  }
};

// Other functions (same as before but cleaned)
async function generateBodyHard(){
  const text = await callGroq(`Write a short email body (1-2 paragraphs). Start with ⭐{!name_fix}. Offer: ${$("offerName").value || "this offer"}. Benefits: ${$("benefits").value}. Do not add links or names.`);
  if(text) $("body").value = text;
  updatePreview();
}

function updatePreview(){
  $("prevSub").textContent = $("subject").value || "...";
  const html = $("body").value.split(/\n\s*\n/).map(p => `<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
  $("prevBody").innerHTML = html || "Preview appears here...";
}

// Event Listeners
$("genSubjects").onclick = async () => {
  const text = await callGroq(`Return only JSON array of 3 strings. Good email subjects for: ${$("offerName").value || "this offer"}`);
  if(text){
    $("rawText").value = text;
    try{
      const arr = JSON.parse(text);
      $("subjectResults").innerHTML = arr.map(s => `<div class="subjectItem" onclick="this.parentNode.querySelectorAll('.subjectItem').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');$('subject').value='${s}';updatePreview()">${s}</div>`).join('');
    }catch{}
  }
};

$("genBody").onclick = generateBodyHard;
$("copyFull").onclick = () => {
  const full = $("subject").value.trim() + "\n\n" + $("body").value.trim();
  navigator.clipboard.writeText(full);
  showToast("Full email copied clean");
};
$("copyImageDesc").onclick = () => {
  navigator.clipboard.writeText($("imageResult").value);
  showToast("Image description copied");
};

// Signature
$("manageSigs").onclick = () => { /* placeholder - you can expand later */ showToast("Signature modal opened (basic)"); renderSigStatus(); };
$("insertSig").onclick = () => {
  const sig = sigs.find(s => s.id === currentSigId);
  if(sig) {
    $("body").value += "\n\n" + sig.content;
    updatePreview();
    showToast("Signature inserted");
  }
};
$("addSig").onclick = () => {
  const name = $("sigNewName").value.trim();
  if(name){
    sigs.push({id:Date.now(), name, content:$("sigNewContent").value});
    currentSigId = sigs[sigs.length-1].id;
    localStorage.setItem("esm_sigs", JSON.stringify(sigs));
    localStorage.setItem("esm_sigSel", currentSigId);
    showToast("Signature saved");
  }
};

$("saveKey").onclick = () => { localStorage.setItem("esm_apiKey", $("apiKey").value.trim()); showToast("Key saved"); };
$("toggleTheme").onclick = () => document.body.classList.toggle("theme-slate");
$("openRaw").onclick = () => $("rawModal").classList.add("show");
$("closeRaw").onclick = () => $("rawModal").classList.remove("show");
$("copyRaw").onclick = () => navigator.clipboard.writeText($("rawText").value).then(()=>showToast("Raw copied"));

document.querySelectorAll(".pill").forEach(p=>{
  p.onclick = () => {
    if(p.dataset.prefix) $("subject").value = p.dataset.prefix + $("subject").value;
    else if(p.dataset.bodytag) $("body").value += "\n" + p.dataset.bodytag;
    updatePreview();
  };
});

updatePreview();
renderSigStatus();
</script>
</body>
</html>
