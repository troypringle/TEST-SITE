<!DOCTYPE html>
<html lang="en">
<head>
    <title>Official PRELAUNCH - Matrix Edition</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <style>
        /* FORCE BLACK BACKGROUND - NO MORE WHITE */
        html, body {
            background-color: #000000 !important;
            margin: 0;
            padding: 10px;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page-border {
            width: 100%;
            max-width: 820px;
            border: 2px solid #1a1a1a; 
            border-radius: 13px;
            padding: 15px;
            background: #020202; 
            text-align: center;
            position: relative;
            z-index: 5;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        /* ==================================================== */
        /* THE STYLED PROFESSOR (NO MORE BLOBS)                */
        /* ==================================================== */
        
        @keyframes professorBehavior {
            /* Path: Constrained to top 45% of screen */
            0%   { transform: translate(10vw, 5vh) rotate(0deg); opacity: 0.7; }
            25%  { transform: translate(70vw, 15vh) rotate(10deg); opacity: 0.9; }
            /* Pulse: Become 30% transparent while crossing the middle */
            50%  { transform: translate(40vw, 35vh) rotate(-5deg); opacity: 0.3; } 
            75%  { transform: translate(-5vw, 20vh) rotate(-15deg); opacity: 0.8; }
            100% { transform: translate(10vw, 5vh) rotate(0deg); opacity: 0.7; }
        }

        .float-container {
            position: fixed;
            top: 0; left: 0;
            z-index: 9999;
            pointer-events: none; /* Can click "through" him to hit buttons */
            animation: professorBehavior 25s ease-in-out infinite;
            will-change: transform;
        }

        .professor-img {
            width: 160px; /* Bigger presence */
            height: auto;
            /* MINT GREEN GLOW */
            filter: drop-shadow(0 0 12px rgba(0, 255, 136, 0.8)) 
                    drop-shadow(0 0 25px rgba(0, 255, 136, 0.4));
            transition: opacity 0.5s ease;
        }

        /* ==================================================== */
        /* REST OF PAGE ELEMENTS                               */
        /* ==================================================== */
        .streak-container {
            width: 100%;
            max-width: 900px; 
            height: 90px;      
            background: url('https://linkpod.s3.us-east-1.amazonaws.com/uploads/block_images/f3511efd5936e0986b6fb7034cecc2c7.png') center / cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .streak-text {
            font-size: 28px; 
            color: #ff0000;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
        }
        .banner-img-container img {
            width: 100%;
            max-width: 778px;
            border-radius: 6px;
            border: 1px solid rgba(144, 238, 144, 0.2);
            box-shadow: 0 0 15px rgba(144, 238, 144, 0.3);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border: 2px solid #004d26; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); 
            border-radius: 8px;
            margin: 20px 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .cta-btn {
            display: block;
            background: rgba(0, 30, 15, 0.8);
            border: 1px solid #00ff88;
            color: #fff;
            padding: 15px;
            text-decoration: none;
            font-weight: 900;
            font-size: 20px;
            border-radius: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="float-container">
    <img src="https://i.ibb.co/pPTmDq7/mad-scientist-transparent.png" class="professor-img" id="professor">
</div>

<div class="page-border">
    <div class="streak-container">
        <p class="streak-text">Time Sensitive New Updates</p>
    </div>

    <a href="https://troypringle2.aimatrixspillover.com/" class="banner-img-container">
        <img src="https://linkpod.s3.us-east-1.amazonaws.com/uploads/block_images/2635024737b92bb05b71e8c4a98a9751.png" alt="Secure Spot">
    </a>

    <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/S-T07JIxQEk?rel=0&modestbranding=1" frameborder="0" allowfullscreen></iframe>
    </div>

    <a href="https://troypringle2.aimatrixspillover.com/" class="cta-btn">CLICK TO SECURE YOUR SPOT ✔️</a>

    <p style="color:#666; margin-top:20px;">"DO OR DO NOT THERE IS NO TRY" - YODA</p>
</div>

<script>
    // Logic to cycle images tomorrow
    const prof = document.getElementById('professor');
    const images = [
        "https://i.ibb.co/pPTmDq7/mad-scientist-transparent.png", // Main Professor
        "https://i.ibb.co/D8pG5Yp/scientist-pose2.png" // Backup example
    ];
    let i = 0;
    setInterval(() => {
        i = (i + 1) % images.length;
        prof.src = images[i];
    }, 10000); // Swaps every 10 seconds
</script>

</body>
</html>
