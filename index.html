<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapid Ghost Float Test</title>
<style>
  body {
    background-color: #101018; /* Dark background to see the glow */
    color: white;
    font-family: sans-serif;
    height: 3000px; /* Long page to test scrolling and fixed positioning */
    overflow-x: hidden; /* Prevents scrollbars if the ghost overshoots */
    margin: 0;
    padding: 20px;
  }

  /* --- 1. THE KEYFRAMES (The Complex Movement) --- */
  /* This animation uses viewport width (vw) and viewport height (vh) */
  /* It forces the ghost to traverse the whole screen wildly at varying speeds. */
  @keyframes extremeGhostDrift {
    0% { transform: translate(5vw, 5vh) scale(1) rotate(0deg); } /* Start top-left */
    
    10% { transform: translate(90vw, 15vh) scale(0.8) rotate(15deg); } /* Fast dash Right */
    12% { transform: translate(92vw, 17vh) scale(0.8) rotate(15deg); } /* Tiny delay Right */

    25% { transform: translate(50vw, 90vh) scale(1.2) rotate(-10deg); } /* Deep dive Bottom Center (slow) */
    
    40% { transform: translate(-10vw, 50vh) scale(0.7) rotate(-30deg); } /* Flash dash Left (offscreen) */
    
    55% { transform: translate(105vw, 105vh) scale(1.3) rotate(45deg); } /* Extreme Fast dash to far bottom Right corner */
    
    70% { transform: translate(20vw, 30vh) scale(0.9) rotate(5deg); } /* Zipping back up Left */
    
    85% { transform: translate(80vw, 5vh) scale(1) rotate(0deg); } /* Top Right */
    
    100% { transform: translate(5vw, 5vh) scale(1) rotate(0deg); } /* Back Home */
  }

  /* --- 2. THE GHOST CONTAINER (The Physics & Glow) --- */
  .ghost-container {
    position: fixed; /* Locked to the screen, doesn't scroll with content */
    top: 0;
    left: 0;
    width: 150px; /* Approximate size of the odd-shaped image */
    height: 150px;
    z-index: 10000; /* Stays on top of everything */
    
    /* THE GHOST PRINCIPLES */
    opacity: 0.45;          /* Ghostly semi-transparent */
    pointer-events: none;    /* Mouse passes completely through it */
    mix-blend-mode: screen; /* Helps the glow "pop" against dark backgrounds */

    /* The Pink Glow (Behind the image) */
    filter: drop-shadow(0 0 15px rgba(255, 0, 150, 0.9)) /* Strong pink core */
            drop-shadow(0 0 30px rgba(255, 0, 150, 0.6)); /* Softer outer glow */

    /* THE ANIMATION (Fast and Complex) */
    /* linear keeps speed constant. ease-in-out makes it "swoop". Try both. */
    animation: extremeGhostDrift 16s linear infinite; 
  }

  /* --- 3. THE GHOST IMAGE (The Appearance) --- */
  /* This styles the SVG embedded in the HTML */
  .ghost-svg {
    width: 100%;
    height: 100%;
    fill: #ffffff; /* The color of the ghost body */
  }

</style>
</head>
<body>

  <h1>Extreme Ghost Animation Test Page</h1>
  <p>The pink glow should be visible against this dark page. Try to scroll; the ghost stays with you.</p>
  
  <p>To use your own image later, replace the entire &lt;svg&gt; block below with your &lt;img src="ghost.png"&gt;.</p>

  <div class="ghost-container">
    <svg class="ghost-svg" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50,5 C30,5,15,20,15,40 C15,50,20,60,20,65 C15,70,10,75,10,80 C10,90,20,95,30,95 C35,95,40,90,40,85 C45,90,50,95,55,95 C65,95,75,90,75,80 C75,75,70,70,65,65 C70,60,75,50,75,40 C75,20,60,5,50,5 Z 
               M35,35 C32,35,30,32,30,30 C30,28,32,25,35,25 C38,25,40,28,40,30 C40,32,38,35,35,35 Z 
               M65,35 C62,35,60,32,60,30 C60,28,62,25,65,25 C68,25,70,28,70,30 C70,32,68,35,65,35 Z 
               M50,55 C40,55,35,50,35,45 C45,45,55,45,65,45 C65,50,60,55,50,55 Z" />
    </svg>
  </div>

</body>
</html>
