<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Command Center Elite</title>
    <style>
        :root { --cols: 4; --accent-color: #007bff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 95%; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Top Controls */
        .controls-bar { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ddd; }
        .slider-wrap { display: flex; align-items: center; gap: 15px; font-weight: bold; }

        #progress-container { background:#e9ecef; border-radius:10px; margin-bottom:25px; overflow:hidden; border: 1px solid #ccc; }
        #progress-bar { background: linear-gradient(90deg, #28a745, #218838); width:0%; height:35px; text-align:center; color:white; font-weight:bold; line-height:35px; transition:width 0.4s; }

        /* Sections */
        .section-wrapper { margin-bottom: 30px; border-radius: 10px; border: 1px solid #ddd; background: #fff; overflow: hidden; }
        .section-header { 
            display: flex; justify-content: space-between; align-items: center;
            color: white; padding: 12px 20px; cursor: move; font-weight: bold; text-transform: uppercase;
        }
        .header-btns { display: flex; align-items: center; gap: 10px; }
        .color-picker { width: 25px; height: 25px; border: 2px solid white; border-radius: 50%; cursor: pointer; padding: 0; overflow: hidden; }

        /* Grid System */
        .task-grid { 
            display: grid; 
            grid-template-columns: repeat(var(--cols), 1fr); 
            gap: 15px; padding: 15px; min-height: 100px;
            background: #fdfdfd;
        }

        /* Task Cards (Old School Style) */
        .task-item { 
            background: #fff; padding: 15px; border-radius: 8px; border: 2px solid #eee; 
            display: flex; flex-direction: column; gap: 10px; position: relative;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .task-item.dragging { opacity: 0.5; border: 2px dashed #007bff; }
        
        .task-header { display: flex; align-items: flex-start; gap: 10px; }
        .task-name { font-weight: bold; font-size: 14px; flex-grow: 1; outline: none; }
        .task-check { width: 22px; height: 22px; cursor: pointer; flex-shrink: 0; }

        .link-btn { 
            display: block; padding: 10px; color: white; text-decoration: none; 
            border-radius: 6px; font-size: 13px; font-weight: bold; text-align: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: 0.1s;
        }
        .link-btn:active { transform: translateY(2px); box-shadow: none; }

        .task-note { 
            font-size: 11px; color: #555; background: #fffde7; padding: 8px; 
            border-radius: 4px; border: 1px solid #ffe57f; min-height: 40px; outline: none;
        }

        /* Utils */
        .move-menu { font-size: 10px; padding: 4px; width: 100%; border-radius: 4px; border: 1px solid #ddd; background: #fff; }
        .del-task { position: absolute; top: 5px; right: 5px; background: none; border: none; color: #ccc; cursor: pointer; font-weight: bold; }
        .del-task:hover { color: red; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls-bar">
        <div class="slider-wrap">
            <span>Layout Width:</span>
            <input type="range" min="2" max="6" value="4" id="colSlider" oninput="updateCols(this.value)">
            <span id="colVal">4 Columns</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="exportBackup()" style="background:#444; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">💾 Backup</button>
            <button onclick="document.getElementById('importFile').click()" style="background:#444; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">📂 Restore</button>
            <input type="file" id="importFile" style="display:none;" onchange="importBackup(event)">
        </div>
    </div>
    
    <div id="progress-container"><div id="progress-bar">Goal: 0%</div></div>
    
    <div id="sections-container"></div>

    <div style="text-align: center; margin-top: 40px;">
        <button onclick="createNewSection()" style="background:#007bff; color:white; border:none; padding:15px 40px; border-radius:10px; cursor:pointer; font-weight:bold; font-size:16px;">+ ADD NEW CATEGORY</button>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('tasks_v4')) || [];
    let categories = JSON.parse(localStorage.getItem('cats_v4')) || [
        { id: 'c1', name: 'Daily Traffic Routine', color: '#007bff' },
        { id: 'c2', name: 'Research Hub', color: '#17a2b8' }
    ];

    function save() {
        localStorage.setItem('tasks_v4', JSON.stringify(tasks));
        localStorage.setItem('cats_v4', JSON.stringify(categories));
        updateProgress();
    }

    function updateCols(val) {
        document.documentElement.style.setProperty('--cols', val);
        document.getElementById('colVal').innerText = val + " Columns";
        localStorage.setItem('pref_cols', val);
    }

    function render() {
        const container = document.getElementById('sections-container');
        container.innerHTML = '';

        categories.forEach(cat => {
            const catTasks = tasks.filter(t => t.catId === cat.id);
            const html = `
                <div class="section-wrapper" id="sec-${cat.id}" ondragover="allowDrop(event)" ondrop="dropTask(event, '${cat.id}')">
                    <div class="section-header" style="background: ${cat.color}">
                        <span contenteditable="true" onblur="updateCatName('${cat.id}', this.innerText)">${cat.name}</span>
                        <div class="header-btns">
                            <input type="color" class="color-picker" value="${cat.color}" onchange="updateCatColor('${cat.id}', this.value)">
                            <button onclick="addTask('${cat.id}')" style="background:white; color:black; border:none; padding:2px 8px; border-radius:4px; font-size:10px; cursor:pointer;">+ TASK</button>
                            <button onclick="deleteSection('${cat.id}')" style="background:rgba(0,0,0,0.2); color:white; border:none; border-radius:4px; padding:2px 8px; font-size:10px; cursor:pointer;">DEL</button>
                        </div>
                    </div>
                    <div class="task-grid">
                        ${catTasks.map(t => renderTask(t)).join('')}
                    </div>
                </div>`;
            container.innerHTML += html;
        });
        updateProgress();
        updateMLGS();
    }

    function renderTask(t) {
        const moveOptions = categories.map(c => `<option value="${c.id}" ${t.catId === c.id ? 'selected' : ''}>Move to: ${c.name}</option>`).join('');
        
        return `
            <div class="task-item" id="${t.id}" draggable="true" ondragstart="dragStart(event)">
                <button class="del-task" onclick="deleteTask('${t.id}')">×</button>
                <div class="task-header">
                    <input type="checkbox" class="task-check" ${t.checked ? 'checked' : ''} onchange="toggleCheck('${t.id}')">
                    <div class="task-name" contenteditable="true" onblur="updateTask('${t.id}', 'name', this.innerText)">${t.name}</div>
                </div>
                
                <a href="${t.url}" target="_blank" class="link-btn" 
                   style="background: ${t.id === 't1' ? '#007bff' : '#28a745'}" 
                   onclick="handleMLGSClick('${t.id}')">${t.btnText || 'OPEN LINK'}</a>
                
                ${t.id === 't1' ? '<div id="mlgs-timer" style="font-size:11px; text-align:center; font-weight:bold; color:red;"></div>' : ''}

                <div class="task-note" contenteditable="true" onblur="updateTask('${t.id}', 'note', this.innerText)">${t.note || 'Click to add notes...'}</div>

                <select class="move-menu" onchange="moveTask('${t.id}', this.value)">
                    <option disabled selected>Quick Move...</option>
                    ${moveOptions}
                </select>
            </div>`;
    }

    // Actions
    function toggleCheck(id) {
        const t = tasks.find(x => x.id === id);
        t.checked = !t.checked;
        save();
    }

    function updateTask(id, key, val) {
        const t = tasks.find(x => x.id === id);
        if(t) { t[key] = val; save(); }
    }

    function updateCatName(id, val) {
        const c = categories.find(x => x.id === id);
        if(c) { c.name = val; save(); }
    }

    function updateCatColor(id, val) {
        const c = categories.find(x => x.id === id);
        if(c) { c.color = val; save(); render(); }
    }

    function moveTask(taskId, newCatId) {
        const t = tasks.find(x => x.id === taskId);
        t.catId = newCatId;
        save(); render();
    }

    function addTask(catId) {
        const name = prompt("Task Name:");
        if(!name) return;
        tasks.push({ id: 't'+Date.now(), catId, name, url: '#', btnText: 'OPEN LINK', checked: false, note: '' });
        save(); render();
    }

    function createNewSection() {
        const name = prompt("Category Name:");
        if(!name) return;
        categories.push({ id: 'c'+Date.now(), name, color: '#555555' });
        save(); render();
    }

    function deleteTask(id) {
        if(confirm("Delete task?")) { tasks = tasks.filter(x => x.id !== id); save(); render(); }
    }

    function deleteSection(id) {
        if(confirm("Delete section and all tasks?")) {
            categories = categories.filter(x => x.id !== id);
            tasks = tasks.filter(x => x.catId !== id);
            save(); render();
        }
    }

    // Drag & Drop
    let draggedId = null;
    function dragStart(e) { draggedId = e.target.id; e.dataTransfer.setData("text/plain", draggedId); }
    function allowDrop(e) { e.preventDefault(); }
    function dropTask(e, catId) {
        e.preventDefault();
        const t = tasks.find(x => x.id === draggedId);
        if(t) { t.catId = catId; save(); render(); }
    }

    // Progress
    function updateProgress() {
        const total = tasks.length;
        const done = tasks.filter(t => t.checked).length;
        const pct = total ? Math.round((done/total)*100) : 0;
        const bar = document.getElementById('progress-bar');
        if(bar) { bar.style.width = pct+'%'; bar.innerText = `Daily Goal: ${pct}% (${done}/${total})`; }
    }

    // MLGS Logic
    function handleMLGSClick(id) {
        if(id === 't1') {
            const next = new Date().getTime() + (23 * 60 * 60 * 1000);
            localStorage.setItem('mlgs_time', next);
            updateMLGS();
        }
    }

    function updateMLGS() {
        const el = document.getElementById('mlgs-timer');
        if(!el) return;
        const next = localStorage.getItem('mlgs_time');
        if(!next) return;
        const diff = next - new Date().getTime();
        if(diff > 0) {
            const d = new Date(parseInt(next));
            let h = d.getHours();
            const m = d.getMinutes().toString().padStart(2,'0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            el.innerText = `NEXT MAIL: ${h%12||12}:${m} ${ampm}`;
        } else { el.innerText = "READY!"; }
    }

    // Backup
    function exportBackup() {
        const data = JSON.stringify({tasks, categories});
        const blob = new Blob([data], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "Traffic_Command_Elite.json";
        a.click();
    }

    function importBackup(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const d = JSON.parse(ev.target.result);
            if(d.tasks) tasks = d.tasks;
            if(d.categories) categories = d.categories;
            save(); render();
        };
        reader.readAsText(e.target.files[0]);
    }

    window.onload = () => {
        const savedCols = localStorage.getItem('pref_cols') || 4;
        document.getElementById('colSlider').value = savedCols;
        updateCols(savedCols);
        render();
        setInterval(updateMLGS, 60000);
    };
</script>
</body>
</html>
