<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        /* MAIN EDITOR */
        .main-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .editor-header {
            padding: 15px;
            border-bottom: 2px solid #e0e0e0;
            background: #fafafa;
        }

        .save-template-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
            width: 100%;
        }

        .save-template-btn:hover {
            background: #45a049;
        }

        .template-name-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .editor-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 10px;
        }

        .form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 15px;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea,
        .form-group select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
        }

        .form-group textarea {
            min-height: 150px;
            resize: both;
        }

        .form-group textarea:focus,
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 5px rgba(33, 150, 243, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-generate {
            background: #2196F3;
            color: white;
        }

        .btn-generate:hover {
            background: #0b7dda;
        }

        .btn-generate:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-insert-link {
            background: #FF9800;
            color: white;
        }

        .btn-insert-link:hover {
            background: #F57C00;
        }

        .btn-clear {
            background: #f44336;
            color: white;
        }

        .btn-clear:hover {
            background: #da190b;
        }

        /* PREVIEW SECTION */
        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 2px solid #e0e0e0;
        }

        .preview-header {
            padding: 15px;
            background: #fafafa;
            border-bottom: 2px solid #e0e0e0;
            font-weight: 600;
            color: #333;
        }

        .preview-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: white;
        }

        .email-preview {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .preview-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1a1a1a;
            padding-bottom: 10px;
            border-bottom: 2px solid #2196F3;
        }

        .preview-body {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 20px;
        }

        .preview-signature {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            margin-top: 15px;
            font-style: italic;
            color: #666;
            white-space: pre-wrap;
        }

        .preview-image {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border-radius: 4px;
        }

        /* SIDE PANEL - PROMPT LIBRARY */
        .side-panel {
            width: 350px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 15px;
            background: #2196F3;
            color: white;
            font-weight: 600;
            border-bottom: 2px solid #1976D2;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            gap: 10px;
            display: flex;
            flex-direction: column;
        }

        .prompt-category {
            margin-bottom: 20px;
        }

        .category-title {
            font-weight: 600;
            color: #2196F3;
            margin-bottom: 10px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prompt-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 12px;
            transition: all 0.3s ease;
            color: #333;
        }

        .prompt-btn:hover {
            background: #e3f2fd;
            border-color: #2196F3;
            color: #2196F3;
        }

        /* IMAGE GENERATION */
        .image-gen-section {
            border-top: 2px solid #e0e0e0;
            padding: 15px;
            background: #f9f9f9;
        }

        .image-gen-header {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 12px;
        }

        .generated-images {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .image-item {
            position: relative;
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .image-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .image-item:hover {
            border-color: #2196F3;
        }

        .image-insert-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(33, 150, 243, 0.9);
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
            display: none;
        }

        .image-item:hover .image-insert-btn {
            display: block;
        }

        /* STATUS MESSAGES */
        .status-message {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 12px;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #fefefe;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .modal-close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #000;
        }

        .model-selector {
            margin-bottom: 15px;
        }

        .model-selector select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .error-log {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            max-height: 100px;
            overflow-y: auto;
            font-size: 12px;
            color: #856404;
            font-family: monospace;
            display: none;
        }

        .error-log.show {
            display: block;
        }

        @media (max-width: 1400px) {
            .side-panel {
                width: 280px;
            }
        }

        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
            }

            .side-panel {
                width: 100%;
                max-height: 300px;
                order: 3;
            }

            .main-editor {
                order: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MAIN EDITOR -->
        <div class="main-editor">
            <div class="editor-header">
                <button class="save-template-btn">💾 SAVE TEMPLATE</button>
                <input 
                    type="text" 
                    id="templateName" 
                    class="template-name-input" 
                    placeholder="Template Name (e.g., Sales Pitch v1)"
                >
                <div id="statusMessage" class="status-message"></div>
                <div id="errorLog" class="error-log"></div>
            </div>

            <div class="editor-content">
                <!-- FORM SECTION -->
                <div class="form-section">
                    <!-- MODEL SELECTION -->
                    <div class="form-group">
                        <label>🤖 AI Model</label>
                        <select id="modelSelect">
                            <option value="gpt-4">GPT-4 (Most Advanced)</option>
                            <option value="gpt-3.5-turbo" selected>GPT-3.5 Turbo (Fast)</option>
                            <option value="claude">Claude (Alternative)</option>
                            <option value="local">Local Model (Offline)</option>
                        </select>
                    </div>

                    <!-- RECIPIENT INFO -->
                    <div class="form-group">
                        <label>📧 Recipient Email</label>
                        <input 
                            type="email" 
                            id="recipientEmail" 
                            placeholder="recipient@example.com"
                        >
                    </div>

                    <div class="form-group">
                        <label>👤 Recipient Name</label>
                        <input 
                            type="text" 
                            id="recipientName" 
                            placeholder="e.g., John Smith"
                        >
                    </div>

                    <!-- TITLE GENERATION (3 options) -->
                    <div class="form-group">
                        <label>📝 Email Subject Line Prompt</label>
                        <textarea 
                            id="titlePrompt" 
                            placeholder="Describe what the subject line should be about..."
                        ></textarea>
                        <button class="btn btn-generate" id="generateTitlesBtn">✨ Generate 3 Subject Lines</button>
                    </div>

                    <!-- TITLE OPTIONS SELECTOR -->
                    <div id="titleOptionsContainer" style="display: none;">
                        <div class="form-group">
                            <label>Choose Subject Line:</label>
                            <div id="titleOptions" style="display: flex; flex-direction: column; gap: 8px;"></div>
                        </div>
                    </div>

                    <!-- SELECTED TITLE DISPLAY -->
                    <div class="form-group">
                        <label>✅ Selected Subject Line</label>
                        <input 
                            type="text" 
                            id="emailTitle" 
                            placeholder="Selected subject line will appear here..."
                            readonly
                        >
                    </div>

                    <!-- BODY GENERATION -->
                    <div class="form-group">
                        <label>💬 Email Body Prompt</label>
                        <textarea 
                            id="bodyPrompt" 
                            placeholder="Describe what you want in the email body..."
                        ></textarea>
                        <button class="btn btn-generate" id="generateBodyBtn">✨ Generate Email Body</button>
                    </div>

                    <!-- EMAIL BODY EDITOR -->
                    <div class="form-group">
                        <label>📄 Email Body</label>
                        <textarea 
                            id="emailBody" 
                            placeholder="Email body content will appear here..."
                        ></textarea>
                        <div class="button-group">
                            <button class="btn btn-insert-link" id="insertLinkBtn">🔗 Insert Link</button>
                            <button class="btn btn-insert-link" id="insertImageBtn">🖼️ Insert Image</button>
                        </div>
                    </div>

                    <!-- SIGNATURE (BELOW BODY) -->
                    <div class="form-group">
                        <label>✍️ Signature</label>
                        <textarea 
                            id="signature" 
                            placeholder="Your signature (name, title, contact info)..."
                            style="min-height: 100px;"
                        ></textarea>
                    </div>

                    <!-- CLEAR BUTTON -->
                    <button class="btn btn-clear">🗑️ Clear All</button>
                </div>

                <!-- PREVIEW SECTION -->
                <div class="preview-section">
                    <div class="preview-header">📧 Email Preview</div>
                    <div class="preview-content">
                        <div class="email-preview">
                            <div class="preview-title" id="previewTitle">Subject: [Your subject line will appear here]</div>
                            <div class="preview-body" id="previewBody">Email body will appear here...</div>
                            <div class="preview-signature" id="previewSignature">Signature will appear here</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SIDE PANEL - PROMPT LIBRARY -->
        <div class="side-panel">
            <div class="panel-header">📚 Prompt Library</div>
            <div class="panel-content">
                <!-- SALES PROMPTS -->
                <div class="prompt-category">
                    <div class="category-title">🎯 Sales</div>
                    <button class="prompt-btn" data-prompt="Write a compelling sales email subject line for a B2B SaaS product">Sales Pitch Subject</button>
                    <button class="prompt-btn" data-prompt="Create a cold email body that introduces our product and offers a discovery call">Cold Email Body</button>
                    <button class="prompt-btn" data-prompt="Write a follow-up email for a prospect who hasn't responded">Follow-up Email</button>
                    <button class="prompt-btn" data-prompt="Create a limited-time offer email that creates urgency">Promotional Email</button>
                </div>

                <!-- CUSTOMER SUPPORT PROMPTS -->
                <div class="prompt-category">
                    <div class="category-title">💬 Support</div>
                    <button class="prompt-btn" data-prompt="Write a professional email response to a customer complaint">Support Response</button>
                    <button class="prompt-btn" data-prompt="Create a helpful troubleshooting email for a common customer issue">Troubleshooting</button>
                    <button class="prompt-btn" data-prompt="Write a follow-up email checking if the issue was resolved">Follow-up Check</button>
                </div>

                <!-- HR/RECRUITMENT PROMPTS -->
                <div class="prompt-category">
                    <div class="category-title">👔 HR/Recruitment</div>
                    <button class="prompt-btn" data-prompt="Write a job offer email">Job Offer Email</button>
                    <button class="prompt-btn" data-prompt="Create a rejection email that is respectful and professional">Rejection Email</button>
                    <button class="prompt-btn" data-prompt="Write an interview invitation email">Interview Invitation</button>
                </div>

                <!-- MARKETING PROMPTS -->
                <div class="prompt-category">
                    <div class="category-title">📢 Marketing</div>
                    <button class="prompt-btn" data-prompt="Write a newsletter email about our latest product features">Newsletter</button>
                    <button class="prompt-btn" data-prompt="Create an event invitation email with compelling details">Event Invitation</button>
                    <button class="prompt-btn" data-prompt="Write a product launch announcement email">Product Launch</button>
                </div>

                <!-- IMAGE GENERATION SECTION -->
                <div class="image-gen-section">
                    <div class="image-gen-header">🎨 Image Generator</div>
                    <div class="form-group" style="margin: 0;">
                        <input 
                            type="text" 
                            id="imagePrompt" 
                            placeholder="Describe the image you want..."
                            style="font-size: 12px;"
                        >
                        <button class="btn btn-generate" id="generateImagesBtn" style="width: 100%; margin-top: 5px;">Generate Images</button>
                    </div>
                    <div id="generatedImages" class="generated-images"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- LINK INSERTION MODAL -->
    <div id="linkModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="closeLinkModal">&times;</span>
            <h2>Insert Link</h2>
            <div class="form-group">
                <label>Link Text</label>
                <input type="text" id="linkText" placeholder="e.g., Click here">
            </div>
            <div class="form-group">
                <label>URL</label>
                <input type="text" id="linkUrl" placeholder="https://example.com">
            </div>
            <button class="btn btn-generate" id="confirmLinkBtn" style="width: 100%; margin-top: 10px;">Insert Link</button>
        </div>
    </div>

    <!-- IMAGE INSERTION MODAL -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="closeImageModal">&times;</span>
            <h2>Insert Image</h2>
            <div class="form-group">
                <label>Image URL</label>
                <input type="text" id="imageUrl" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
                <label>Alt Text (for accessibility)</label>
                <input type="text" id="imageAlt" placeholder="Description of the image">
            </div>
            <button class="btn btn-generate" id="confirmImageBtn" style="width: 100%; margin-top: 10px;">Insert Image</button>
        </div>
    </div>

    <script>
        // ============================================
        // ERROR TRACKING & LOGGING
        // ============================================
        class ErrorTracker {
            constructor() {
                this.errors = [];
                this.maxErrors = 10;
            }

            log(error) {
                const timestamp = new Date().toLocaleTimeString();
                const errorMsg = error instanceof Error ? error.message : String(error);
                const fullMsg = `[${timestamp}] ${errorMsg}`;
                
                this.errors.unshift(fullMsg);
                if (this.errors.length > this.maxErrors) {
                    this.errors.pop();
                }
                
                this.display();
                console.error(fullMsg);
            }

            display() {
                const errorLog = document.getElementById('errorLog');
                if (this.errors.length > 0) {
                    errorLog.textContent = this.errors.join('\n');
                    errorLog.classList.add('show');
                } else {
                    errorLog.classList.remove('show');
                }
            }

            clear() {
                this.errors = [];
                this.display();
            }
        }

        const errorTracker = new ErrorTracker();

        // ============================================
        // MAIN APPLICATION
        // ============================================
        class EmailTemplateEditor {
            constructor() {
                this.generatedTitles = [];
                this.selectedTitle = '';
                this.currentImageResults = [];
                this.initializeElements();
                this.attachEventListeners();
                this.loadSavedTemplates();
            }

            initializeElements() {
                // Form elements
                this.recipientEmail = document.getElementById('recipientEmail');
                this.recipientName = document.getElementById('recipientName');
                this.titlePrompt = document.getElementById('titlePrompt');
                this.bodyPrompt = document.getElementById('bodyPrompt');
                this.emailTitle = document.getElementById('emailTitle');
                this.emailBody = document.getElementById('emailBody');
                this.signature = document.getElementById('signature');
                this.modelSelect = document.getElementById('modelSelect');
                this.templateName = document.getElementById('templateName');

                // Preview elements
                this.previewTitle = document.getElementById('previewTitle');
                this.previewBody = document.getElementById('previewBody');
                this.previewSignature = document.getElementById('previewSignature');

                // Buttons
                this.generateTitlesBtn = document.getElementById('generateTitlesBtn');
                this.generateBodyBtn = document.getElementById('generateBodyBtn');
                this.insertLinkBtn = document.getElementById('insertLinkBtn');
                this.insertImageBtn = document.getElementById('insertImageBtn');
                this.clearBtn = document.querySelector('.btn-clear');
                this.saveTemplateBtn = document.querySelector('.save-template-btn');

                // Image generation
                this.imagePrompt = document.getElementById('imagePrompt');
                this.generateImagesBtn = document.getElementById('generateImagesBtn');
                this.generatedImages = document.getElementById('generatedImages');

                // Status message
                this.statusMessage = document.getElementById('statusMessage');

                // Title options
                this.titleOptionsContainer = document.getElementById('titleOptionsContainer');
                this.titleOptions = document.getElementById('titleOptions');

                // Modals
                this.linkModal = document.getElementById('linkModal');
                this.imageModal = document.getElementById('imageModal');
                this.closeLinkModal = document.getElementById('closeLinkModal');
                this.closeImageModal = document.getElementById('closeImageModal');
                this.linkText = document.getElementById('linkText');
                this.linkUrl = document.getElementById('linkUrl');
                this.imageUrl = document.getElementById('imageUrl');
                this.imageAlt = document.getElementById('imageAlt');
                this.confirmLinkBtn = document.getElementById('confirmLinkBtn');
                this.confirmImageBtn = document.getElementById('confirmImageBtn');

                // Prompt library buttons
                this.promptButtons = document.querySelectorAll('.prompt-btn');
            }

            attachEventListeners() {
                // Generate buttons
                this.generateTitlesBtn.addEventListener('click', () => this.generateTitles());
                this.generateBodyBtn.addEventListener('click', () => this.generateBody());
                this.generateImagesBtn.addEventListener('click', () => this.generateImages());

                // Insert buttons
                this.insertLinkBtn.addEventListener('click', () => this.openLinkModal());
                this.insertImageBtn.addEventListener('click', () => this.openImageModal());

                // Clear button
                this.clearBtn.addEventListener('click', () => this.clearAll());

                // Save template
                this.saveTemplateBtn.addEventListener('click', () => this.saveTemplate());

                // Modal controls
                this.closeLinkModal.addEventListener('click', () => this.closeLinkModal.parentElement.parentElement.classList.remove('show'));
                this.closeImageModal.addEventListener('click', () => this.closeImageModal.parentElement.parentElement.classList.remove('show'));
                this.confirmLinkBtn.addEventListener('click', () => this.insertLink());
                this.confirmImageBtn.addEventListener('click', () => this.insertImage());

                // Preview updates
                this.emailTitle.addEventListener('input', () => this.updatePreview());
                this.emailBody.addEventListener('input', () => this.updatePreview());
                this.signature.addEventListener('input', () => this.updatePreview());

                // Prompt library
                this.promptButtons.forEach(btn => {
                    btn.addEventListener('click', () => this.applyPrompt(btn));
                });

                // Modal close on outside click
                window.addEventListener('click', (e) => {
                    if (e.target === this.linkModal) this.linkModal.classList.remove('show');
                    if (e.target === this.imageModal) this.imageModal.classList.remove('show');
                });
            }

            // ============================================
            // TITLE GENERATION (3 OPTIONS)
            // ============================================
            async generateTitles() {
                if (!this.titlePrompt.value.trim()) {
                    this.showStatus('Please enter a prompt for subject lines', 'error');
                    return;
                }

                this.generateTitlesBtn.disabled = true;
                this.generateTitlesBtn.textContent = '⏳ Generating...';

                try {
                    const prompt = `Generate exactly 3 different email subject lines based on this request: "${this.titlePrompt.value}". 
                    
                    Format your response as:
                    1. [First subject line]
                    2. [Second subject line]
                    3. [Third subject line]
                    
                    Make them compelling and professional.`;

                    const response = await this.callAI(prompt);

                    if (!response) {
                        throw new Error('No response from AI');
                    }

                    // Parse the 3 titles
                    this.generatedTitles = this.parseTitles(response);

                    if (this.generatedTitles.length === 0) {
                        throw new Error('Could not parse generated titles');
                    }

                    this.displayTitleOptions();
                    this.showStatus(`Generated ${this.generatedTitles.length} subject lines`, 'success');

                } catch (error) {
                    errorTracker.log(error);
                    this.showStatus('Error generating titles: ' + error.message, 'error');
                } finally {
                    this.generateTitlesBtn.disabled = false;
                    this.generateTitlesBtn.textContent = '✨ Generate 3 Subject Lines';
                }
            }

            parseTitles(text) {
                const titles = [];
                const lines = text.split('\n');
                
                lines.forEach(line => {
                    const match = line.match(/^\d+\.\s*(.+)$/);
                    if (match && match[1]) {
                        titles.push(match[1].trim());
                    }
                });

                return titles.slice(0, 3); // Only take first 3
            }

            displayTitleOptions() {
                this.titleOptions.innerHTML = '';
                
                this.generatedTitles.forEach((title, index) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn btn-generate';
                    btn.textContent = `Option ${index + 1}: ${title}`;
                    btn.style.textAlign = 'left';
                    btn.style.padding = '10px';
                    btn.addEventListener('click', () => this.selectTitle(title));
                    this.titleOptions.appendChild(btn);
                });

                this.titleOptionsContainer.style.display = 'block';
            }

            selectTitle(title) {
                this.selectedTitle = title;
                this.emailTitle.value = title;
                this.updatePreview();
                this.showStatus('Subject line selected', 'success');
            }

            // ============================================
            // BODY GENERATION
            // ============================================
            async generateBody() {
                if (!this.bodyPrompt.value.trim()) {
                    this.showStatus('Please enter a prompt for the email body', 'error');
                    return;
                }

                this.generateBodyBtn.disabled = true;
                this.generateBodyBtn.textContent = '⏳ Generating...';

                try {
                    const contextInfo = `
                    Recipient: ${this.recipientName.value || 'Recipient'}
                    Purpose: ${this.bodyPrompt.value}
                    `;

                    const prompt = `Write a professional email body based on this information:
                    ${contextInfo}
                    
                    Make it concise, engaging, and professional. Format it with appropriate line breaks.`;

                    const response = await this.callAI(prompt);

                    if (!response) {
                        throw new Error('No response from AI');
                    }

                    this.emailBody.value = response;
                    this.updatePreview();
                    this.showStatus('Email body generated successfully', 'success');

                } catch (error) {
                    errorTracker.log(error);
                    this.showStatus('Error generating body: ' + error.message, 'error');
                } finally {
                    this.generateBodyBtn.disabled = false;
                    this.generateBodyBtn.textContent = '✨ Generate Email Body';
                }
            }

            // ============================================
            // IMAGE GENERATION
            // ============================================
            async generateImages() {
                if (!this.imagePrompt.value.trim()) {
                    this.showStatus('Please enter a description for the images', 'error');
                    return;
                }

                this.generateImagesBtn.disabled = true;
                this.generateImagesBtn.textContent = '⏳ Generating...';

                try {
                    // Using Unsplash API as example for image generation
                    const searchTerm = encodeURIComponent(this.imagePrompt.value);
                    const response = await fetch(
                        `https://api.unsplash.com/search/photos?query=${searchTerm}&count=6&client_id=YOUR_UNSPLASH_API_KEY`
                    );

                    if (!response.ok) {
                        throw new Error('Could not fetch images from Unsplash');
                    }

                    const data = await response.json();
                    this.displayGeneratedImages(data.results);

                } catch (error) {
                    errorTracker.log(error);
                    this.showStatus('Error generating images. Ensure Unsplash API key is configured.', 'error');
                    this.displayPlaceholderImages();
                } finally {
                    this.generateImagesBtn.disabled = false;
                    this.generateImagesBtn.textContent = 'Generate Images';
                }
            }

            displayGeneratedImages(images) {
                this.generatedImages.innerHTML = '';

                images.forEach(image => {
                    const div = document.createElement('div');
                    div.className = 'image-item';
                    div.innerHTML = `
                        <img src="${image.urls.small}" alt="${image.alt_description || 'Generated image'}" />
                        <button class="image-insert-btn" onclick="editor.insertGeneratedImage('${image.urls.regular}', '${image.alt_description || 'Image'}')">
                            Insert
                        </button>
                    `;
                    this.generatedImages.appendChild(div);
                });

                this.showStatus('Images generated successfully', 'success');
            }

            displayPlaceholderImages() {
                this.generatedImages.innerHTML = `
                    <div style="grid-column: 1/-1; padding: 20px; text-align: center; color: #999;">
                        <p>Images from Unsplash require API configuration</p>
                        <p style="font-size: 11px;">Use the Insert Image button to add images manually</p>
                    </div>
                `;
            }

            insertGeneratedImage(url, alt) {
                this.imageUrl.value = url;
                this.imageAlt.value = alt;
                this.imageModal.classList.add('show');
            }

            // ============================================
            // LINK & IMAGE INSERTION
            // ============================================
            openLinkModal() {
                this.linkText.value = '';
                this.linkUrl.value = '';
                this.linkModal.classList.add('show');
                this.linkText.focus();
            }

            openImageModal() {
                this.imageUrl.value = '';
                this.imageAlt.value = '';
                this.imageModal.classList.add('show');
                this.imageUrl.focus();
            }

            insertLink() {
                const text = this.linkText.value.trim();
                const url = this.linkUrl.value.trim();

                if (!text || !url) {
                    this.showStatus('Please enter both link text and URL', 'error');
                    return;
                }

                const linkHtml = `<a href="${url}">${text}</a>`;
                this.emailBody.value += `\n\n${linkHtml}`;
                this.updatePreview();
                this.linkModal.classList.remove('show');
                this.showStatus('Link inserted', 'success');
            }

            insertImage() {
                const url = this.imageUrl.value.trim();
                const alt = this.imageAlt.value.trim() || 'Image';

                if (!url) {
                    this.showStatus('Please enter an image URL', 'error');
                    return;
                }

                const imageHtml = `<img src="${url}" alt="${alt}" style="max-width: 100%; height: auto; border-radius: 4px;" />`;
                this.emailBody.value += `\n\n${imageHtml}`;
                this.updatePreview();
                this.imageModal.classList.remove('show');
                this.showStatus('Image inserted', 'success');
            }

            // ============================================
            // PREVIEW UPDATES
            // ============================================
            updatePreview() {
                const title = this.emailTitle.value || '[No subject line]';
                const body = this.emailBody.value || '[Email body will appear here]';
                const sig = this.signature.value || '[Signature]';

                this.previewTitle.textContent = `Subject: ${title}`;
                this.previewBody.textContent = body;
                this.previewSignature.textContent = sig;
            }

            // ============================================
            // PROMPT LIBRARY
            // ============================================
            applyPrompt(btn) {
                const prompt = btn.getAttribute('data-prompt');
                
                // Determine if it's a title or body prompt
                if (btn.textContent.includes('Subject') || btn.textContent.includes('subject')) {
                    this.titlePrompt.value = prompt;
                    this.titlePrompt.focus();
                } else {
                    this.bodyPrompt.value = prompt;
                    this.bodyPrompt.focus();
                }

                this.showStatus('Prompt applied. Click Generate to create content.', 'success');
            }

            // ============================================
            // SAVE & LOAD TEMPLATES
            // ============================================
            saveTemplate() {
                const name = this.templateName.value.trim();
                
                if (!name) {
                    this.showStatus('Please enter a template name', 'error');
                    return;
                }

                const template = {
                    name: name,
                    recipientEmail: this.recipientEmail.value,
                    recipientName: this.recipientName.value,
                    emailTitle: this.emailTitle.value,
                    emailBody: this.emailBody.value,
                    signature: this.signature.value,
                    createdAt: new Date().toISOString()
                };

                try {
                    let templates = JSON.parse(localStorage.getItem('emailTemplates')) || [];
                    templates.push(template);
                    localStorage.setItem('emailTemplates', JSON.stringify(templates));
                    
                    this.showStatus(`Template "${name}" saved successfully!`, 'success');
                    this.templateName.value = '';
                } catch (error) {
                    errorTracker.log(error);
                    this.showStatus('Error saving template: ' + error.message, 'error');
                }
            }

            loadSavedTemplates() {
                try {
                    const templates = JSON.parse(localStorage.getItem('emailTemplates')) || [];
                    // Can be used to populate a templates list if needed
                } catch (error) {
                    errorTracker.log(error);
                }
            }

            // ============================================
            // UTILITIES
            // ============================================
            clearAll() {
                if (confirm('Are you sure you want to clear all content?')) {
                    this.recipientEmail.value = '';
                    this.recipientName.value = '';
                    this.titlePrompt.value = '';
                    this.bodyPrompt.value = '';
                    this.emailTitle.value = '';
                    this.emailBody.value = '';
                    this.signature.value = '';
                    this.generatedTitles = [];
                    this.titleOptionsContainer.style.display = 'none';
                    this.updatePreview();
                    this.showStatus('All content cleared', 'success');
                }
            }

            showStatus(message, type = 'info') {
                this.statusMessage.textContent = message;
                this.statusMessage.className = `status-message show ${type}`;
                
                if (type !== 'loading') {
                    setTimeout(() => {
                        this.statusMessage.classList.remove('show');
                    }, 5000);
                }
            }

            // ============================================
            // AI INTEGRATION
            // ============================================
            async callAI(prompt) {
                const model = this.modelSelect.value;
                this.showStatus('Calling AI...', 'loading');

                try {
                    // Example using OpenAI API
                    // Replace with your actual API endpoint and key
                    const apiKey = 'YOUR_OPENAI_API_KEY'; // Set this to your actual key

                    if (!apiKey || apiKey.includes('YOUR_')) {
                        // Fallback for demo
                        return this.generateDemoResponse(prompt);
                    }

                    const response = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: model === 'gpt-4' ? 'gpt-4' : 'gpt-3.5-turbo',
                            messages: [
                                {
                                    role: 'system',
                                    content: 'You are a professional email writer.'
                                },
                                {
                                    role: 'user',
                                    content: prompt
                                }
                            ],
                            temperature: 0.7,
                            max_tokens: 500
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();

                    if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                        throw new Error('Invalid API response structure');
                    }

                    return data.choices[0].message.content;

                } catch (error) {
                    errorTracker.log(error);
                    this.showStatus('AI call failed. Using demo response.', 'error');
                    return this.generateDemoResponse(prompt);
                }
            }

            generateDemoResponse(prompt) {
                // Demo responses for testing
                if (prompt.includes('subject') || prompt.includes('Subject')) {
                    return `1. Limited-time offer - exclusive access inside
2. You've been personally selected for this opportunity  
3. Quick question about your business growth`;
                } else if (prompt.includes('body') || prompt.includes('Body')) {
                    return `Hi there,

I hope this message finds you well. I wanted to reach out because I believe there might be a great fit between our services and your business needs.

We've helped companies like yours achieve remarkable results. I'd love to have a quick conversation about how we can help you reach your goals.

Would you be available for a brief call next week?

Looking forward to connecting!`;
                } else {
                    return `This is a demo response. To use real AI generation, please configure your API key in the code.`;
                }
            }
        }

        // ============================================
        // INITIALIZE APP
        // ============================================
        const editor = new EmailTemplateEditor();
        
        // Show welcome message
        editor.showStatus('Email Template Editor Ready! Configure your API key for full AI functionality.', 'info');
    </script>
</body>
</html>
