<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Swipe Machine</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:Arial,sans-serif;
            background:#d4c4a8;
            color:#000;
            line-height:1.6;
            font-size:16px;
        }
        .container{max-width:1700px;margin:0 auto;padding:20px}
        .header{
            background:#f5f0e6;
            padding:20px;
            border-radius:8px;
            margin-bottom:20px;
            border:2px solid #b8860b;
            text-align:center;
        }
        .header h1{color:#b8860b;font-size:28px;font-weight:700}
        .grid{display:grid;grid-template-columns:380px 1fr;gap:20px}
        .sidebar{background:#f5f0e6;padding:20px;border-radius:8px;border:1px solid #c9b896}
        .main{background:#ffffff;padding:20px;border-radius:8px;border:1px solid #c9b896}
        .card{margin-bottom:20px}
        .card-title{font-size:18px;font-weight:700;color:#b8860b;margin-bottom:15px}
        input,textarea,select{
            width:100%;
            padding:12px;
            border-radius:6px;
            border:1px solid #c9b896;
            background:#fff;
            color:#000;
            font-size:16px;
            margin-bottom:10px;
        }
        textarea{min-height:180px;resize:vertical}
        .btn{
            background:#b8860b;
            color:#fff;
            border:none;
            padding:12px;
            border-radius:6px;
            cursor:pointer;
            font-weight:700;
            margin-right:8px;
            margin-bottom:8px;
        }
        .btn:hover{background:#a0780a}
        .btn-small{padding:8px 12px;font-size:14px}
        .btn-green{background:#2e7d32}
        .btn-green:hover{background:#1b5e20}
        .btn-red{background:#c74444}
        .btn-red:hover{background:#a83838}
        .subject-item{
            background:#fff;
            padding:12px;
            border:1px solid #c9b896;
            border-radius:6px;
            margin-bottom:8px;
            cursor:pointer;
        }
        .subject-item:hover{background:#fffdf8}
        .preview-frame{
            background:#fff;
            padding:20px;
            min-height:400px;
            border:1px solid #c9b896;
            border-radius:6px;
            color:#000;
            font-size:16px;
            line-height:1.7;
        }
        .raw-output{
            background:#000;
            color:#0f0;
            padding:15px;
            border-radius:6px;
            font-family:monospace;
            font-size:13px;
            max-height:300px;
            overflow:auto;
            margin-top:20px;
            display:none;
        }
        .raw-output.show{display:block}
        .prefix-btn{
            display:inline-block;
            background:#f5f0e6;
            border:1px solid #c9b896;
            padding:8px 12px;
            border-radius:6px;
            cursor:pointer;
            margin-right:8px;
            margin-bottom:8px;
            font-weight:600;
        }
        .prefix-btn:hover{background:#e8dcc8}
        .divider{height:1px;background:#c9b896;margin:20px 0}
        @media (max-width:1200px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔥 Email Swipe Machine</h1>
    </div>

    <div class="grid">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="card">
                <div class="card-title">API Key (Groq)</div>
                <input type="password" id="apiKey" placeholder="Paste Groq API key">
                <button class="btn" onclick="saveApi()">Save Key</button>
                <p style="font-size:13px;margin-top:8px">Get free key: <a href="https://console.groq.com" target="_blank">console.groq.com</a></p>
            </div>

            <div class="card">
                <div class="card-title">Prompt Library</div>
                <div id="promptList"></div>
                <button class="btn btn-green" onclick="addPrompt()">+ Add New Prompt</button>
            </div>

            <div class="card">
                <div class="card-title">Templates</div>
                <div id="templateList"></div>
                <button class="btn btn-green" onclick="saveTemplate()">Save Current</button>
            </div>

            <div class="card">
                <div class="card-title">Signatures</div>
                <div id="sigList"></div>
                <button class="btn btn-green" onclick="insertSig()">Insert Selected</button>
                <button class="btn" onclick="manageSigs()">Manage</button>
            </div>
        </div>

        <!-- Main -->
        <div class="main">
            <div class="card">
                <div class="card-title">Subject Line</div>
                <div style="margin-bottom:12px">
                    <span class="prefix-btn" onclick="insertPrefix('{!firstname_fix}⭐ ')">{!firstname_fix}⭐</span>
                    <span class="prefix-btn" onclick="insertPrefix('{!lastname_fix}⭐ ')">{!lastname_fix}⭐</span>
                    <span class="prefix-btn" onclick="insertPrefix('⭐ ')">⭐</span>
                </div>
                <input type="text" id="subject" placeholder="Subject line (36+ chars, 7+ words)">
                <div id="subjectInfo" style="font-size:14px;margin:8px 0"></div>
                <button class="btn btn-green" onclick="generateSubjects()">Generate 3 Subjects</button>
                <div id="subjectResults" style="margin-top:12px"></div>
            </div>

            <div class="card">
                <div class="card-title">Email Body</div>
                <textarea id="body" placeholder="Your email body..."></textarea>
                <div style="margin-top:10px">
                    <button class="btn btn-green" onclick="generateBody()">Generate Body</button>
                    <button class="btn" onclick="undo()">Undo</button>
                    <button class="btn btn-red" onclick="$('body').value='';updatePreview()">Clear</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Live Preview</div>
                <div style="background:#f5f0e6;padding:12px;border-radius:6px 6px 0 0;border:1px solid #c9b896;border-bottom:none">
                    <strong>Subject:</strong> <span id="previewSubject">...</span>
                </div>
                <div class="preview-frame" id="previewFrame">
                    <p style="color:#999">Start typing...</p>
                </div>
                <div style="margin-top:15px">
                    <button class="btn btn-green" onclick="copyFull()">Copy Full Email</button>
                    <button class="btn" onclick="copySubject()">Copy Subject</button>
                    <button class="btn" onclick="copyBody()">Copy Body HTML</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Raw AI Output (Debug)</div>
                <button class="btn btn-small" onclick="$('raw').classList.toggle('show')">Toggle Raw Output</button>
                <pre id="raw" class="raw-output"></pre>
            </div>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = {
    apiKey: localStorage.getItem('esm_key') || '',
    prompts: JSON.parse(localStorage.getItem('esm_prompts') || 'null') || getDefaultPrompts(),
    templates: JSON.parse(localStorage.getItem('esm_templates') || '[]'),
    signatures: JSON.parse(localStorage.getItem('esm_sigs') || '[{"id":1,"name":"Main","content":""}]'),
    currentSig: Number(localStorage.getItem('esm_sig') || 1),
    lastPrompt: null,
    undoStack: [],
    rawOutput: ''
};

function getDefaultPrompts(){
    return [
        {id:1,name:"💰 Income",subject:"Generate 3 subject lines about earning income online. 36-80 chars, 7+ words. Curiosity angle. Output ONLY numbered list.",body:"Write an email about making money online. Start with ⭐{!name_fix}. 12-15 sentences. 2-3 sentence paragraphs. Conversational tone. Call-to-action at end. NO signature."},
        {id:2,name:"😴 Passive",subject:"Generate 3 subject lines about passive income. 36-80 chars, 7+ words. Output ONLY numbered list.",body:"Write an email about passive income. Start with ⭐{!name_fix}. 12-15 sentences. 2-3 sentence paragraphs. Emphasize ease. NO signature."},
        {id:3,name:"⏰ Urgency",subject:"Generate 3 urgency subject lines. 36-80 chars, 7+ words. FOMO style. Output ONLY numbered list.",body:"Write an urgent email. Start with ⭐{!name_fix}. 12-15 sentences. 2-3 sentence paragraphs. Limited time angle. NO signature."}
    ];
}

function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 3000);
}

function saveApi(){
    localStorage.setItem('esm_key', $('apiKey').value);
    toast('API key saved');
}

async function callAI(prompt){
    const key = localStorage.getItem('esm_key');
    if(!key){toast('Set API key');return null;}
    try{
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
            method:'POST',
            headers:{'Authorization':`Bearer ${key}`,'Content-Type':'application/json'},
            body:JSON.stringify({model:'llama-3.1-70b-versatile',messages:[{role:'user',content:prompt}],temperature:0.7})
        });
        const data = await res.json();
        const text = data.choices[0].message.content;
        $('raw').textContent = text;
        return text;
    }catch(e){
        $('raw').textContent = 'Error: ' + e.message;
        toast('API error - check Raw Output');
        return null;
    }
}

function renderPrompts(){
    const list = $('promptList');
    list.innerHTML = '';
    state.prompts.forEach(p=>{
        const div = document.createElement('div');
        div.className = 'card';
        div.style.marginBottom = '15px';
        div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <strong>${p.name}</strong>
                <button class="btn btn-red btn-small" onclick="deletePrompt(${p.id})">Delete</button>
            </div>
            <input type="text" value="${p.name}" onchange="updatePrompt(${p.id},'name',this.value)">
            <label>Subject Prompt</label>
            <textarea onchange="updatePrompt(${p.id},'subject',this.value)">${p.subject}</textarea>
            <label>Body Prompt</label>
            <textarea onchange="updatePrompt(${p.id},'body',this.value)">${p.body}</textarea>
            <button class="btn btn-green" onclick="state.lastPrompt=${p.id};generateSubjects();generateBody()" style="margin-top:10px">Generate with this prompt</button>
        `;
        list.appendChild(div);
    });
}

function updatePrompt(id, field, value){
    const p = state.prompts.find(x=>x.id===id);
    p[field] = value;
    localStorage.setItem('esm_prompts',JSON.stringify(state.prompts));
}

function deletePrompt(id){
    if(!confirm('Delete prompt?')) return;
    state.prompts = state.prompts.filter(x=>x.id!==id);
    localStorage.setItem('esm_prompts',JSON.stringify(state.prompts));
    renderPrompts();
}

function addPrompt(){
    const name = prompt('Prompt name:');
    if(!name) return;
    state.prompts.push({
        id:Date.now(),
        name,
        subject:"Generate 3 subject lines. 36-80 chars, 7+ words.",
        body:"Write an email. Start with ⭐{!name_fix}. 12-15 sentences. 2-3 sentence paragraphs."
    });
    localStorage.setItem('esm_prompts',JSON.stringify(state.prompts));
    renderPrompts();
}

async function generateSubjects(){
    const p = state.prompts.find(x=>x.id===state.lastPrompt) || state.prompts[0];
    const res = await callAI(p.subject);
    if(!res) return;
    const lines = res.split('\n').map(l=>l.replace(/^\d+[\.\)]\s*/,'').trim());
    const valid = lines.filter(s=>s.length>=36 && s.split(' ').length>=7);
    const list = $('subjectResults');
    list.innerHTML = valid.slice(0,3).map(s=>`<div class="subject-item" onclick="$('subject').value='${s}';updatePreview()">${s}</div>`).join('');
    if(valid.length===0) toast('No valid subjects - check Raw Output');
}

async function generateBody(){
    const p = state.prompts.find(x=>x.id===state.lastPrompt) || state.prompts[0];
    const res = await callAI(p.body);
    if(!res) return;
    $('body').value = res;
    updatePreview();
}

function insertPrefix(prefix){
    $('subject').value = prefix + $('subject').value;
    updatePreview();
}

function updatePreview(){
    const sub = $('subject').value;
    const body = $('body').value;
    $('previewSubject').textContent = sub || '...';
    const paras = body.split('\n\n').map(p=>p.trim()).filter(Boolean);
    $('previewFrame').innerHTML = paras.length ? paras.map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('') : '<p style="color:#999">Start typing...</p>';
    $('subjectInfo').textContent = `${sub.length} chars, ${sub.split(' ').length} words`;
}

function copyFull(){
    const full = `SUBJECT: ${$('subject').value}\n\n${$('body').value}`;
    navigator.clipboard.writeText(full);
    toast('Full email copied');
}

function copySubject(){
    navigator.clipboard.writeText($('subject').value);
    toast('Subject copied');
}

function copyBody(){
    const html = $('body').value.split('\n\n').map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
    navigator.clipboard.writeText(html);
    toast('Body HTML copied');
}

function undo(){
    if(state.undoStack.length>1){
        state.undoStack.pop();
        $('body').value = state.undoStack[state.undoStack.length-1];
        updatePreview();
    }
}

function saveUndo(){
    const current = $('body').value;
    if(state.undoStack.length===0 || state.undoStack[state.undoStack.length-1]!==current){
        state.undoStack.push(current);
        if(state.undoStack.length>20) state.undoStack.shift();
    }
}

// Save draft
setInterval(()=>{
    localStorage.setItem('esm_draft_subject',$('subject').value);
    localStorage.setItem('esm_draft_body',$('body').value);
},5000);

// Init
if(state.apiKey) $('apiKey').value = state.apiKey;
renderPrompts();
const draftSub = localStorage.getItem('esm_draft_subject');
const draftBody = localStorage.getItem('esm_draft_body');
if(draftSub) $('subject').value = draftSub;
if(draftBody) $('body').value = draftBody;
updatePreview();
saveUndo();
</script>
</body>
</html>
